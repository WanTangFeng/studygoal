/* 一个「空」对应答案里的一个词（答案用空格分段，段数 === 空位数） */
function kbAnsParts(f){ return String(f.a||'').split(' ').filter(function(x){ return x !== ''; }); }

function kbFillCard(ci, ki, k){
  let h = '<div class="kb-kp" id="kb-my-'+ci+'-'+ki+'">';
  h += '<div class="kb-kp-hd"><span class="kb-kp-t">考点 '+k.kp+' '+esc(k.t)+'</span>'+
       (k.star>=2?'<i class="kb-hot">高频</i>':'')+
       (k.star?('<span class="kb-star">'+'★'.repeat(Math.min(k.star,3))+'</span>'):'')+'</div>';
  k.fills.forEach(function(f, fi){
    const key = kbFillKey('my',ci,ki,fi);
    const r = (S.pol.kb.fills||{})[key];
    const d = (KB_FILL[key]||{});
    const ans = kbAnsParts(f);
    const segs = f.q.split('____');
    const multi = segs.length - 1 > 1;
    h += '<div class="kb-fill'+(r?(' '+r):'')+'">';
    h += '<div class="kb-fill-q">';
    segs.forEach(function(seg, i){
      h += esc(seg);
      if(i < segs.length - 1){
        const v = (d.vs && d.vs[i] != null) ? d.vs[i] : '';
        const mark = (r && d.oks) ? (d.oks[i] ? ' ok' : ' bad') : '';
        h += '<input class="kb-fill-in'+mark+'" data-k="'+key+'" data-i="'+i+'" value="'+esc(v)+'"'+
             (r?' disabled':'')+' placeholder="空'+(i+1)+'">';
      }
    });
    h += '</div>';
    if(r){
      const allRight = (r === 'right');
      h += '<div class="kb-fill-fb'+(allRight?' ok':'')+'">'+
           (allRight ? '✓ 全部正确' : '✗ 正确答案：'+esc(ans.join(' / ')))+'</div>';
      if(f.tip) h += '<div class="kb-tip">提示：'+esc(f.tip)+'</div>';
    } else {
      h += '<div class="kb-fill-btns"><button class="btn btn-pri btn-xs" data-act="kb-judge" data-k="'+key+'">提交</button>'+
           '<button class="btn btn-line btn-xs" data-act="kb-reveal" data-k="'+key+'">看答案</button>'+
           (multi?'<span class="kb-fill-note">共 '+ans.length+' 个空</span>':'')+'</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function kbPointCard(subj, ci, pi, p){
  const key = subj+'-'+ci+'-'+pi;
  const seen = !!((S.pol.kb.seen||{})[key]);
  let h = '<div class="kb-kp'+(seen?' seen':'')+'" id="kb-'+key+'">';
  h += '<div class="kb-kp-hd"><span class="kb-kp-t">'+ (p.kp?('考点 '+p.kp+' '):'') + esc(p.t) +'</span>'+
       (p.star>=2?'<i class="kb-hot">高频</i>':(p.star?'<i class="kb-hot soft">次高频</i>':''))+
       (p.star?('<span class="kb-star">'+'★'.repeat(Math.min(p.star,3))+'</span>'):'')+
       '<span class="sp"></span>'+
       '<button class="kb-seen'+(seen?' on':'')+'" data-act="kb-seen" data-k="'+key+'" title="标记已掌握">✓</button>'+
       '</div>';
  h += '<div class="kb-kp-bd">'+ esc(p.body).replace(/\n/g,'<br>') +'</div>';
  h += '</div>';
  return h;
}

/* ---------- 史纲文稿朗读（浏览器内置语音合成，可调倍速）---------- */
const TTS_RATES = [0.8, 1.0, 1.25, 1.5, 2.0];
const TTS = { ci:-1, idx:0, paras:[], rate:1.0, speaking:false, paused:false, gen:0 };
function ttsOK(){ return !!(window && window.speechSynthesis && typeof window.SpeechSynthesisUtterance === 'function'); }
function ttsActive(ci){ return TTS.ci === ci && TTS.speaking; }
function ttsToggle(ci){
  if(!ttsOK()){ toast('这个浏览器不支持直接朗读，可以复制文稿去别的工具听'); return; }
  const ch = KB.sg[ci]; if(!ch || !ch.audio) return;
  const sy = window.speechSynthesis;
  if(TTS.ci === ci && TTS.speaking){
    if(TTS.paused){ sy.resume(); TTS.paused = false; }
    else { sy.pause(); TTS.paused = true; }
    renderPol(); return;
  }
  TTS.gen++;
  sy.cancel();
  TTS.ci = ci; TTS.idx = 0; TTS.rate = S.ui.ttsRate || TTS.rate || 1.0;
  TTS.paras = String(ch.audio.text).split('\n\n').filter(function(x){ return x.trim(); });
  TTS.speaking = true; TTS.paused = false;
  ttsNext(); renderPol();
}
function ttsNext(){
  if(!TTS.speaking) return;
  if(TTS.idx >= TTS.paras.length){ ttsStop(true); renderPol(); return; }
  const g = TTS.gen;
  const u = new window.SpeechSynthesisUtterance(TTS.paras[TTS.idx]);
  u.lang = 'zh-CN'; u.rate = TTS.rate; u.pitch = 1;
  u.onend = function(){
    if(g !== TTS.gen || !TTS.speaking || TTS.paused) return;
    TTS.idx++; ttsPaint(); ttsNext();
  };
  u.onerror = function(){};
  try { window.speechSynthesis.speak(u); } catch(e){ ttsStop(false); renderPol(); }
  ttsPaint();
}
function ttsStop(finished){
  TTS.gen++;
  if(ttsOK()){ try { window.speechSynthesis.cancel(); } catch(e){} }
  TTS.speaking = false; TTS.paused = false;
  if(!finished) TTS.idx = 0;
}
function ttsRate(r){
  TTS.rate = r;
  if(S.ui){ S.ui.ttsRate = r; save(); }
  if(TTS.speaking){
    TTS.gen++;
    if(ttsOK()) { try { window.speechSynthesis.cancel(); } catch(e){} }
    TTS.paused = false;
    ttsNext();
  }
  renderPol();
}
/* 高亮当前正在读的段落，并刷新进度文字 */
function ttsPaint(){
  const ps = document.querySelectorAll('#tab-pol .kb-tts-para');
  Array.prototype.forEach.call(ps, function(el){
    const cur = TTS.speaking && !TTS.paused && Number(el.dataset.ci) === TTS.ci && Number(el.dataset.para) === TTS.idx;
    el.classList.toggle('cur', !!cur);
  });
  const n = document.getElementById('ttsProg');
  if(n){
    n.textContent = TTS.speaking
      ? ((TTS.paused ? '已暂停' : '朗读中') + ' · 第 ' + Math.min(TTS.idx + 1, TTS.paras.length) + '/' + TTS.paras.length + ' 段')
      : '';
  }
}

function kbAudioCard(ci, ch){
  const key = 'sg-a-'+ci;
  const open = !!KB_OPEN[key];
  const mins = Math.max(1, Math.round(ch.audio.text.length/200));
  const on = ttsActive(ci);
  let h = '<div class="kb-audio">';
  h += '<button class="kb-audio-hd" data-act="kb-toggle" data-k="'+key+'">'+
       '<span class="kb-audio-ic">▶</span>'+
       '<span class="kb-audio-t">听这一章的故事 ·《'+esc(ch.audio.title)+'》</span>'+
       '<span class="sp"></span><span class="kb-audio-m">约 '+mins+' 分钟</span></button>';
  if(open){
    h += '<div class="kb-audio-bd">';
    if(ttsOK()){
      const label = !on ? '▶ 开始朗读' : (TTS.paused ? '▶ 继续' : '⏸ 暂停');
      h += '<div class="kb-tts">'+
             '<button class="kb-tts-play" data-act="tts-toggle" data-ci="'+ci+'">'+label+'</button>'+
             (on ? '<button class="kb-tts-stop" data-act="tts-stop">停止</button>' : '')+
             '<span class="kb-tts-spd">'+TTS_RATES.map(function(r){
                return '<button class="'+(Math.abs(TTS.rate-r)<0.001?'on':'')+'" data-act="tts-rate" data-r="'+r+'">'+r+'×</button>';
             }).join('')+'</span>'+
             '<span class="kb-tts-prog" id="ttsProg">'+(on ? ((TTS.paused?'已暂停':'朗读中')+' · 第 '+Math.min(TTS.idx+1,TTS.paras.length)+'/'+TTS.paras.length+' 段') : '')+'</span>'+
           '</div>'+
           '<div class="kb-audio-note">点「开始朗读」直接听，可随时切倍速。声音由设备自带语音合成，效果因浏览器而异。</div>';
    } else {
      h += '<div class="kb-audio-note">当前浏览器不支持直接朗读，点下面的文稿复制到「微信读书 / 剪映 / 讯飞」等工具也能听。</div>';
    }
    const paras = String(ch.audio.text).split('\n\n');
    h += '<div class="kb-audio-txt">' + paras.map(function(p, i){
      const cur = (on && !TTS.paused && i === TTS.idx) ? ' cur' : '';
      return '<span class="kb-tts-para'+cur+'" data-para="'+i+'" data-ci="'+ci+'">'+esc(p)+'</span>';
    }).join('<br><br>') + '</div>';
    h += '<button class="btn btn-line btn-xs" data-act="kb-copy" data-ci="'+ci+'">复制本讲文稿</button>';
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function kbSearchBar(){
  const nQ = KB_SEARCH.trim();
  const total = KB.my.reduce(function(a,c){return a+c.kps.length;},0)
              + KB.mt.reduce(function(a,c){return a+c.points.length;},0)
              + KB.sg.reduce(function(a,c){return a+c.points.length;},0);
  let h = '<div class="polsearch">';
  h += '<div class="polsearch-box">';
  h += '<span class="polsearch-ic">'+ic('search',19,2)+'</span>';
  h += '<input id="kbSearch" class="polsearch-in" placeholder="搜索三本书的知识点…" value="'+esc(KB_SEARCH)+'" autocomplete="off" spellcheck="false">';
  if(nQ) h += '<button class="polsearch-x" data-act="kb-search-clear" aria-label="清空">'+ic('x',14,2.2)+'</button>';
  else   h += '<span class="polsearch-badge">'+total+' 个知识点</span>';
  h += '</div>';
  if(!nQ) h += '<div class="polsearch-hint">搜「实践」「矛盾」「遵义会议」「中国式现代化」试试 · 马哲 / 毛特 / 史纲全覆盖</div>';
  h += '</div>';
  return h;
}

function kbSearchResults(q){
  const nq = kbNorm(q);
  const hits = [];
  ['my','mt','sg'].forEach(function(subj){
    KB[subj].forEach(function(ch, ci){
      const items = subj==='my' ? ch.kps : ch.points;
      items.forEach(function(it, ii){
        const title = it.t || '';
        const body = subj==='my'
          ? it.fills.map(function(f){return f.q+' '+f.a;}).join(' ')
          : (it.body||'');
        if(kbNorm(title).indexOf(nq)>=0 || kbNorm(body).indexOf(nq)>=0){
          hits.push({subj:subj, ci:ci, ii:ii, ch:ch.ch, t:title, snippet:kbSnippet(body, nq)});
        }
      });
    });
  });
  const by = { all:hits.length, my:0, mt:0, sg:0 };
  hits.forEach(function(x){ by[x.subj]++; });

  let h = '<div class="sec kb-sres">';
  h += '<div class="kb-chips">'+
    [['all','全部'],['my','马哲'],['mt','毛特'],['sg','史纲']].map(function(f){
      return '<button class="kb-chip'+(KB_SRES_SUBJ===f[0]?' on':'')+'" data-act="kb-sres-subj" data-s="'+f[0]+'">'+
             f[1]+'<i>'+by[f[0]]+'</i></button>';
    }).join('')+'</div>';

  const list = KB_SRES_SUBJ==='all' ? hits : hits.filter(function(x){ return x.subj===KB_SRES_SUBJ; });
  if(!list.length){
    h += '<div class="card empty">'+ic('search',30,1.6)+'<b>没有找到</b><span>换个关键词，或点上面「全部」看看。</span></div>';
  }
  list.slice(0,150).forEach(function(x){
    h += '<button class="kb-sres-item" data-act="kb-jump" data-subj="'+x.subj+'" data-ci="'+x.ci+'" data-ii="'+x.ii+'">'+
         '<div class="kb-sres-t">'+esc(x.t)+'</div>'+
         '<div class="kb-sres-m"><i class="kb-sres-tag">'+KB_META[x.subj].name+'</i>'+esc(x.ch)+'</div>'+
         '<div class="kb-sres-s">'+esc(x.snippet)+'</div></button>';
  });
  h += '</div>';
  return h;
}
function kbSnippet(body, nq){
  const plain = String(body||'').replace(/\n/g,' ');
  const pos = kbNorm(plain).indexOf(nq);
  if(pos<0) return plain.slice(0,48)+(plain.length>48?'…':'');
  const s = Math.max(0, pos-14), e = Math.min(plain.length, pos+30);
  return (s>0?'…':'')+plain.slice(s,e)+(e<plain.length?'…':'');
}

function kbWrongPanel(){
  const wk = Object.keys(S.pol.kb.wrong||{});
  let h = '<div class="sec"><button class="btn btn-line btn-xs" data-act="kb-wrong-back">← 返回知识点</button><div style="height:10px"></div>';
  if(!wk.length){ h += '<div class="card empty">'+ic('cap',30,1.6)+'<b>错题本是空的</b><span>填空题答错后会自动进到这里。</span></div></div>'; return h; }
  wk.forEach(function(key){
    const p = key.split('-');
    const ci=+p[1], ki=+p[2], fi=+p[3];
    const k = KB.my[ci] && KB.my[ci].kps && KB.my[ci].kps[ki];
    if(!k) return;
    const f = k.fills[fi]; if(!f) return;
    const w = S.pol.kb.wrong[key];
    const qp = f.q.split('____');
    const ap = kbAnsParts(f);
    let qline = '';
    qp.forEach(function(seg, i){
      qline += esc(seg);
      if(i < qp.length - 1) qline += '<b class="kb-ans">'+esc(ap[i]||'')+'</b>';
    });
    h += '<div class="kb-kp"><div class="kb-kp-hd"><span class="kb-kp-t">考点 '+k.kp+' '+esc(k.t)+'</span>'+
         '<span class="sp"></span>'+(w.due<=todayStr()?'<i class="kb-hot">该复习</i>':'')+'</div>'+
         '<div class="kb-fill-q">'+qline+'</div></div>';
  });
  h += '</div>';
  return h;
}

function kbQuizPanel(subj){
  if(!KB_QUIZ || KB_QUIZ.subj!==subj) return '';
  const q = KB_QUIZ;
  if(q.finished){
    const scored = (subj==='my');
    return '<div class="sec kb-quiz"><div class="kb-quiz-hd">随机抽查结束</div>'+
      '<div class="kb-quiz-score">'+(scored?('答对 <b>'+q.ok+'</b> / '+q.total):('已复习 '+q.total+' 个知识点'))+'</div>'+
      '<div class="kb-acts"><button class="btn btn-line btn-xs" data-act="kb-quiz">再来一组</button>'+
      '<button class="btn btn-line btn-xs" data-act="kb-quiz-close">关闭</button></div></div>';
  }
  const item = q.items[q.idx];
  if(!item) return '';
  let h = '<div class="sec kb-quiz"><div class="kb-quiz-hd">随机抽查 · 第 '+(q.idx+1)+'/'+q.total+' 题</div>';
  if(subj==='my'){
    const qp = item.q.split('____');
    h += '<div class="kb-fill-q">';
    qp.forEach(function(seg,i){
      h += esc(seg);
      if(i<qp.length-1){
        if(!item.revealed){
          const v = (item.vs && item.vs[i] != null) ? item.vs[i] : '';
          h += '<input class="kb-fill-in kb-quiz-in" data-i="'+i+'" value="'+esc(v)+'" placeholder="空'+(i+1)+'">';
        } else {
          const m = (item.oks && item.oks[i] === false) ? ' bad' : '';
          h += '<b class="kb-ans2'+m+'">'+esc((item.a[i]!=null?item.a[i]:''))+'</b>';
        }
      }
    });
    h += '</div>';
    if(item.revealed){
      h += '<div class="kb-fill-fb'+(item.ok?' ok':'')+'">'+(item.ok?'✓ 答对了':('✗ 正确答案：'+esc(item.a.join(' / '))))+'</div>'+
           '<button class="btn btn-pri btn-xs" data-act="kb-quiz-next">'+(q.idx+1>=q.total?'看结果':'下一题')+'</button>';
    } else {
      h += '<div class="kb-acts"><button class="btn btn-pri btn-xs" data-act="kb-quiz-submit">提交</button>'+
           '<button class="btn btn-line btn-xs" data-act="kb-quiz-reveal">看答案</button>'+
           '<button class="btn btn-line btn-xs" data-act="kb-quiz-close">退出</button></div>';
    }
  } else {
    h += '<div class="kb-quiz-q">'+esc(item.prompt)+'</div>';
    if(item.revealed){
      h += '<div class="kb-quiz-a">'+esc(item.a).replace(/\n/g,'<br>')+'</div>'+
           '<button class="btn btn-pri btn-xs" data-act="kb-quiz-next">'+(q.idx+1>=q.total?'看结果':'下一题')+'</button>';
    } else {
      h += '<div class="kb-acts"><button class="btn btn-pri btn-xs" data-act="kb-quiz-reveal">显示答案</button>'+
           '<button class="btn btn-line btn-xs" data-act="kb-quiz-close">退出</button></div>';
    }
  }
  h += '</div>';
  return h;
}

/* ---------- 知识库交互 ---------- */
function kbAnswerOk(input, ans){
  const a = kbNorm(input), b = kbNorm(ans);
  if(!a || !b) return false;
  if(a === b) return true;
  if(a.length >= 2 && (b.indexOf(a) >= 0 || a.indexOf(b) >= 0)) return true;
  return false;
}
function kbJudge(key){
  const p = key.split('-'); const ci=+p[1], ki=+p[2], fi=+p[3];
  const ch = KB.my[ci]; if(!ch) return;
  const k = ch.kps[ki]; if(!k) return;
  const f = k.fills[fi]; if(!f) return;
  const ans = kbAnsParts(f);
  const d = KB_FILL[key] || {};
  const vs = ans.map(function(_, i){ return String((d.vs && d.vs[i]) || '').trim(); });
  if(!vs.some(function(v){ return v; })){ toast('先填空'); return; }
  const oks = ans.map(function(a, i){ return kbAnswerOk(vs[i], a); });
  const allOk = oks.every(function(x){ return x; });
  if(!S.pol.kb.fills) S.pol.kb.fills = {};
  if(!S.pol.kb.wrong) S.pol.kb.wrong = {};
  S.pol.kb.fills[key] = allOk ? 'right' : 'wrong';
  if(allOk){ if(S.pol.kb.wrong[key]) delete S.pol.kb.wrong[key]; }
  else { S.pol.kb.wrong[key] = { added:todayStr(), due:dAdd(todayStr(), S.pol.settings.remindDays) }; }
  KB_FILL[key] = { vs: vs, oks: oks };
  save(); renderPol();
  if(allOk) toast('全对，漂亮');
  else {
    const badN = oks.filter(function(x){ return !x; }).length;
    toast('答错 '+badN+' 个空，已加入错题本');
  }
}
function kbReveal(key){
  const p = key.split('-'); const ci=+p[1], ki=+p[2], fi=+p[3];
  const ch = KB.my[ci]; if(!ch) return;
  const f = ch.kps[ki] && ch.kps[ki].fills[fi]; if(!f) return;
  KB_FILL[key] = { vs: kbAnsParts(f).slice() };
  renderPol();
}
function kbJump(subj, ci, ii){
  KB_SEARCH = ''; KB_WRONGMODE = false; KB_QUIZ = null; KB_SRES_SUBJ = 'all';
  POL_SUB = subj;
  KB_OPEN[subj+'-c-'+ci] = true;
  renderPol();
  setTimeout(function(){
    const node = el('kb-'+(subj==='my' ? ('my-'+ci+'-'+ii) : (ci+'-'+ii)));
    if(node) node.scrollIntoView({ behavior:'smooth', block:'center' });
    if(node){ node.classList.add('kb-flash'); setTimeout(function(){ node.classList.remove('kb-flash'); }, 1600); }
  }, 60);
}
function kbCopyAudio(ci){
  const ch = KB.sg[ci]; if(!ch || !ch.audio) return;
  const txt = '《'+ch.audio.title+'》\n'+ch.ch+'\n\n'+ch.audio.text;
  function done(){ toast('文稿已复制，去朗读工具里粘贴即可'); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){ kbCopyFallback(txt, done); });
  } else { kbCopyFallback(txt, done); }
}
function kbCopyFallback(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请长按选择文字复制'); }
  document.body.removeChild(ta);
}
function kbQuizStart(subj){
  if(KB_QUIZ && KB_QUIZ.subj===subj){ KB_QUIZ = null; renderPol(); return; }
  const pool = [];
  if(subj==='my'){
    KB.my.forEach(function(ch,ci){ ch.kps.forEach(function(k,ki){ k.fills.forEach(function(f,fi){
      pool.push({ q:f.q, a:kbAnsParts(f) });
    }); }); });
  } else {
    KB[subj].forEach(function(ch,ci){ ch.points.forEach(function(p,pi){
      pool.push({ prompt:'请回忆「'+p.t+'」的要点（'+ch.ch+'）', a:String(p.body||'').replace(/\n/g,'\n') });
    }); });
  }
  if(!pool.length){ toast('暂无可抽查内容'); return; }
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  const N = Math.min(subj==='my'?10:6, pool.length);
  const items = pool.slice(0,N).map(function(x){
    return { q:x.q||'', a:x.a, prompt:x.prompt||'', revealed:false, ok:false };
  });
  KB_QUIZ = { subj:subj, items:items, idx:0, ok:0, total:N, finished:false };
  renderPol();
}

document.addEventListener('click', function(ev){
  const nav = ev.target.closest('[data-tab]');
  if(nav){ go(nav.dataset.tab); return; }

  const sw = ev.target.closest('.sw');
  if(sw && el('f_sw')){
    Array.prototype.forEach.call(el('f_sw').querySelectorAll('.sw'), function(x){ x.classList.remove('on'); });
    sw.classList.add('on'); return;
  }

  const b = ev.target.closest('[data-act]');
  if(!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if(b.tagName==='A') ev.preventDefault();

  switch(a){
    case 'new-cat':    catForm(null); break;
    case 'edit-cat':   catForm(S.cats.filter(function(x){return x.id===id;})[0]); break;
    case 'savecat':    saveCat(id); break;
    case 'del-cat':    askDelCat(id); break;
    case 'dodel-cat':  doDelCat(id); break;
    case 'add-plan':   { const c=S.cats.filter(function(x){return x.id===id;})[0]; if(c) subPlanForm(c,null); break; }
    case 'save-plan':  savePlan(b.dataset.cid, b.dataset.pid); break;
    case 'edit-plan':  { const c=S.cats.filter(function(x){return x.id===b.dataset.cid;})[0]; if(c){ const p=(c.plans||[]).filter(function(x){return x.id===b.dataset.pid;})[0]; if(p) subPlanForm(c,p); } break; }
    case 'del-plan':   delPlan(b.dataset.cid, b.dataset.pid); break;
    case 'checkin-toggle': {
      const cid=b.dataset.id, d=todayStr();
      const c = S.cats.filter(function(x){return x.id===cid;})[0]; if(!c) break;
      if(catChecked(c,d)){
        delete c.checkins[d];
        setAllPlansToday(c, false);
      } else {
        c.checkins[d] = { at:new Date().toISOString() };
        setAllPlansToday(c, true);
      }
      save();
      if(TAB==='today') renderToday(); else if(TAB==='board') renderBoard();
      renderNav(); renderTopStrip();
      break;
    }
    case 'toggle-sec': {
      var secId = b.dataset.sec;
      var sec = el('sec-'+secId);
      if(sec){
        var collapsed = sec.classList.toggle('collapsed');
        if(secId === 'overview'){ S.overviewCollapsed = collapsed; save(); }
        if(secId === 'yvocab'){ S.vocabCollapsed = collapsed; save(); }
      }
      break;
    }
    case 'tick-plan': {
      const cid=b.dataset.cid, pid=b.dataset.pid, d=todayStr();
      const c = S.cats.filter(function(x){return x.id===cid;})[0]; if(!c) break;
      const p = (c.plans||[]).filter(function(x){return x.id===pid;})[0]; if(!p) break;
      p.done = p.done || {};
      if(p.done[d]) delete p.done[d]; else p.done[d] = true;
      /* 联动：全部子计划完成 → 自动打卡标签；有未完成的 → 若标签当前已打卡则取消 */
      const allDone = allPlansDoneToday(c);
      if(allDone === true && !catChecked(c,d)){
        c.checkins[d] = { at:new Date().toISOString() };
      } else if(allDone === false && catChecked(c,d)){
        /* 只有当"所有子计划都完成"这个条件不再满足时才取消标签打卡
           但如果用户手动打过卡（比如根本没有子计划），不应该被取消 */

      if(rec && rec.words) rec.words.forEach(function(x){ if(x.w) have[x.w.trim().toLowerCase()] = 1; });
      pool = pool.filter(function(x){ return !have[x.w.trim().toLowerCase()]; });
      if(!pool.length){ toast('该日已包含全部历史生词，无需再生成'); break; }
      for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
      const take = pool.slice(0, n);
      if(!S.vocab[dt]) S.vocab[dt] = { words:[], eng2done:false, eng2allright:false, review:{} };
      S.vocab[dt].eng2done = true;
      S.vocab[dt].words = S.vocab[dt].words || [];
      take.forEach(function(x){ S.vocab[dt].words.push({ w:x.w, m:x.m }); });
      save(); closeModal();
      if(TAB==='today') renderToday();
      if(TAB==='board') renderBoard();
      toast('已从以往生词随机生成 '+take.length+' 个到 '+md(dt)+'（'+wdOf(dt)+'）');
      break;

    /* ---- 考研政治时政 ---- */

      S.pol.stars[pid] = (cur >= 3) ? 0 : (cur + 1);

    case 'pol-pick':   { polPick(b.dataset.id, b.dataset.k); break; }

function fallbackCopy(txt){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制到剪贴板'); }
  catch(e){ toast('复制失败，请手动长按选中'); }
  document.body.removeChild(ta);

/* 周报四栏：输入即存 */
let saveT = null;
document.addEventListener('input', function(ev){
  const t = ev.target.closest('[data-four]');
  if(t){
    const mon = WEEK_CURSOR;
    if(!S.weekly[mon]) S.weekly[mon] = { keep:'', problem:'', tryNext:'', plan:'' };
    S.weekly[mon][t.dataset.four] = t.value;
    clearTimeout(saveT);
    saveT = setTimeout(function(){
      save();
      const tip = el('savedTip');
      if(tip){ tip.classList.add('on'); setTimeout(function(){ tip.classList.remove('on'); }, 1200); }
    }, 350);
    return;
  }
  /* 真题录入表单：边填边算 */
  const pr = ev.target.closest('[data-prow]');
  if(pr && PF){
    const k = pr.dataset.prow, r = PF.rows[k];
    if(!r) return;
    const raw = pr.value.trim();
    if(pr.dataset.kind==='subq'){
      const qi = Number(pr.dataset.qi);
      r.scores[qi] = raw==='' ? '' : Number(raw);
      const any = r.scores.some(function(x){ return x!=='' && isFinite(Number(x)) && Number(x)>0; });
      r.on = any;
    } else {
      r.score = raw==='' ? '' : Number(raw);
      r.on = raw!=='' && isFinite(r.score) && r.score>=0;
    }
    pfRefresh(k);
  }
});

/* 遮罩 / ESC 关闭 */
el('mask').addEventListener('click', function(ev){ if(ev.target===el('mask')) closeModal(); });
document.addEventListener('keydown', function(ev){
  if(ev.key==='Escape' && el('mask').classList.contains('on')){ closeModal(); return; }
  /* ---- 时政刷题快捷键 ---- */
  if(TAB!=='pol' || POL_SUB!=='sz') return;
  const tp = el('tab-pol');
  if(!tp || tp.classList.contains('hide')) return;
  if(KB_SEARCH && KB_SEARCH.trim()) return;
  const tg = (ev.target && ev.target.tagName || '').toUpperCase();
  if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT') return;
  if(ev.metaKey||ev.ctrlKey||ev.altKey) return;
  const dk = polDeck(); if(!dk.length) return;
  const cid = dk[Math.max(0, Math.min(POL_IDX, dk.length-1))];
  const cit = polById(cid); if(!cit) return;
  const shown = (POL_KIND==='recite') ? true
              : (POL_KIND==='exam') ? !!(POL_EXAM && POL_EXAM.graded)
              : !!S.pol.res[cid];
  if(ev.key==='ArrowLeft'){ ev.preventDefault(); polGo(POL_IDX-1); return; }
  if(ev.key==='ArrowRight'){ ev.preventDefault(); polGo(POL_IDX+1); return; }
  if(ev.key==='Enter'){
    ev.preventDefault();
    if(shown) polGo(POL_IDX+1);
    else if(POL_KIND==='practice') polSubmit();
    return;
  }
  const km = /^([a-hA-H1-8])$/.exec(ev.key);
  if(km && !shown){
    const raw = km[1].toUpperCase();
    const k = /[1-8]/.test(raw) ? String.fromCharCode(64 + Number(raw)) : raw;
    if(cit.opts[k]){ ev.preventDefault(); polPick(cid, k); }
  }
});

<script>
/* PWA 安装提示（beforeinstallprompt） */
(function(){
  var bar=document.getElementById('pwaInstallBar');
  var btn=document.getElementById('pwaInstallBtn');
  var dis=document.getElementById('pwaDismissBtn');
  if(!bar) return;
  var deferredPrompt=null;
  // 浏览器发出"可安装"信号时显示提示条
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();
    deferredPrompt=e;
    bar.classList.add('show');
  });
  // 用户点"安装"
  if(btn) btn.addEventListener('click',function(){
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(choice){
      deferredPrompt=null;
      if(choice.outcome==='accepted'){
        bar.classList.remove('show');
      }
    }).catch(function(){});
  });
  // 用户点关闭
  if(dis) dis.addEventListener('click',function(){
    bar.classList.remove('show');
    deferredPrompt=null; // 本次会话不再弹出
  });
  // 已安装则隐藏
  window.addEventListener('appinstalled',function(){
    bar.classList.remove('show');
    deferredPrompt=null;
  });
})();
</script>
