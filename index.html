const POL = [{"id": 1, "type": "sc", "q": "当前国际局势变乱交织，中英作为联合国安理会常任理事国和世界主要经济体，无论是维护世界和平稳定，还是促进两国经济民生，都需要加强对话和合作。中方愿同英方秉持大历史观，超越分歧、相互尊重，把中英合作“大有可为”的潜力转化成“大有作为”的实绩，为中英关系与合作开新局，既造福两国人民，也惠及世界。国与国关系行稳致远的基础是（）", "opts": {"A": "互利", "B": "合作", "C": "互信", "D": "平等"}, "ans": "C", "exp": "习近平指出，当前国际局势变乱交织，中英作为联合国安理会常任理事国和世界主要经济体，无论是维护世界和平稳定，还是促进两国经济民生，都需要加强对话和合作。中方愿同英方秉持大历史观，超越分歧、相互尊重，把中英合作“大有可为”的潜力转化成“大有作为”的实绩，为中英关系与合作开新局，既造福两国人民，也惠及世界。习近平强调，互信是国与国关系行稳致远的基础。中国始终坚持走和平发展道路，从未主动挑起过一场战争，从未侵占过别国一寸土地，中国无论怎样发展壮大都不会对其他国家构成威胁。中国的文化传统是“以和为贵”，追求的是“和而不同”。中英经贸合作的本质是互利共赢。"}, {"id": 2, "type": "sc", "q": "党的二十届四中全会分析了当前形势和任务，审议通过了《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》。《建议》确定的“十五五”时期经济社会发展的主题是（）", "opts": {"A": "构建新发展格局", "B": "推动高质量发展", "C": "推动全体人民共同富裕迈出坚实步伐", "D": "发展新质生产力"}, "ans": "B", "exp": "在贯彻落实全会精神过程中，要着重把握以下几点。第一，坚定不移推动高质量发展。推动高质量发展是《建议》确定的“十五五”时期经济社会发展的主题。发展新质生产力是高质量发展的内在要求。第二，加快构建新发展格局。做强国内大循环、畅通国内国际双循环，是我们把握发展主动权、塑造国际合作和竞争新优势的战略举措。第三，推动全体人民共同富裕迈出坚实步伐。第四，更好统筹发展和安全。第五，统筹推进各领域工作。"}, {"id": 3, "type": "sc", "q": "时隔10年，党中央再次召开城市工作会议，主要是总结新时代以来我国城市发展成就，分析城市工作面临的形势，对当前和今后一个时期城市工作作出部署。在当前和今后一个时期城市工作的总体要求中提出走出一条中国特色城市现代化新路子，其中重要抓手是（）", "opts": {"A": "建设创新、宜居、美丽、韧性、文明、智慧的现代化人民城市", "B": "推动城市高质量发展", "C": "坚持城市内涵式发展", "D": "推进城市更新001修齐时政终极押题习题册单项选择题"}, "ans": "D", "exp": "当前和今后一个时期城市工作的总体要求是：以新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届二中、三中全会精神，坚持和加强党的全面领导，认真践行人民城市理念，坚持稳中求进工作总基调，坚持因地制宜、分类指导，以建设创新、宜居、美丽、韧性、文明、智慧的现代化人民城市为目标，以推动城市高质量发展为主题，以坚持城市内涵式发展为主线，以推进城市更新为重要抓手，大力推动城市结构优化、动能转换、品质提升、绿色转型、文脉赓续、治理增效，牢牢守住城市安全底线，走出一条中国特色城市现代化新路子。"}, {"id": 4, "type": "sc", "q": "习近平总书记在中央城市工作会议上的讲话中强调，落实当前和今后一个时期城市工作的总体要求的关键在于（）", "opts": {"A": "坚持城市内涵式发展", "B": "推动城市发展能级大幅提升", "C": "坚持城市生态环境质量提升", "D": "推动城市高质量发展"}, "ans": "A", "exp": "当前和今后一个时期城市工作的总体要求是：以新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届二中、三中全会精神，坚持和加强党的全面领导，认真践行人民城市理念，坚持稳中求进工作总基调，坚持因地制宜、分类指导，走出一条中国特色城市现代化新路子。落实这一总体要求，关键在于坚持城市内涵式发展。"}, {"id": 5, "type": "sc", "q": "党的十八大以来，党中央深刻把握新形势下我国城市发展规律，坚持党对城市工作的全面领导，坚持人民城市人民建、人民城市为人民，坚持把城市作为有机生命体系统谋划，推动城市发展取得历史性成就。城市工作的出发点和落脚点是（）", "opts": {"A": "优化城市功能结构和空间布局", "B": "实现人民群众对美好生活向往", "C": "打破“重建设、轻治理”的传统思维和习惯做法", "D": "提升资源和空间集约节约利用水平"}, "ans": "B", "exp": "一是转变城市发展理念，更加注重以人为本。把实现人民群众对美好生活向往作为城市工作的出发点和落脚点，努力建设现代化人民城市，扎实推进全体人民共同富裕，促进人的全面发展。二是转变城市发展方式，更加注重集约高效。优化城市功能结构和空间布局，提升资源和空间集约节约利用水平，实现绿色低碳智慧发展。三是转变城市发展动力，更加注重特色发展。根据各002修齐时政终极押题答案册·单项选择题自资源禀赋，加强科技和文化赋能，打造核心竞争力，实现错位发展，不搞同质化竞争。四是转变城市工作重心，更加注重治理投入。打破“重建设、轻治理”的传统思维和习惯做法，推动城市高质量更新、高水平运营、高效能治理。五是转变城市工作方法，更加注重统筹协调。系统谋划生产、生活、生态、文化、安全等各方面工作，加强跨部门跨层级跨区域协调联动，使政府、市场、社会、市民更好形成合力。"}, {"id": 6, "type": "sc", "q": "“十五五”时期，我国发展环境面临深刻复杂变化，战略机遇和风险挑战并存，不确定难预料因素增多。这构成了扩大高水平对外开放的“背景板”。但我国也具备主动运筹国际空间、塑造外部环境的许多有利因素。我国经济基础稳、优势多、韧性强、潜能大，扩大高水平对外开放具备诸多有利条件。总体上看，机遇仍然大于挑战。从开放条件看，（）", "opts": {"A": "是风高浪急的承压期", "B": "是新旧转换的重塑期", "C": "是改革突破的攻坚期", "D": "是命运与共的推进期"}, "ans": "C", "exp": "总体上看，机遇仍然大于挑战。可以概括为四个“期”。从开放环境看，是风高浪急的承压期。从开放动能看，是新旧转换的重塑期。从开放条件看，是改革突破的攻坚期。从开放愿景看，是命运与共的推进期。"}, {"id": 7, "type": "sc", "q": "今年中美两国各自都有不少重要议程，中国“十五五”开局起步，美国迎来建国250周年，两国分别主办亚太经合组织领导人非正式会议、二十国集团领导人峰会。美方有美方的关切，中方有中方的关切。中方言必信，行必果，说到做到。只要双方秉持平等、尊重、互惠的态度相向而行，就可以找到解决彼此关切的办法。中美关系中最重要的问题是（）", "opts": {"A": "金融风险问题002修齐时政终极押题习题册单项选择题", "B": "贸易问题", "C": "人工智能问题", "D": "台湾问题"}, "ans": "D", "exp": "习近平强调，台湾问题是中美关系中最重要的问题。台湾是中国的领土，中方必须捍卫国家主权和领土完整，永远不可能让台湾分裂出去。美方务必慎重处理对台军售问题。"}, {"id": 8, "type": "sc", "q": "党的十八大以来，我们积极探索新时代金融发展规律，不断加深对中国特色社会主义金融本质的认识，不断推进金融实践创新、理论创新、制度创新，积累了宝贵经验，逐步走出一条中国特色金融发展之路。作为金融工作的永恒主题的是（）", "opts": {"A": "党中央对金融工作的集中统一领导", "B": "以人民为中心", "C": "金融服务实体经济", "D": "防控风险"}, "ans": "D", "exp": "党的十八大以来，我们积极探索新时代金融发展规律，不断加深对中国特色社会主义金融本质的认识，不断推进金融实践创新、理论创新、制度创新，积累了宝贵经验，逐步走出一条中国特色金融发展之路。第一，坚持党中央对金融工作的集中统一领导。党的领导是中国特色金融发展之路最本质的特征，是我国金融发展最大的政治优势、制度优势。第二，坚持以人民为中心的价值取向。第三，坚持把金融服务实体经济作为根本宗旨。实体经济是金融的根基，金融是实体经济的血脉，服务实体经济是金融的天职。第四，坚持把防控风险作为金融工作的永恒主题。第五，坚持在市场化法治化轨道上推进金融创新发展。第六，坚持深化金融供给侧结构性改革。第七，坚持统筹金融开放和安全。第八，坚持稳中求进工作总基调。"}, {"id": 9, "type": "sc", "q": "进入新时代，以习近平同志为核心的党中央全面准确、坚定不移贯彻“一国两制”方针，强调“一国两制”方针的最高原则是（）", "opts": {"A": "维护国家主权、安全、发展利益", "B": "坚持加强依法治理", "C": "确保中央行使全面管治权", "D": "全面落实爱国者治理"}, "ans": "A", "exp": "进入新时代，以习近平同志为核心的党中央全面准确、坚定不移贯彻“一国两制”方针，强调维护国家主权、安全、发展利益是“一国两制”方针的最高原则。坚持和完善“一国两制”制度体系：加强依法治理相关制度和机制建设；健全中央行使全面管治权的制度；为落实爱国者治理提供制度保障。"}, {"id": 10, "type": "sc", "q": "习近平总书记在深入推进雄安新区高质量建设和发展座谈会上强调，要牢牢把握雄安新区作为北京非首都功能疏解集中承载地的首要功能定位，保持战略定力和历史耐心，进一步解放思想、开拓思路、加强协调、凝聚合力。其中，激发新区活力的重点是（）", "opts": {"A": "内生发展动力增强", "B": "综合承载能力提升", "C": "要素资源合理集聚", "D": "支持疏解单位发展003修齐时政终极押题习题册单项选择题"}, "ans": "C", "exp": "中共中央总书记、国家主席、中央军委主席习近平在河北雄安新区考察，主持召开深入推进雄安新区高质量建设和发展座谈会并发表重要讲话。他强调，要牢牢把握雄安新区作为北京非首都功能疏解集中承载地的首要功能定位，保持战略定力和历史耐心，进一步解放思想、开拓思路、加强协调、凝聚合力，以改革创新为引领增强内生发展动力，以要素资源合理集聚为重点激发新区活力，努力建设新时代创新高地和推动高质量发展样板。003修齐时政终极押题答案册·单项选择题"}, {"id": 11, "type": "sc", "q": "2026年3月5日，李强总理代表国务院在十四届全国人大四次会议上作《政府工作报告》。今年的政府工作报告，一些新词热词备受关注，其中，在加紧培育壮大新动能中，首次出现的提法是（）", "opts": {"A": "优化提升传统产业", "B": "扩能提质服务业", "C": "培育壮大新兴产业和未来产业", "D": "打造智能经济新形态"}, "ans": "D", "exp": "今年《政府工作报告》提到这些新词：“城乡居民增收计划”“中小学春秋假”“未来能源”“中国服务”“智能经济新形态”“新基建工程”“卫星互联网”“地方政府招商引资鼓励和禁止事项清单”“世界级城市群”。2026年政府工作报告首次提出“打造智能经济新形态”，体现了中国经济从数字化向智能化的时代跃迁，更彰显了“十五五”时期中国将大力发展智能经济的战略决心。打造智能经济新形态，意味着中国智能经济的发展逻辑已从局部技术赋能，跃升为对产业链、供应链、创新链的系统性重塑与整体性升级。"}, {"id": 12, "type": "sc", "q": "当“不确定性”成为描述当今时代情绪的高频词，国际社会将中国视为“可预测伙伴”，是对中国稳定性和成长性的高度认同，彰显中国之治、中国发展的世界意义。中国的“可预测性”，归根结底，源于一个始终不变的价值坐标（）", "opts": {"A": "政策的持续连贯、治理的高效推进", "B": "中国对外政策的确定性与责任感", "C": "中国以自身发展赋能全球的确定性", "D": "让人民过上更好的生活"}, "ans": "D", "exp": "当“不确定性”成为描述当今时代情绪的高频词，国际社会将中国视为“可预测伙伴”，是对中国稳定性和成长性的高度认同，彰显中国之治、中国发展的世界意义。“可预测”源于政策的持续连贯、治理的高效推进。“可预测”源于中国对外政策的确定性与责任感。“可预测”源于中国以自身发展赋能全球的确定性。归根结底，中国的“可预测性”，源于一个始终不变的价值坐标：让人民过上更好的生活。中国期待一个稳定的外部发展环境，也希望以自身发展让世界更美好，“世界好，中国才能好；中国好，世界才更好”这一逻辑让中国始终以博大情怀关照人类命运，坚定做世界的和平力量、稳定力量、正义力量，为增进全人类的福祉而不懈努力。“可预测”意味着让人安心，在关键时刻可以依靠。"}, {"id": 13, "type": "sc", "q": "两岸同胞同根同源、同文同种、血脉相连，是休戚与共的命运共同体。一家人相处，只要有话好好说、有事多商量，就没有化解不了的矛盾分歧。社会制度不同，不是搞分裂的借口。大陆和台湾同属一个中国，中国是中华民族的共同家园。两岸同胞要守护好、建设好这个共同家园，根本在于（）", "opts": {"A": "坚持“九二共识”、反对“台独”", "B": "认同两岸同属一个中国", "C": "让两岸同胞过上更美好的生活", "D": "共同扩大两岸交流交往交融"}, "ans": "A", "exp": "两岸同胞要守护好、建设好这个共同家园，根本在于坚持“九二共识”、反对“台独”，核心是认同两岸同属一个中国。发展两岸关系的目标，是要让两岸同胞过上更美好的生活。国共两党、两岸同胞要共同扩大两岸交流交往交融，增进两岸同胞亲情福祉。"}, {"id": 14, "type": "sc", "q": "2026年4月28日，中共中央政治局就提高防灾减灾救灾能力进行第二十五次集体学习。中共中央总书记习近平在主持学习时强调，要站在统筹高质量发展和高水平安全的战略高度，充分认识做好防灾减灾救灾工作的重要性，着力提高防范应对自然灾害能力，切实维护人民群众生命财产安全。降低灾害风险，减轻灾害损失，重在（）004修齐时政终极押题习题册单项选择题", "opts": {"A": "社会共治", "B": "坚持人民至上", "C": "事前预防", "D": "尊重自然规律"}, "ans": "C", "exp": "做好防灾减灾救灾工作必须坚持党的全面领导，坚持人民至上、生命至上，坚持尊重自然规律，坚持预防为主，坚持改革创新，坚持系统观念，坚持社会共治。习近平强调，降低灾害风险，减轻灾害损失，重在事前预防。"}, {"id": 15, "type": "sc", "q": "建设美丽中国，是全面建设社会主义现代化国家的重要目标，也是满足人民日益增长的优美生态环境需要的必然要求。绿色发展是新发展理念的重要内容，是发展观的一场深刻革命。推进碳达峰碳中和、加快发展方式绿色转型的重要抓手是（）", "opts": {"A": "节能降碳", "B": "优化能源结构", "C": "资源集约", "D": "开展绿化行动"}, "ans": "A", "exp": "节能降碳是推进碳达峰碳中和、加快发展方式绿色转型的重要抓手，是维护国家能源安全、促进产业提质升级的重要支撑。"}, {"id": 16, "type": "sc", "q": "无论外部环境如何变化，中塔两国永远是守望相助的好邻居、坦诚互信的好朋友、携手发展的好伙伴。双方签署《中塔永久睦邻友好合作条约》，将充分展现两国高水平政治互信，为中塔世代友好提供坚实保障。中塔关系的核心要义是（）", "opts": {"A": "加强战略沟通", "B": "坚守公理正义", "C": "相互坚定支持", "D": "深化务实合作"}, "ans": "C", "exp": "相互坚定支持是中塔关系的核心要义。中方将一如既往支持塔吉克斯坦走符合自身国情的发展道路，支持塔方维护国家独立、主权和安全。今年是中国“十五五”开局之年，塔方也在全力推进“2030年前国家发展战略”。双方要以高质量共建“一带一路”为主线，深度对接发展战略，助力各自发展目标。004修齐时政终极押题答案册·单项选择题"}, {"id": 17, "type": "sc", "q": "当前百年变局加速演进，国际形势变乱交织，中美两国能不能跨越“修昔底德陷阱”，开创大国关系新范式？能不能携手应对全球性挑战，为世界注入更多稳定性？能不能着眼两国人民福祉和人类前途命运，共同开创两国关系美好未来？这些是历史之问、世界之问、人民之问，也是大国领导人需要共同书写的时代答卷。中方致力于中美关系稳定、健康、可持续发展。作为中美关系新定位的是（）", "opts": {"A": "中美更加紧密的发展伙伴关系", "B": "中美战略互惠关系", "C": "中美全面战略合作伙伴关系005修齐时政终极押题习题册单项选择题", "D": "中美建设性战略稳定关系"}, "ans": "D", "exp": "习近平强调，中方致力于中美关系稳定、健康、可持续发展。我同特朗普总统赞同将构建“中美建设性战略稳定关系”作为中美关系新定位，将为未来3年乃至更长时间的中美关系提供战略指引，相信会受到两国人民和国际社会的欢迎。2011年《中美联合声明》确认双方将建设互相尊重、互利共赢的合作伙伴关系。"}, {"id": 18, "type": "sc", "q": "中美在相互尊重基础上实现和平共处、合作共赢，走出一条正确相处之道，是两国人民所愿和世界各国人民所盼。中国开放的大门只会越开越大，美国企业正在深度参与中国改革开放，中方欢迎美国对华加强互利合作。中美经贸关系的本质是互利共赢，面对分歧和摩擦，唯一正确选择是（）", "opts": {"A": "重信守义", "B": "互利合作", "C": "相互尊重", "D": "平等协商"}, "ans": "D", "exp": "中美经贸关系的本质是互利共赢，面对分歧和摩擦，平等协商是唯一正确选择。双方应一道维护好当前来之不易的良好势头。中国开放的大门只会越开越大，美国企业正在深度参与中国改革开放，中方欢迎美国对华加强互利合作。"}, {"id": 19, "type": "sc", "q": "今年是《中俄睦邻友好合作条约》签署25周年。多年来，两国始终恪守这一条约确立的“不结盟、不对抗、不针对第三方”原则，坚持平等相待、相互尊重、重信守义、合作共赢，为维护国际公平公道、推动构建新型国际关系作出重要贡献，成为世界百年变局中的关键恒量。《中俄睦邻友好合作条约》的宗旨和根本原则是（）", "opts": {"A": "平等相待", "B": "政治互信", "C": "重信守义", "D": "合作共赢"}, "ans": "B", "exp": "政治互信是中俄关系最鲜明的特征，也是《中俄睦邻友好合作条约》的宗旨和根本原则。双方要继往开来，在涉及彼此核心利益和重大关切问题上进一步相互坚定支持，持续密切战略沟通和各层级交往，不断夯实两国政治互信基础。"}, {"id": 20, "type": "sc", "q": "中俄关系一步一个脚印走到今天这个高度，是因为双方以“千磨万击还坚劲”的毅力不断深化政治互信和战略协作，以“更上一层楼”的精神拓展各领域合作，以“乱云飞渡仍从容”的勇气捍卫国际公道正义、推动构建人类命运共同体。中俄两国坚持在平等相待、相互尊重、重信守义、合作共赢的基础上发展（）", "opts": {"A": "永久全面战略伙伴关系", "B": "新时代全面战略协作伙伴关系", "C": "新时代全天候全面战略伙伴关系", "D": "全天候全面战略伙伴关系006修齐时政终极押题习题册单项选择题"}, "ans": "B", "exp": "中俄两国坚持在平等相待、相互尊重、重信守义、合作共赢的基础上发展新时代全面战略协作伙伴关系，政治互信不断深化，经贸、投资、能源、科技、人文、地方等合作持续推进，民心相通更加牢固。中俄关系进入更有作为、更快发展的新阶段。坚定不移推动中俄关系长期、健康、稳定、高质量发展，是双方着眼两国根本利益和世界发展大势作出的战略选择。"}, {"id": 21, "type": "sc", "q": "2026年5月20日，国家主席习近平在北京人民大会堂同来华进行国事访问的俄罗斯总统普京举行会谈。当前国际形势下，作为联合国安理会常任理事国和世界重要大国，中俄两国要着眼战略长远，以更高质量的全面战略协作助力各自国家发展振兴，推动构建更加公正合理的全球治理体系。会谈后，两国元首签署并发表（）", "opts": {"A": "《中华人民共和国和俄罗斯联邦关于新时代国际关系和全球可持续发展的联合声明》", "B": "《中华人民共和国和俄罗斯联邦关于倡导世界多极化和新型国际关系的联合声明》", "C": "《中华人民共和国和俄罗斯联邦关于深化新时代全面战略协作伙伴关系的联合声明》", "D": "《中华人民共和国和俄罗斯联邦关于进一步加强全面战略协作、深化睦邻友好合作的联合声明》"}, "ans": "D", "exp": "会谈后，两国元首签署并发表《中华人民共和国和俄罗斯联邦关于进一步加强全面战略协作、深化睦邻友好合作的联合声明》，见证签署经贸、教育、科技等领域20项合作文件。访问期间，双方发表《中华人民共和国和俄罗斯联邦关于倡导世界多极化和新型国际关系的联合声明》，并达成了其他领域20项合作文件。2022年发表《中华人民共和国和俄罗斯联邦关于新时代国际关系和全球可持续发展的联合声明》。2023年发表《中华人民共和国和俄罗斯联邦关于深化新时代全面战略协作伙伴关系的联合声明》。"}, {"id": 22, "type": "sc", "q": "《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》中摆在“十五五”时期各项战略任务的第一条是（）", "opts": {"A": "建设现代化产业体系", "B": "加快高水平科技自立自强", "C": "建设强大国内市场", "D": "扩大高水平对外开放"}, "ans": "A", "exp": "《建议》把建设现代化产业体系摆在“十五五”时期各项战略任务的第一条，是经过深思熟虑的。这些年我国经济顶风破浪、保持强大韧性和活力，战略依托就是完整的产业体系。建设现代化产业体系是要实现产业体系整体跃升。现代化产业体系的骨干是先进制造业。发展新质生产力是建设现代化产业体系的必然要求。"}, {"id": 23, "type": "sc", "q": "中朝两国是守望相助、命运与共的社会主义友好邻邦。中朝传统友谊是两党两国和两国人民共同的宝贵财富。无论时代如何变迁、国际形势如何变化，中朝传统友谊始终牢不可破、历久弥坚，不断焕发蓬勃生机活力。中朝关系的鲜明底色是（）", "opts": {"A": "最高层战略引领", "B": "社会主义共同理想", "C": "命运与共的传统友谊", "D": "高水平战略协作"}, "ans": "B", "exp": "最高层战略引领是中朝关系的最大优势。社会主义共同理想是中朝关系的鲜明底色。命运与共的传统友谊是中朝关系的深厚根基。高水平战略协作是中朝关系的时代内涵。005修齐时政终极押题答案册·单项选择题"}, {"id": 24, "type": "sc", "q": "为介绍中国关于全球治理的理念、倡议和行动，更广泛凝聚国际社会共识，更有效应对全球性挑战，构建更加公正合理的全球治理体系，国务院新闻办公室发布《构建更加公正合理的全球治理体系：中国的理念、倡议与行动》白皮书。白皮书指出，中国提出全球治理倡议，旨在推动构建更加公正合理的全球治理体系。落实全球治理倡议，最根本的是（）007修齐时政终极押题习题册单项选择题", "opts": {"A": "弥补和平与发展赤字", "B": "大国展现责任担当", "C": "各国团结合作", "D": "坚定维护联合国的权威和地位"}, "ans": "D", "exp": "白皮书指出，中国提出全球治理倡议，旨在推动构建更加公正合理的全球治理体系。落实全球治理倡议，最根本的是坚定维护联合国的权威和地位，最关键的是大国展现责任担当，最需要的是各国团结合作，最紧迫的是弥补和平与发展赤字。必须毫不动摇地维护以联合国为核心的国际体系，维护以国际法为基础的国际秩序，维护以联合国宪章宗旨和原则为基础的国际关系基本准则，而不是另起炉灶。"}, {"id": 25, "type": "sc", "q": "国务院印发《实施就业优先战略“十五五”规划》，明确了“十五五”时期深入实施就业优先战略、促进高质量充分就业的思路目标、重点任务和政策举措。坚持以习近平新时代中国特色社会主义思想为指导，聚焦促进高质量充分就业目标，围绕就业领域人力资源供需不匹配的主要矛盾，坚持投资于物和投资于人紧密结合。其着力点是（）", "opts": {"A": "不发生规模性失业风险", "B": "破解结构性就业矛盾", "C": "实施就业优先战略", "D": "强化就业优先政策"}, "ans": "B", "exp": "《规划》强调，坚持以习近平新时代中国特色社会主义思想为指导，聚焦促进高质量充分就业目标，围绕就业领域人力资源供需不匹配的主要矛盾，坚持投资于物和投资于人紧密结合，以推动高质量发展为基础，以实施就业优先战略为引领，以强化就业优先政策为抓手，以破解结构性就业矛盾为着力点，以深化就业体制机制改革为动力，以不发生规模性失业风险为底线，健全就业促进机制，构建就业友好型发展方式，加强人力资源开发利用，强化择业和用人观念引导，持续促进就业质的有效提升和量的合理增长，不断增强广大劳动者获得感幸福感安全感。"}, {"id": 26, "type": "sc", "q": "党的十八大以来，以习近平同志为核心的党中央围绕建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党的重大时代课题，提出一系列新理念新思想新战略，形成习近平党建思想，开辟了马克思主义建党学说中国化时代化的新境界，构成习近平新时代中国特色社会主义思想的党建篇，为加强新时代党的建设提供了根本遵循。“十四个坚持”是对习近平总书记关于新时代党的建设具有标志性、引领性的新理念新思想新战略的集中概括，其中，党的建设的最高原则是（）", "opts": {"A": "坚持全面从严治党", "B": "坚持党中央集中统一领导", "C": "坚持以党的政治建设为统领", "D": "坚持用党的创新理论凝心铸魂"}, "ans": "B", "exp": "作为马克思主义建党学说中国化时代化的最新成果，习近平党建思想鲜明提出坚持党的领导是中国特色社会主义最本质的特征，坚持党中央集中统一领导，坚持全面从严治党，坚持不忘初心、牢记使命，坚持以党的政治建设为统领，坚持用党的创新理论凝心铸魂，坚持锤炼坚强党性，坚持健全上下贯通、执行有力的组织体系，坚持建设堪当民族复兴重任的高素质干部队伍，坚持推进作风建设常态化长效化，坚持用严明的纪律管全党治全党，坚持一体推进不敢腐不能腐不想腐，坚持制度治党、依规治党，坚持落实管党治党政治责任，是新时代党的建设理论发展和实践经验的科学总结，博大精深、内涵丰富、思想深邃、体系严密。"}, {"id": 27, "type": "sc", "q": "农业农村现代化关系中国式现代化全局和成色，是中国式现代化的底座。制定《加快农业农村现代化“十五五”规划》，有利于落实农业农村优先发展，集聚各方资源力量，扎实做好“三农”工作，为以加快农业农村现代化更好推进中国式现代化建设提供行动指南。乡村全面振兴的引领是（）008修齐时政终极押题习题册单项选择题", "opts": {"A": "学习运用“千万工程”经验", "B": "锚定建设农业强国目标", "C": "加强党对“三农”工作的全面领导", "D": "一体推进农业现代化和农村现代化"}, "ans": "A", "exp": "《规划》坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，全面贯彻习近平总书记关于“三农”工作的重要论述和重要指示精神，坚持把解决好“三农”问题作为全党工作重中之重，坚持和加强党对“三农”工作的全面领导，完整准确全面贯彻新发展理念，坚持稳中求进工作总基调，坚持农业农村优先发展，坚持城乡融合发展，锚定建设农业强国目标，以推进乡村全面振兴为总抓手，以学习运用“千万工程”经验为引领，以改革创新为根本动力，一体推进农业现代化和农村现代化，统筹发展科技农业、绿色农业、质量农业、品牌农业，统筹建立常态化防止返贫致贫机制，加快推进宜居宜业和美乡村建设，推动基本实现农业现代化、农村基本具备现代生活条件取得重大进展，为确保基本实现社会主义现代化取得决定性进展提供基础支撑。"}, {"id": 28, "type": "sc", "q": "民族团结进步促进法是新时代实施宪法有关规定、处理民族事务和开展民族工作的基本法律。这是30多年来中央政治局会议研究的第一部法律案；这是30多年来第一部设置序言的法律；首次在法律中明确（）", "opts": {"A": "铸牢中华民族共同体意识", "B": "推进中华民族共同体建设", "C": "新时代党的民族工作格局", "D": "促进各民族共同繁荣发展"}, "ans": "C", "exp": "民族团结进步促进法是新时代实施宪法有关规定、处理民族事务和开展民族工作的基本法律。这是30多年来中央政治局会议研究的第一部法律案；这是30多年来第一部设置序言的法律；首次将习近平总书记关于加强和改进民族工作的重要思想写入法律；首次从法理层面阐释铸牢中华006修齐时政终极押题答案册·单项选择题民族共同体意识、推进中华民族共同体建设等核心概念；首次在法律中明确新时代党的民族工作格局。"}, {"id": 29, "type": "sc", "q": "今年主汛期我国极端天气气候事件仍将偏多、旱涝并重，各地区各有关部门要进一步提高思想认识，树牢底线思维、极限思维，立足防大汛、抗大旱、防强台风，采取有力措施做好防汛抗旱、抢险救灾各项工作。在防汛抗旱工作中，始终放在首位的是（）", "opts": {"A": "提高监测预报精准度", "B": "人民生命安全", "C": "强化隐患排查", "D": "提高救援能力"}, "ans": "B", "exp": "会议强调，要始终把人民生命安全放在首位，提高监测预报精准度，及时果断组织人员转移避险，严防出现群死群伤。"}, {"id": 30, "type": "sc", "q": "焦裕禄同志为县委书记树立了榜样。做县委书记，就要做焦裕禄式的县委书记。衡量一个县委书记当得怎么样，可以讲很多条，但主要的一条是（）", "opts": {"A": "对党忠诚", "B": "心系群众", "C": "敢于负责", "D": "廉洁用权009修齐时政终极押题习题册单项选择题"}, "ans": "A", "exp": "对党忠诚，是县委书记的重要标准。衡量一个县委书记当得怎么样，可以讲很多条，但主要看这一条。"}, {"id": 31, "type": "sc", "q": "法治宣传教育是全面依法治国的长期基础性工作。为加强和改进法治宣传教育，推动尊法学法守法用法在全社会蔚然成风，制定本规划。坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，全面贯彻习近平法治思想，深刻领悟“两个确立”的决定性意义，增强“四个意识”、坚定“四个自信”、做到“两个维护”，坚持党的全面领导，坚持人民至上，坚持全面依法治国，坚持服务“十五五”时期经济社会发展大局。法治宣传教育的首要任务是（）", "opts": {"A": "推动习近平法治思想深入人心", "B": "贯彻实施法治宣传教育法", "C": "繁荣发展社会主义法治文化", "D": "健全法治宣传教育工作体系"}, "ans": "A", "exp": "深刻领悟“两个确立”的决定性意义，增强“四个意识”、坚定“四个自信”、做到“两个维护”，坚持党的全面领导，坚持人民至上，坚持全面依法治国，坚持服务“十五五”时期经济社会发展大局，以推动习近平法治思想深入人心为首要任务，以贯彻实施法治宣传教育法为抓手，以繁荣发展社会主义法治文化为支撑，以健全法治宣传教育工作体系为保障，践行社会主义核心价值观，弘扬社会主义法治精神，推进法治社会建设，为以中国式现代化全面推进强国建设、民族复兴伟业营造良好法治环境。"}, {"id": 32, "type": "sc", "q": "今年是新中国恢复联合国合法席位55周年。55年来，中国坚持做世界和平的建设者、全球发展的贡献者、国际秩序的维护者，始终坚定支持联合国。习近平主席提出构建人类命运共同体理念和四大全球倡议，一个重要考虑就是（）", "opts": {"A": "积极应对气候变化等全球性挑战", "B": "推动人工智能等新兴领域全球治理", "C": "维护联合国地位和权威", "D": "高质量共建“一带一路”"}, "ans": "C", "exp": "今年是新中国恢复联合国合法席位55周年。55年来，中国坚持做世界和平的建设者、全球发展的贡献者、国际秩序的维护者，始终坚定支持联合国。我提出构建人类命运共同体理念和四大全球倡议，一个重要考虑就是维护联合国地位和权威。"}, {"id": 33, "type": "sc", "q": "中国共产党之所以能够在105年奋斗中不断铸就辉煌，历史和人民之所以选择中国共产党，根本在于我们党具有其他政党和政治力量无可比拟的（）", "opts": {"A": "优秀特质", "B": "理论优势", "C": "初心使命", "D": "自我革命"}, "ans": "A", "exp": "中国共产党之所以能够在105年奋斗中不断铸就辉煌，历史和人民之所以选择中国共产党，根本在于我们党具有其他政党和政治力量无可比拟的优秀特质。这些优秀特质，是中国共产党为什么能的关键密码。"}, {"id": 34, "type": "sc", "q": "我国正从全球科技参与者、贡献者向开拓者、引领者加速转变，成为创新力上升最快的国家之一。科技创新是人类文明进步的不竭动力，新一轮科技革命和产业变革深刻改变010修齐时政终极押题习题册单项选择题人类生产生活方式和世界发展格局，科技实力和创新能力越来越成为国家的核心竞争力。以高水平科技自立自强引领发展新质生产力的关键是（）", "opts": {"A": "增强科技创新体系化攻关能力", "B": "提高科技创新投入效能", "C": "加强科技伦理和安全治理", "D": "推动科技创新和产业创新深度融合"}, "ans": "D", "exp": "“十五五”时期是科技强国建设的关键攻坚期，要全力抓好党中央关于科技事业各项部署的落实。这里，强调6点。第一，增强科技创新体系化攻关能力。第二，推动科技创新和产业创新深度融合。这是以高水平科技自立自强引领发展新质生产力的关键。第三，大力培养优秀青年科技人才。第四，提高科技创新投入效能。第五，用好科技评价指挥棒。第六，加强科技伦理和安全治理。007修齐时政终极押题答案册·单项选择题"}, {"id": 35, "type": "sc", "q": "为人类谋进步、为世界谋大同，中国共产党领导人民走出的康庄大道，开辟的是人类迈向现代化的新道路、开创的是人类文明新形态，提出的构建人类命运共同体理念，成为引领时代前进的光辉旗帜，推动世界走向和平、安全、繁荣、进步的光明前景。习近平新时代中国特色社会主义思想的理论品质是（）", "opts": {"A": "坚持人民至上", "B": "坚持守正创新", "C": "坚持胸怀天下", "D": "坚持系统观念"}, "ans": "C", "exp": "“必须坚持人民至上”，是习近平新时代中国特色社会主义思想的世界观、方法论和贯穿其中的立场观点方法的重要体现。“坚持胸怀天下”，这是中国共产党不懈奋斗的历史经验，是习近平新时代中国特色社会主义思想的理论品质。"}, {"id": 36, "type": "sc", "q": "三峡水运新通道工程体量大、建设周期长、涉及面广，需要攻克多项世界级技术和管理难题。真抓实干，全力推进三峡水运新通道工程高质量建设，首要是（）", "opts": {"A": "加强党的领导", "B": "恪守人民至上", "C": "增强系统观念", "D": "坚持真抓实干"}, "ans": "A", "exp": "三峡水运新通道工程体量大、建设周期长、涉及面广，需要攻克多项世界级技术和管理难题。首要是加强党的领导，以党性淬炼校准发展方向。根本是恪守人民至上，以民生温度彰显初心使命。重点是增强系统观念，以科学统筹推动全局工作。关键是坚持真抓实干，以实干担当建设标志性工程。"}, {"id": 37, "type": "sc", "q": "党的十八大以来，以习近平同志为核心的党中央把社会工作摆在治国理政重要位置，作出一系列重大决策部署，推动社会工作取得重要成就。中共中央、国务院印发《关于加强新时代社会工作的意见》，进一步明确当前和今后一个时期社会工作的总体思路、重点任务、工作举措，为新时代社会工作高质量发展提供了行动指南。做好新时代社会工作的实践路径是（）", "opts": {"A": "加强党的全面领导011修齐时政终极押题习题册单项选择题", "B": "共建共治共享", "C": "弘扬中华优秀传统文化", "D": "以人民为中心"}, "ans": "B", "exp": "习近平总书记强调：“健全共建共治共享的社会治理制度，提升社会治理效能。”共建彰显的是力量，共治体现的是参与，共享突出的是成效，三者相辅相成、有机统一。共建共治共享既是解决新时代我国社会主要矛盾的现实需要，也是做好新时代社会工作的实践路径。"}, {"id": 38, "type": "sc", "q": "产业合作是经济全球化的重要内容，是推动全球经济持续复苏、促进各国共同发展的重要路径。中国现代化产业快速发展靠的是（）", "opts": {"A": "持续扩大内需", "B": "创新驱动", "C": "持续深化改革", "D": "市场竞争"}, "ans": "B", "exp": "中国现代化产业快速发展靠的是创新驱动。中国产业运行始终平稳健康靠的是持续深化改革。“中国内需不足导致产能过剩”不符合事实。中国持续扩大内需，致力于更高水平的供需平衡。产业补贴与产能过剩不存在必然联系。合理的产业补贴政策有助于纠正市场失灵，推进技术创新、环境保护、减少贫困、促进均衡发展，并不会造成所谓的“产能过剩”。出口多、顺差大不等于产能过剩。顺差主要反映的是国内总储蓄和总投资之间的差额，主要包括货物和服务贸易顺差。贸易顺差是全球产业分工和供需结构共同作用的结果，并不意味着产能过剩。中国从不刻意追求贸易顺差。中国积极推动进出口平衡发展。"}, {"id": 39, "type": "sc", "q": "《扩大消费“十五五”规划》部署了“十五五”时期扩大消费的28条重点任务举措，为未来五年我国消费市场扩量提质划定清晰路线图。在促消费六大重点任务中，位列第一的是（）", "opts": {"A": "加力完善促进消费制度机制", "B": "培育打造消费新业态新模式新场景", "C": "推动商品消费扩容升级", "D": "促进服务消费提质惠民"}, "ans": "D", "exp": "《扩大消费“十五五”规划》正式印发，围绕促进服务消费提质惠民、推动商品消费扩容升级、培育打造消费新业态新模式新场景等6个方面。细读全文，一个显著变化引人关注：在促消费六大重点任务中，“促进服务消费提质惠民”位列第一，服务消费首次压过商品消费居首。"}, {"id": 40, "type": "sc", "q": "“十五五”时期，要坚持以新时代中国特色社会主义思想为指导，深入贯彻新时代强军思想，强化政治引领，深化创新发展，高质量推进国防和军队现代化，如期实现建军一百年奋斗目标，推动基本实现国防和军队现代化取得决定性进展，为以中国式现代化全面推进强国建设、民族复兴伟业提供坚强战略支撑。人民军队立军之本是（）", "opts": {"A": "依法治军", "B": "科技强军", "C": "政治建军", "D": "人才强军012修齐时政终极押题习题册单项选择题"}, "ans": "C", "exp": "高质量推进国防和军队现代化，是推进中国式现代化的应有之义。政治建军是人民军队立军之本，关乎国防和军队现代化建设方向和底色。"}, {"id": 41, "type": "sc", "q": "党的十八大以来，党中央统筹中华民族伟大复兴战略全局和世界百年未有之大变局，把强军兴军摆在党和国家事业的突出位置，毫不动摇坚持和加强党对军队的绝对领导，鲜明提出党在新时代的强军目标，谋划实施国防和军队现代化新“三步走”战略，全面推进政治建军、改革强军、科技强军、人才强军、依法治军，边斗争、边备战、边建设，我军现代化水平和实战能力显著提升，强军事业取得历史性成就、发生历史性变革。高质量推进国防和军队现代化，根本指向和检验标准始终是（）", "opts": {"A": "听党指挥", "B": "战斗力", "C": "科技人才", "D": "作风优良"}, "ans": "B", "exp": "高质量推进国防和军队现代化，根本指向和检验标准始终是战斗力。巩固提高一体化国家战略体系和能力，是高质量推进国防和军队现代化的必由之路。008修齐时政终极押题答案册·单项选择题"}, {"id": 42, "type": "sc", "q": "全球气候持续变暖，极端天气和暴雨、洪涝、台风、干旱等灾害显著增多，破坏性加剧，且时空分布出现新变化。大震巨灾的潜在威胁加大，地质灾害、森林草原火险等隐患较多，冰湖溃决、海水倒灌等新型灾害日益显现。降低灾害风险，减轻灾害损失，重在（）", "opts": {"A": "提升对处置能力", "B": "强化科技支撑", "C": "夯实基层基础", "D": "事前预防"}, "ans": "D", "exp": "第一，推动灾害治理向事前预防转型。推动灾害治理向事前预防转型。降低灾害风险，减轻灾害损失，重在事前预防。第二，提升大灾巨灾应对处置能力。第三，强化科技支撑和法治保障。第四，夯实防灾减灾救灾基层基础。第五，认真抓好责任落实。"}, {"id": 43, "type": "sc", "q": "在70多年的革命生涯中，特别是在党的十三届四中全会之后推动党和国家事业取得巨大成就的伟大实践中，江泽民同志充分展示了作为马克思主义政治家的雄才大略、关键作用、领导艺术，树立了永远值得我们学习、永远激励我们前进的崇高风范。江泽民同志对共产主义理想坚贞不渝，对党和人民无限忠诚，矢志不移为党和人民事业而奋斗，我们要学习他（）", "opts": {"A": "坚定如磐的政治信仰", "B": "真挚深厚的为民情怀", "C": "与时俱进的创新精神", "D": "深谋远虑的战略思维013修齐时政终极押题习题册单项选择题"}, "ans": "A", "exp": "我们要学习江泽民同志坚定如磐的政治信仰。江泽民同志对共产主义理想坚贞不渝，对党和人民无限忠诚，矢志不移为党和人民事业而奋斗。我们要学习江泽民同志真挚深厚的为民情怀。江泽民同志始终站在人民立场，关心人民群众安危冷暖，从最广大人民根本利益出发部署和推动工作。我们要学习江泽民同志与时俱进的创新精神。江泽民同志坚持解放思想、实事求是、与时俱进，顺应时代发展要求和实践发展需要，不断推进理论创新、制度创新、科技创新、文化创新以及其他各方面创新。我们要学习江泽民同志深谋远虑的战略思维。江泽民同志目光远大、审时度势，善于从中国和世界发展大势、从党和国家工作全局出发观察和思考问题，以一系列面向世界、着眼未来的重大决策、重要举措推动党和国家事业发展。我们要学习江泽民同志坚毅果敢的非凡胆略。江泽民同志勇于在重大历史关头和关键时刻果断决策，沉着应对风险挑战，坚决克服艰难险阻，为现代化建设开辟广阔空间、营造良好环境。"}, {"id": 44, "type": "sc", "q": "习近平总书记指出：“党的十八大以来我们对经济社会发展提出了许多重大理论和理念，其中新发展理念是最重要、最主要的。”中国新能源汽车产业是深入践行习近平经济思想、完整准确全面贯彻新发展理念的典型范例。中国新能源汽车产业的灵魂是（）", "opts": {"A": "创新", "B": "协调", "C": "绿色", "D": "共享014修齐时政终极押题习题册多项选择题多项选择题第45—135题共91题"}, "ans": "A", "exp": "中国新能源汽车产业是深入践行习近平经济思想、完整准确全面贯彻新发展理念的典型范例。创新是中国新能源汽车产业的灵魂。协调是中国新能源汽车产业的筋脉。绿色是中国新能源汽车产业的底色。开放是中国新能源汽车产业的胸怀。共享是中国新能源汽车产业的境界。009修齐时政终极押题答案册·多项选择题多项选择题第45—135题共91题"}, {"id": 45, "type": "mc", "q": "中国和爱尔兰都爱好和平、开放包容、自立进取，两国人民通过斗争赢得国家独立和民族解放，依靠几代人接续奋斗迈向现代化。2012年两国建立互惠战略伙伴关系以来，双边贸易额翻了两番，相互投资均衡发展，两国人民双向奔赴，助力各自国家发展。中爱关系长期稳定发展的宝贵经验是（）", "opts": {"A": "相互尊重", "B": "平等相待", "C": "互利共赢", "D": "彼此信任"}, "ans": "ABC", "exp": "习近平指出，中国和爱尔兰都爱好和平、开放包容、自立进取，两国人民通过斗争赢得国家独立和民族解放，依靠几代人接续奋斗迈向现代化。2012年两国建立互惠战略伙伴关系以来，双边贸易额翻了两番，相互投资均衡发展，两国人民双向奔赴，助力各自国家发展。相互尊重、平等相待、互利共赢是中爱关系长期稳定发展的宝贵经验，双方要共同传承和弘扬。中方愿同爱尔兰加强战略沟通，深化政治互信，扩大务实合作，为两国人民谋福祉，为中欧关系添动力。"}, {"id": 46, "type": "mc", "q": "中加关系健康稳定发展符合两国共同利益，也有利于世界和平稳定和发展繁荣。双方要本着对历史、对人民、对世界负责任的态度，推进构建中加新型战略伙伴关系，推动中加关系迈入健康、稳定、可持续的发展轨道，更好造福两国人民。习近平就中加关系提出（）", "opts": {"A": "要做相互尊重的伙伴", "B": "要做共同发展的伙伴", "C": "要做彼此信任的伙伴", "D": "要做相互协作的伙伴"}, "ans": "ABCD", "exp": "中加关系健康稳定发展符合两国共同利益，也有利于世界和平稳定和发展繁荣。双方要本着对历史、对人民、对世界负责任的态度，推进构建中加新型战略伙伴关系，推动中加关系迈入健康、稳定、可持续的发展轨道，更好造福两国人民。习近平就中加关系提出4点意见。一要做相互尊重的伙伴。二要做共同发展的伙伴。三要做彼此信任的伙伴。四要做相互协作的伙伴。"}, {"id": 47, "type": "mc", "q": "党的二十届四中全会分析了当前形势和任务，审议通过了《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》。全会通过的《建议》，立足于夯实基础、全面发力，对“十五五”时期事关中国式现代化全局的战略任务作出部署，是指导“十五五”时期经济社会发展的纲领性文件。《建议》确定的指导思想和“六个坚持”原则，（）", "opts": {"A": "是对改革开放以来特别是新时代经济社会发展经验的科学总结", "B": "是我们党不断深化对经济社会发展的规律性认识的重大成果", "C": "为“十五五”时期经济社会发展提供了基本遵循", "D": "为推进中国式现代化提供了根本保证015修齐时政终极押题习题册多项选择题"}, "ans": "ABC", "exp": "《建议》提出的指导思想，突出了“十五五”时期经济社会发展的主题、根本动力、根本目的、根本保障。《建议》明确了坚持党的全面领导、坚持人民至上、坚持高质量发展、坚持全面深化改革、坚持有效市场和有为政府相结合、坚持统筹发展和安全等重大原则。《建议》确定的指导思想和“六个坚持”原则，是对改革开放以来特别是新时代经济社会发展经验的科学总结，是我们党不断深化对经济社会发展的规律性认识的重大成果，为“十五五”时期经济社会发展提供了基本遵循。全党要以此来统一思想和行动。坚持和加强党的全面领导是推进中国式现代化的根本保证。越是形势复杂多变、任务艰巨繁重，越要坚持好、运用好、发展好党的领导这一最大优势。"}, {"id": 48, "type": "mc", "q": "治国必先治党，党兴才能国强。管党治党越有效，经济社会发展的保障就越有力。必须以永远在路上的坚韧和执着，持之以恒推进全面从严治党。因此，必须（）", "opts": {"A": "坚决把党的自我革命要求落实到位", "B": "推进党的作风建设常态化长效化", "C": "牢固树立和践行正确政绩观", "D": "坚定不移开展反腐败斗争"}, "ans": "ABD", "exp": "2025年10月23日在党的二十届四中全会第二次全体会议上的讲话：治国必先治党，党兴才能国强。管党治党越有效，经济社会发展的保障就越有力。必须以永远在路上的坚韧和执着，持之以恒推进全面从严治党。第一，坚决把党的自我革命要求落实到位。党的自我革命和经济社会发展是紧密相联、相互促进、相得益彰的。第二，推进党的作风建设常态化长效化。从抓作风入手推进全面从严治党，是新时代党的自我革命一条重要经验。第三，坚定不移开展反腐败斗争。腐败是我们党面临的最大威胁，反腐败是最彻底的自我革命。"}, {"id": 49, "type": "mc", "q": "因地制宜是习近平总书记反复强调的工作方法。早在地方工作时，习近平同志就坚持因地制宜开展工作。因地制宜在当前具有更加突出的现实意义。因地制宜（）", "opts": {"A": "本质是实事求是", "B": "是践行正确政绩观的必然要求", "C": "是“十五五”开局起步的必然要求", "D": "新时代推进高质量发展的必然要求"}, "ans": "ABCD", "exp": "习近平总书记在中央经济工作会议上强调：“因地制宜，本质是实事求是。”因地制宜，是正确政绩观，是科学方法论，是各地各部门结合实际贯彻落实中央经济工作会议精神的关键之举和重要遵循。因地制宜在当前具有更加突出的现实意义。这是“十五五”开局起步的必然要求。这是践行正确政绩观的必然要求。这是新时代推进高质量发展的必然要求。因地制宜抓好党中央重大决策部署的贯彻落实，首先要吃透中央精神。010修齐时政终极押题答案册·多项选择题"}, {"id": 50, "type": "mc", "q": "强大国内市场是中国式现代化的战略依托。中央经济工作会议提出，坚持内需主导，建设强大国内市场。下一步，要统筹促消费和扩投资，坚持消费和投资两手发力、互动协同，合力提升国内市场的成长性和稳定性，加快形成更多由内需主导、消费拉动、内生增长的经济发展模式。统筹消费和投资，（）", "opts": {"A": "是建设强大国内市场的必然要求", "B": "要以新需求引领新供给，推动消费投资联动升级", "C": "要以新供给创造新需求，推动投资为消费提供新产品新场景新空间", "D": "要强化政策支持和改革加力，协同推进消费和投资扩量提质"}, "ans": "ABCD", "exp": "统筹消费和投资，是建设强大国内市场的必然要求。统筹消费和投资，要以新需求引领新供给，推动消费投资联动升级。统筹消费和投资，要以新供给创造新需求，推动投资为消费提供新产品新场景新空间。统筹消费和投资，要强化政策支持和改革加力，协同推进消费和投资扩量提质。"}, {"id": 51, "type": "mc", "q": "习近平总书记强调，坚持扩大对外开放，既把发展放在自己力量基点上，又统筹用好全球要素和市场资源。40多年来，我们坚持以开放促改革促发展促创新，对外开放已成为经济社会发展的强大动力。改革越深入，对开放的水平要求就越高；开放水平越高，对改革的促进作用就越大。开放度高的行业往往竞争力也较强。扩大高水平对外开放的重大意义在于（）", "opts": {"A": "满足人民美好生活需要，高水平开放是重要途径", "B": "促进普惠包容的经济全球化，高水平开放是主动作为016修齐时政终极押题习题册多项选择题", "C": "应对外部环境不确定性，高水平开放是战略选择", "D": "赢得大国博弈战略主动，高水平开放是根本保证"}, "ans": "ABC", "exp": "我们深入学习贯彻习近平总书记关于对外开放的重要论述，深刻领会扩大高水平对外开放的重大意义。全面推动高质量发展，高水平开放是强大动力。满足人民美好生活需要，高水平开放是重要途径。促进普惠包容的经济全球化，高水平开放是主动作为。应对外部环境不确定性，高水平开放是战略选择。"}, {"id": 52, "type": "mc", "q": "习近平总书记强调，新一轮科技革命和产业变革加速演进，前沿技术不断涌现，引领和支撑未来产业快速崛起。要站在推进强国建设、民族复兴伟业的战略高度，立足客观条件，发挥比较优势，坚持稳中求进、梯度培育，推动我国未来产业发展不断取得新突破。未来产业的特性有（）", "opts": {"A": "前瞻性", "B": "战略性", "C": "全局性", "D": "颠覆性"}, "ans": "ABD", "exp": "近年来，党中央高度重视，强化政策支持，推动未来产业发展呈现良好势头。习近平强调，未来产业具有前瞻性、战略性、颠覆性等特点，需要科学谋划、全局统筹。"}, {"id": 53, "type": "mc", "q": "中国和德国分别是世界第二、第三大经济体，中德关系不仅关乎两国利益，也对欧洲和世界有重要辐射效应。当前国际形势正在经历第二次世界大战结束以来最深刻演变。世界越是变乱交织，中德两国越要加强战略沟通、增进战略互信，推动中德全方位战略伙伴关系不断得到新发展。习近平主席对下一步中德关系发展提出的意见有（）", "opts": {"A": "要做相互尊重的合作伙伴", "B": "要做相互支持的可靠伙伴", "C": "要做开放互利的创新伙伴", "D": "要做相知相亲的人文伙伴"}, "ans": "BCD", "exp": "习近平对下一步中德关系发展提出三点意见。一是要做相互支持的可靠伙伴。二是要做开放互利的创新伙伴。三是要做相知相亲的人文伙伴。习近平强调，面对加速演进的世界百年变局，各国应该风雨同舟、命运与共。中德应坚持联合国的核心地位，重振联合国的主导作用，带头做多边主义的维护者、国际法治的践行者、自由贸易的捍卫者、团结协作的倡导者。"}, {"id": 54, "type": "mc", "q": "保证国家安全是头等大事。安全是（）", "opts": {"A": "国家生存发展的前提", "B": "社会稳定的基础", "C": "人民福祉的保障", "D": "扩大开放的保证"}, "ans": "ABC", "exp": "安全是国家生存发展的前提，是社会稳定的基础，是人民福祉的保障。保证国家安全是头等大事。"}, {"id": 55, "type": "mc", "q": "坚持把政治安全摆在首位，是新时代中国国家安全的生命线。政治安全的核心是（）017修齐时政终极押题习题册多项选择题", "opts": {"A": "政权安全", "B": "人民安全", "C": "经济安全", "D": "制度安全"}, "ans": "AD", "exp": "坚持把政治安全摆在首位，是新时代中国国家安全的生命线。政治安全的核心是政权安全和制度安全。"}, {"id": 56, "type": "mc", "q": "“一国两制”下香港维护国家安全，塑造的是开放型安全，强调在开放环境中动态维护国家安全。香港背靠祖国、联通世界，是久负盛名的国际金融、航运、贸易中心，一直保持自由港地位，实行零关税政策，自由开放雄冠全球。作为连接世界第二大经济体和全球经济体系的关键枢纽，在香港维护国家安全，就是（）", "opts": {"A": "维护全球产业链、供应链、资金链安全", "B": "维护国际经济金融安全", "C": "维护经济全球化的基本秩序", "D": "维护国家利益和民族尊严"}, "ans": "ABC", "exp": "香港背靠祖国、联通世界，是久负盛名的国际金融、航运、贸易中心，一直保持自由港地位，实行零关税政策，自由开放雄冠全球。作为连接世界第二大经济体和全球经济体系的关键枢纽，在香港维护国家安全，就是维护全球产业链、供应链、资金链安全，就是维护国际经济金融安全，就是维护经济全球化的基本秩序。011修齐时政终极押题答案册·多项选择题"}, {"id": 57, "type": "mc", "q": "“一国两制”下香港维护国家安全的实践波澜壮阔，历程极不平凡，成就有目共睹。香港今天安定繁荣的良好局面来之不易，必须倍加珍惜。一个既安全又自由、既安全又发展、既安全又开放、既安全又生机勃勃的香港，符合“一国两制”方针，符合国家根本利益，符合香港居民福祉，符合外来投资者利益。香港维护国家安全的实践，本质上（）", "opts": {"A": "坚持和发展“一国两制”事业的实践", "B": "实现民族复兴和国家统一的实践", "C": "保护750万香港居民的基本人权、尊严和福祉的实践", "D": "促进世界和平与发展的实践"}, "ans": "ACD", "exp": "香港维护国家安全的实践，本质上是坚持和发展“一国两制”事业的实践，是保护750万香港居民的基本人权、尊严和福祉的实践，是促进世界和平与发展的实践。当今世界百年变局加速演进，中国发展环境面临深刻复杂变化，维护国家安全只有进行时，没有完成时。"}, {"id": 58, "type": "mc", "q": "《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》提出：“建设能源强国。”能源是现代化的重要基础和动力，能源保障和安全事关国计民生，是须臾不可忽视的“国之大者”。当前，世界百年未有之大变局加速演进，科技革命和大国博弈相互交织，全球能源供需格局深度重塑，能源绿色低碳转型步伐加快，能源强国建设的意义更加凸显。加快建设能源强国（）", "opts": {"A": "是正确把握民生和发展的关系、保障和改善民生的重要前提018修齐时政终极押题习题册多项选择题", "B": "是深入推进能源革命、建设社会主义现代化强国的必然要求", "C": "是增强能源安全保障能力、赢得大国博弈主动的迫切要求", "D": "是引领绿色低碳发展、提升全球竞争新优势的现实需要"}, "ans": "BCD", "exp": "当前，世界百年未有之大变局加速演进，科技革命和大国博弈相互交织，全球能源供需格局深度重塑，能源绿色低碳转型步伐加快，能源强国建设的意义更加凸显。加快建设能源强国十分重要、正当其时。第一，这是深入推进能源革命、建设社会主义现代化强国的必然要求。第二，这是增强能源安全保障能力、赢得大国博弈主动的迫切要求。第三，这是引领绿色低碳发展、提升全球竞争新优势的现实需要。"}, {"id": 59, "type": "mc", "q": "对外发布的2026年中央一号文件提出，实施常态化精准帮扶。这是中央一号文件首次对这一重大举措进行系统性部署。巩固拓展脱贫攻坚成果是一项长期任务，必须继续压紧压实工作责任，把常态化帮扶纳入乡村振兴战略统筹实施，持之以恒抓好工作落实，确保长久守住不发生规模性返贫致贫底线。重点要把握好（）", "opts": {"A": "帮扶对象上实行动态管理", "B": "帮扶方式上要突出精准高效", "C": "帮扶区域上注重分层分类", "D": "帮扶政策上要保持总体稳定"}, "ans": "ABCD", "exp": "“巩固拓展脱贫攻坚成果是一项长期任务，必须继续压紧压实工作责任，把常态化帮扶纳入乡村振兴战略统筹实施，持之以恒抓好工作落实，确保长久守住不发生规模性返贫致贫底线。”韩文秀表示，重点要把握好四个方面：帮扶对象上实行动态管理，帮扶方式上要突出精准高效，帮扶区域上注重分层分类，帮扶政策上要保持总体稳定。"}, {"id": 60, "type": "mc", "q": "2026年是“十五五”开局之年，中国共产党正带领亿万人民满怀信心行进在中国式现代化新征程上。人民政协要立足自身性质定位和职责使命，找准服从服务于“十五五”发展大局的切入点、结合点、着力点，充分发挥专门协商机构作用，团结引领参加政协的各党派团体和各族各界人士，为“十五五”开好局、起好步广泛凝聚人心、凝聚共识、凝聚智慧、凝聚力量。要更好发挥（）", "opts": {"A": "人民政协的政治组织作用", "B": "人民政协的建言资政作用", "C": "人民政协的立法主导作用", "D": "人民政协的凝心聚力作用"}, "ans": "ABD", "exp": "王沪宁在全国政协十四届四次会议闭幕会上的讲话中指出，我们要更好发挥人民政协的政治组织作用，我们要更好发挥人民政协的建言资政作用，我们要更好发挥人民政协的凝心聚力作用。"}, {"id": 61, "type": "mc", "q": "2026年3月12日，第十四届全国人大第四次会议表决通过了《中华人民共和国生态环境法典》。这标志着我国继民法典之后第二部以“法典”命名的法律诞生，是新时代生态文明建设的重大标志性成果，具有里程碑式的意义。编纂生态环境法典是（）", "opts": {"A": "深入贯彻习近平生态文明思想的生动实践", "B": "推进生态环境治理体系和治理能力现代化的有效路径", "C": "支撑高质量发展的关键举措019修齐时政终极押题习题册多项选择题", "D": "增进民生福祉的内在要求"}, "ans": "ABCD", "exp": "编纂生态环境法典是一项重大而系统的立法工程。法典的颁布实施，对于依法保障公众健康和生态环境权益，加快推进人与自然和谐共生的现代化，实现中华民族永续发展，推动共建清洁美丽世界，具有重大而深远的意义。第一，编纂法典是深入贯彻习近平生态文明思想的生动实践。第二，编纂法典是推进生态环境治理体系和治理能力现代化的有效路径。第三，编纂法典是支撑高质量发展的关键举措。第四，编纂法典是增进民生福祉的内在要求。（补充：编纂生态环境法典是贯彻落实习近平生态文明思想，推进人与自然和谐共生的现代化的必然要求；是坚持全面依法治国，在法治轨道上推进新时代生态文明建设的必要举措；是贯彻新发展理念，同步推进高质量发展和高水平保护的客观要求；是坚持以人民为中心的发展思想，增进民生福祉的必然要求；是完善中国特色社会主义法律体系，使法律体系更加科学完备、统一权威的内在要求）"}, {"id": 62, "type": "mc", "q": "《中华人民共和国国家发展规划法》经十四届全国人民代表大会第四次会议表决通过，于3月12日正式施行。这是规划制度建设的重要里程碑，开启了法治引领保障国家发展规划战略导向作用的新篇章，将进一步巩固拓展中国特色社会主义制度政治优势，为以中国式现代化全面推进中华民族伟大复兴提供更加坚实有力的法治保障。制定国家发展规划法是（）", "opts": {"A": "更好发挥中国特色社会主义制度优势的必然要求", "B": "在国家发展规划工作中践行全过程人民民主的重要举措", "C": "坚持好完善好运行好人民代表大会制度的现实需要", "D": "更好发挥国家发展规划战略导向作用的内在要求"}, "ans": "ABCD", "exp": "受十四届全国人大常委会委托，全国人大常委会副委员长李鸿忠向十四届全国人大四次会议作关于《中华人民共和国国家发展规划法（草案）》的说明。制定国家发展规划法是更好发挥中国特色社会主义制度优势的必然要求；制定国家发展规划法是在国家发展规划工作中践行全过程人民民主的重要举措；制定国家发展规划法是坚持好完善好运行好人民代表大会制度的现实需要；012修齐时政终极押题答案册·多项选择题制定国家发展规划法是更好发挥国家发展规划战略导向作用的内在要求。（补充：制定出台国家发展规划法，将长期以来特别是新时代国家发展规划领域成熟有效的制度做法确立为法律规范，对党和国家事业发展具有重要而深远的意义。这是实现党中央战略擘画的有力保障，这是完善以宪法为核心的中国特色社会主义法律体系的内在要求，这是推进国家治理体系和治理能力现代化的重大举措，这是践行全过程人民民主的生动范例。）"}, {"id": 63, "type": "mc", "q": "今年是远东国际军事法庭开庭80周年。这场对日本军国主义的严正审判，不仅是对其侵略罪行的正义清算，也是建设和平世界的重要努力。当前，日本“新型军国主义”再次对地区和国际和平稳定构成严重现实威胁。“新型军国主义”（）", "opts": {"A": "严重威胁战后国际秩序", "B": "严重威胁核不扩散体系", "C": "严重破坏地区和平稳定", "D": "严重损害日本民众的切身利益"}, "ans": "ABCD", "exp": "日本“新型军国主义”不断抬头，正成为影响地区与国际和平稳定的最危险变量之一。“新型军国主义”严重威胁战后国际秩序；“新型军国主义”严重威胁核不扩散体系；“新型军国主义”严重破坏地区和平稳定；“新型军国主义”严重损害日本民众的切身利益。"}, {"id": 64, "type": "mc", "q": "2026年3月18日，《中共中央办公厅国务院办公厅关于做好第二轮土地承包到期后再延长30年试点工作的意见》公开发布。作为保持土地承包关系稳定并长久不变、巩固和完善农村基本经营制度的政策延续，意见对第二轮土地承包到期后再延长30年试点工作作了具体部署安排。以家庭承包经营为基础、统分结合的双层经营体制，是我国农村基本经营制度，是党的农村政策的基石。维护农民土地承包经营权的关键，是现有农村土地承包关系保持稳定并长久不变。做好延包工作要遵循的重要原则，就是坚持“大稳定、小调整”。第二轮土地承包到期后再延长30年试点，（）", "opts": {"A": "事关亿万农民的切身利益", "B": "事关农村社会的长治久安", "C": "事关党在农村的执政基础020修齐时政终极押题习题册多项选择题", "D": "事关全民所有制的不动摇"}, "ans": "ABC", "exp": "第二轮土地承包到期后再延长30年试点，事关亿万农民切身利益，事关农村社会长治久安，事关党在农村的执政基础，必须做到坚持集体所有制不动摇，坚持农户家庭承包经营，坚持农民主体地位，坚持维护农村社会稳定。农村土地属于农民集体所有，这是坚持农村基本经营制度的“魂”，是农村最大的制度，必须充分维护农民集体对承包地的各项权能。"}, {"id": 65, "type": "mc", "q": "2026年3月12日，十四届全国人大四次会议通过《中华人民共和国生态环境法典》，这是我国第二部以“法典”命名的基本法律。这部法典不仅是对现行30多部生态环境相关法律的系统整合，更是践行习近平生态文明思想、推进美丽中国建设的里程碑。法典的重要意义体现在（）", "opts": {"A": "践行习近平生态文明思想的法治宣言", "B": "中华文明生态智慧的当代传承与法治升华", "C": "应对时代挑战、推动绿色发展的战略支撑", "D": "参与和引领全球环境治理、贡献中国智慧和中国方案"}, "ans": "ABCD", "exp": "生态环境法典受到国内国际广泛关注，意义体现在政治、历史、时代、国际4个方面。一是践行习近平生态文明思想的法治宣言。二是中华文明生态智慧的当代传承与法治升华。三是应对时代挑战、推动绿色发展的战略支撑。四是参与和引领全球环境治理、贡献中国智慧和中国方案。"}, {"id": 66, "type": "mc", "q": "政绩观问题是一个根本性问题，关乎立党为公、执政为民。只有不断以良好政绩推动党和国家事业发展、造福人民，才能践行好党的宗旨，也才能完成好党的历史使命。各级领导干部要从实现党的使命任务出发，树立和践行正确政绩观，看自己的思想和行动（）", "opts": {"A": "有没有偏离共产主义远大理想和中国特色社会主义共同理想", "B": "有没有背离全心全意为人民服务根本宗旨", "C": "有没有游离党的路线方针政策和党中央重大决策部署", "D": "有没有脱离国情和本地区本部门实际"}, "ans": "ABCD", "exp": "树立和践行正确政绩观，起决定性作用的是党性。衡量党性强弱的根本尺子是公、私二字。只有党性坚强、摒弃私心杂念，才能保证政绩观不出偏差。各级领导干部要从实现党的使命任务出发，树立和践行正确政绩观，看自己的思想和行动有没有偏离共产主义远大理想和中国特色社会主义共同理想，有没有背离全心全意为人民服务根本宗旨，有没有游离党的路线方针政策和党中央重大决策部署，有没有脱离国情和本地区本部门实际，以功成不必在我、功成必定有我的精神境界，心无旁骛推进中国式现代化。"}, {"id": 67, "type": "mc", "q": "共产党人必须牢记，为民造福是最大政绩。干事业、创政绩，为的是造福人民，不是为了个人升迁得失。要把学习教育作为今年党的建设的重要任务，确保取得实效，必须（）", "opts": {"A": "认认真真、扎扎实实谋划推进工作", "B": "认认真真、扎扎实实提高思想认识", "C": "认认真真、扎扎实实整改突出问题", "D": "认认真真、扎扎实实立好制度规矩"}, "ans": "BCD", "exp": "谋划推进工作，一定要坚持全心全意为人民服务的根本宗旨，坚持以人民为中心的发展思想，坚持发展为了人民、发展依靠人民、发展成果由人民共享，把好事实事做到群众心坎上。要把学习教育作为今年党的建设的重要任务，确保取得实效。第一，认认真真、扎扎实实提高思想认识。第二，认认真真、扎扎实实整改突出问题。第三，认认真真、扎扎实实立好制度规矩。013修齐时政终极押题答案册·多项选择题"}, {"id": 68, "type": "mc", "q": "国共两党领导人时隔10年再次会面，对两党关系、两岸关系发展具有重要意义。无论国际形势、台海局势如何变化，中华民族伟大复兴的大趋势不会改变，两岸同胞走亲走021修齐时政终极押题习题册多项选择题近、走到一起的大潮流不会改变。两岸同胞都期盼台海和平安宁，期盼两岸关系改善发展，期盼生活更加美好，这是国共两党不可推卸的责任，也是携手合作的动力。习近平总书记就两岸关系发展提出的意见是（）", "opts": {"A": "坚持以正确认同促进心灵契合", "B": "坚持以和平发展守护共同家园", "C": "坚持以交流融合增进民生福祉", "D": "坚持以团结奋斗实现中华民族伟大复兴"}, "ans": "ABCD", "exp": "习近平就两岸关系发展提出4点意见。第一，坚持以正确认同促进心灵契合。第二，坚持以和平发展守护共同家园。第三，坚持以交流融合增进民生福祉。第四，坚持以团结奋斗实现中华民族伟大复兴。"}, {"id": 69, "type": "mc", "q": "在浙江工作期间，习近平同志多次到义乌调研，以“‘莫名其妙’的发展、’无中生有’的发展、’点石成金’的发展”精辟点明“义乌发展经验”的精髓。2006年4月，《关于学习推广义乌发展经验的通知》下发，决定在全省范围内学习推广。20年后，在“十五五”开局起步的关键时期，习近平总书记就进一步总结好、运用好“义乌发展经验”作出重要指示，具有的指引全局的重大意义有（）", "opts": {"A": "因地制宜发展县域经济", "B": "尊重基层和群众首创精神", "C": "以正确政绩观干事创业", "D": "高质量发展全国样板"}, "ans": "ABC", "exp": "20年后，在“十五五”开局起步的关键时期，习近平总书记就进一步总结好、运用好“义乌发展经验”作出重要指示，具有指引全局的重大意义。第一，因地制宜发展县域经济。第二，尊重基层和群众首创精神。第三，以正确政绩观干事创业。今年是习近平同志亲自总结推广“义乌发展经验”20年。"}, {"id": 70, "type": "mc", "q": "阿联酋是中国的全面战略伙伴，中方始终高度重视发展同阿联酋的关系。在双方共同努力下，中阿关系保持健康稳定发展，政治互信不断加深，务实合作稳步推进，人文交流丰富多彩。中方愿同阿方携手同行，打造更加稳固坚韧、富有活力的中阿全面战略伙伴关系。习近平主席就维护和促进中东和平稳定提出的主张是（）", "opts": {"A": "坚持和平共处原则", "B": "坚持国家主权原则", "C": "坚持国际法治原则", "D": "坚持统筹发展和安全"}, "ans": "ABCD", "exp": "习近平强调了中方劝和促谈的原则立场，重申将继续为此发挥建设性作用。习近平就维护和促进中东和平稳定提出4点主张：一是坚持和平共处原则。二是坚持国家主权原则。三是坚持国际法治原则。四是坚持统筹发展和安全。"}, {"id": 71, "type": "mc", "q": "2026年4月15日，中共中央总书记、国家主席习近平和夫人彭丽媛同来华进行国事访问的越共中央总书记、国家主席苏林和夫人吴芳璃亲切话别。两国领导人就共同关心的全022修齐时政终极押题习题册多项选择题局性、战略性问题进行了长时间深入交流，达成许多新的重要共识。习近平主席说中越要做（）", "opts": {"A": "社会主义事业的命运共同体", "B": "维护世界和平的命运共同体", "C": "实现现代化的命运共同体", "D": "推动构建人类命运共同体的伙伴"}, "ans": "ACD", "exp": "习近平说，今天，我同苏林总书记、国家主席就共同关心的全局性、战略性问题进行了长时间深入交流，达成许多新的重要共识。我突出感受到，中越都是社会主义国家，我们要继续沿着这条道路确定的方向坚定前行，做社会主义事业的命运共同体；我们是休戚与共的好邻居，正在共同奔向现代化，要做实现现代化的命运共同体；我们都主张天下大同，在世界百年变局下，要做推动构建人类命运共同体的伙伴。"}, {"id": 72, "type": "mc", "q": "2026年4月21日，国家主席习近平在北京人民大会堂同来华进行国事访问的莫桑比克总统查波举行会谈。两国元首一致同意将双边关系提升至新时代中莫命运共同体。建交以来，中莫两国相互信任、守望相助，成为中非友好和南南合作的典范。中东战事影响外溢波及非洲国家，中方愿同非方携手应对，共促和平、共谋发展。对此，习近平主席提出（）", "opts": {"A": "坚守原则促和平", "B": "保持定力谋发展", "C": "合作共赢树典范", "D": "携手应对新挑战"}, "ans": "ABC", "exp": "习近平指出，中非开启外交关系70年来，无论国际形势如何变化，双方始终风雨同舟、并肩前行，以中国和非洲为代表的全球南方始终是动荡变革世界里的正义力量。中东战事影响外溢波及非洲国家，中方愿同非方携手应对，共促和平、共谋发展。一是坚守原则促和平。二是保持定力谋发展。三是合作共赢树典范。"}, {"id": 73, "type": "mc", "q": "《中共中央办公厅国务院办公厅关于更高水平更高质量做好节能降碳工作的意见》的发布，为未来一段时期高质量推进节能降碳工作明确了路径。我国节能降碳形势依然较为严峻，能源结构偏煤、产业结构偏重、环境约束偏紧的国情没有改变，化石能源和传统产业占比仍然较高，生态环境质量稳中向好的基础还不牢固，经济社会发展全面绿色转型仍面临不少困难挑战。节能降碳（）", "opts": {"A": "是实现高质量发展的重要举措", "B": "是保障国家能源安全的关键", "C": "是推进现代化建设的重大原则", "D": "是确保如期实现碳达峰的支撑"}, "ans": "ABD", "exp": "节能降碳是实现高质量发展的重要举措。节能降碳是保障国家能源安全的关键。节能降碳也是确保如期实现碳达峰的支撑。绿水青山就是金山银山，这是重要的发展理念，也是推进现代化建设的重大原则。"}, {"id": 74, "type": "mc", "q": "习近平总书记指出：“领导干部要胸怀两个大局，一个是中华民族伟大复兴的战略全局，一个是世界百年未有之大变局，这是我们谋划工作的基本出发点。”实施好“十五五”规023修齐时政终极押题习题册多项选择题划纲要，首要的是在思想认识和工作方法上更好统筹两个大局。确保“十五五”规划纲要在实施中不偏航、不走样、行稳致远的认识论、方法论基础有（）", "opts": {"A": "善于历史思维，在指导现实工作中把握前进方向", "B": "坚持系统观念，在内外联动中拓展发展空间", "C": "把握战略主动，在识变应变求变中开创发展新局", "D": "增强底线思维，在居安思危中稳步前行"}, "ans": "BCD", "exp": "实施好“十五五”规划纲要，首要的是在思想认识和工作方法上更好统筹两个大局。这是确保“十五五”规划纲要在实施中不偏航、不走样、行稳致远的认识论、方法论基础。——坚持系统观念，在内外联动中拓展发展空间。系统观念是具有基础性的思想方法和工作方法，也是更好统筹两个大局的核心要义，要求以普遍联系、内外兼顾的观点思考和解决问题。——把握战略主动，在识014修齐时政终极押题答案册·多项选择题变应变求变中开创发展新局。两个大局，既是当下的客观存在，也是可以塑造的未来。——增强底线思维，在居安思危中稳步前行。更好统筹两个大局，内在要求增强底线思维，统筹发展和安全。着眼中华民族伟大复兴战略全局，聚焦高质量发展的首要任务，使发展根基更稳、韧性更强。着眼世界百年未有之大变局，以自身发展为世界提供确定性和新机遇。"}, {"id": 75, "type": "mc", "q": "2026年3月12日，经过2700多名全国人大代表的认真审议、热烈讨论之后，十四届全国人大四次会议高票通过了《中华人民共和国民族团结进步促进法》。这是（）", "opts": {"A": "充分发挥人民代表大会制度重要载体作用的生动民主实践", "B": "贯彻习近平法治思想，坚持依宪立法、依法立法原则的生动法治实践", "C": "更广泛凝聚立法共识、巩固思想基础的生动团结实践", "D": "中国特色解决民族问题，坚持统一和自治相结合的生动制度实践"}, "ans": "ABC", "exp": "2026年3月12日，经过2700多名全国人大代表的认真审议、热烈讨论之后，十四届全国人大四次会议高票通过了《中华人民共和国民族团结进步促进法》。这是践行全过程人民民主重大理念，充分发挥人民代表大会制度重要载体作用的生动民主实践，是贯彻习近平法治思想，坚持依宪立法、依法立法原则的生动法治实践，是贯彻习近平总书记关于加强和改进民族工作的重要思想，更广泛凝聚立法共识、巩固思想基础的生动团结实践，充分展现在中国共产党领导下全国各族人民共同团结奋斗、共同繁荣发展的精神面貌，具有深远的历史意义和重要的现实意义。"}, {"id": 76, "type": "mc", "q": "制定出台民族团结进步促进法，充分体现了党和国家对民族工作发展认识和判断的不断深化、对宪法规定与时俱进的理解和把握，进一步丰富了宪法关于民族问题规定的制度内涵，通过做“制度加法”写入符合新时代新要求的措施机制，并做好与其他法律法规的协调和衔接，有助于更好发挥宪法在维护国家统一、民族团结、社会和谐稳定等方面的重要作用，符合宪法规定、原则和精神。民族团结进步促进法是新时代实施宪法有关规定、处理民族事务和开展民族工作的基本法律，必须（）", "opts": {"A": "坚持党对民族工作的全面领导，全面贯彻习近平总书记关于加强和改进民族工作的重要思想", "B": "坚持以铸牢中华民族共同体意识为主线，聚焦调整新时代社会主义民族关系", "C": "坚定不移走中国特色解决民族问题的正确道路，全面推进民族团结进步事业", "D": "坚持依法治理民族事务，维护国家统一、民族团结、社会和谐稳定"}, "ans": "ABCD", "exp": "民族团结进步促进法是新时代实施宪法有关规定、处理民族事务和开展民族工作的基本法律。一是坚持党对民族工作的全面领导，全面贯彻习近平总书记关于加强和改进民族工作的重要思想。二是坚持以铸牢中华民族共同体意识为主线，聚焦调整新时代社会主义民族关系。三是坚定不移走中国特色解决民族问题的正确道路，全面推进民族团结进步事业。四是坚持依法治理民族事务，维护国家统一、民族团结、社会和谐稳定。"}, {"id": 77, "type": "mc", "q": "民族团结进步促进法顺应中华民族从历史走向未来、从传统走向现代、从多元凝聚为一体的发展大趋势，以中华民族共同体的形成和发展为叙事主线，阐述了中国各族人民在024修齐时政终极押题习题册多项选择题长期交往交流交融中形成命运共同体的中华民族历史观，规定以增进共同性为方向，维护、巩固和发展平等团结互助和谐的社会主义民族关系。其中，明确的原则有（）", "opts": {"A": "民族平等", "B": "民族自治", "C": "民族团结", "D": "民族进步"}, "ans": "ACD", "exp": "民族团结进步促进法顺应中华民族从历史走向未来、从传统走向现代、从多元凝聚为一体的发展大趋势，以中华民族共同体的形成和发展为叙事主线，阐述了中国各族人民在长期交往交流交融中形成命运共同体的中华民族历史观，规定以增进共同性为方向，维护、巩固和发展平等团结互助和谐的社会主义民族关系，明确民族平等、民族团结、民族进步三大原则，是一部聚焦于调整全国范围内民族关系的“中华民族法”，进一步增强了中华民族凝聚力和向心力，深化了对于宪法中“中华民族”概念内涵的理解和认识。"}, {"id": 78, "type": "mc", "q": "2026年3月12日，十四届全国人大四次会议表决通过《中华人民共和国民族团结进步促进法》，国家主席习近平签署第七十一号主席令予以公布，自7月1日起施行。这是党的统一战线和民族工作历史上具有里程碑意义的一件大事，是铸牢中华民族共同体意识、推进中华民族共同体建设的重大法治举措。中华人民共和国民族团结进步促进法》是（）", "opts": {"A": "一部保障民族区域自治制度贯彻实施的基本法律", "B": "一部宣示党和国家关于民族工作大政方针的重要法律", "C": "一部维护中华民族根本利益和整体利益的促进型法律", "D": "一部实施宪法有关规定、处理民族事务和开展民族工作的基本法律"}, "ans": "BCD", "exp": "制定民族团结进步促进法，是以习近平同志为核心的党中央着眼新时代新征程党的民族工作的历史方位，部署的重大政治任务和立法任务。要从深刻领悟“两个确立”的决定性意义、坚决做到“两个维护”的高度，充分认识制定民族团结进步促进法的重大意义，准确把握该法独特的法律定位与法治功能。这是一部宣示党和国家关于民族工作大政方针的重要法律；这是一部维护中华民族根本利益和整体利益的促进型法律；这是一部实施宪法有关规定、处理民族事务和开展民族工作的基本法律。《中华人民共和国民族区域自治法》是保障民族区域自治制度贯彻实施的基本法律。"}, {"id": 79, "type": "mc", "q": "民族团结进步促进法是党的十八大以来唯一一部单设序言的新制定法律，充分体现了统摄性、纲领性的基本法律地位。民族团结进步促进法体系完整、内容全面、内涵丰富，体现了鲜明的价值导向、突出的时代特征、深刻的制度逻辑。深入领会民族团结进步促进法的内涵要义，必须（）", "opts": {"A": "坚持突出主线引领", "B": "坚持守正创新结合", "C": "坚持引导约束并重", "D": "坚持加强宣传阐释"}, "ans": "ABC", "exp": "深入领会民族团结进步促进法的内涵要义015修齐时政终极押题答案册·多项选择题民族团结进步促进法体系完整、内容全面、内涵丰富，体现了鲜明的价值导向、突出的时代特征、深刻的制度逻辑。第一，坚持突出主线引领。第二，坚持守正创新结合。第三，坚持引导约束并重。扎实推进民族团结进步促进法全面实施：坚持党的领导、加强宣传阐释、依法推进民族事务治理、推动形成工作合力。"}, {"id": 80, "type": "mc", "q": "在“十五五”开局之年，党中央决定设立内蒙古自贸试验区，进一步完善自贸试验区总体布局，这是深入实施自贸试验区提升战略的重要部署，也是扩大高水平对外开放的重要举措。《中国（内蒙古）自由贸易试验区总体方案》的特点有（）", "opts": {"A": "着力赋能提升，探索联通内外新示范025修齐时政终极押题习题册多项选择题", "B": "培育贸易动能，稳步拓展市场新空间", "C": "扩大高水平开放，打造互利合作新样板", "D": "服务国家战略，塑造产业发展新优势"}, "ans": "ACD", "exp": "商务部部长助理袁晓明说，在“十五五”开局之年，党中央决定设立内蒙古自贸试验区，进一步完善自贸试验区总体布局，这是深入实施自贸试验区提升战略的重要部署，也是扩大高水平对外开放的重要举措。据袁晓明介绍，《总体方案》的特点可以概括为三个“新”。着力赋能提升，探索联通内外新示范。扩大高水平开放，打造互利合作新样板。服务国家战略，塑造产业发展新优势。“十五五”时期，全球产业链加速重构，数智化和绿色转型步伐加快，中国服务业基础更加坚实，为服务贸易发展带来全新的历史机遇。商务部深入实施服务业提质扩能行动，加快服务贸易创新发展，推动服务业开放合作，培育更多“中国服务”品牌。商务部将重点从以下三个方面发力，可以概括为“三个新”。第一个“新”是加快培育贸易新动能。第二个“新”是稳步拓展市场新空间。第三个“新”是积极推动环境新提升。"}, {"id": 81, "type": "mc", "q": "内蒙古积极参与共建“一带一路”，是中蒙俄经济走廊的重要节点，《中国（内蒙古）自由贸易试验区总体方案》将制度型开放和差别化探索相结合，支持内蒙古自贸试验区深化与周边国家发展融合，服务构建周边命运共同体。自贸试验区要在“联通”上下功夫，具体来看，包括（）", "opts": {"A": "构建高水平互联互通网络，深化基础设施“硬联通”", "B": "加强贸易投资领域合作，促进规则标准“软联通”", "C": "提升数字技术领域合作，打造未来产业“新联通”", "D": "深化服务领域务实合作，加强交流交往“心联通”"}, "ans": "ABD", "exp": "商务部自贸区港建设协调司负责人何咏前说，内蒙古积极参与共建“一带一路”，是中蒙俄经济走廊的重要节点，《总体方案》将制度型开放和差别化探索相结合，支持内蒙古自贸试验区深化与周边国家发展融合，服务构建周边命运共同体。自贸试验区要在“联通”上下功夫，具体来看，包括3个方面：一是构建高水平互联互通网络，深化基础设施“硬联通”；二是加强贸易投资领域合作，促进规则标准“软联通”；三是深化服务领域务实合作，加强交流交往“心联通”。"}, {"id": 82, "type": "mc", "q": "提振消费是稳增长、调结构、惠民生的战略之举。“十五五”规划《纲要》明确提出要推动居民消费率明显提高，目前我国的超大规模市场优势还没有充分发挥出来，扩大消费特别是服务消费潜力巨大。在当前和未来一段时期，扩大消费的重点是（）", "opts": {"A": "注重增强消费能力", "B": "注重提升消费品质", "C": "注重培育消费场景", "D": "注重优化消费环境"}, "ans": "ABCD", "exp": "原稿未附解析。"}, {"id": 83, "type": "mc", "q": "党的十八大以来，党中央高度重视基础研究，通过优化科研布局、加大投入保障、创新体制机制等，推动我国基础研究水平显著提升。当前，新一轮科技革命和产业变革加速突破，全球科技竞争更加聚焦基础前沿领域，原创性颠覆性创新的重要性日益凸显。基础研究是（）", "opts": {"A": "整个科学体系的源头", "B": "是所有技术问题的总机关", "C": "世界科技强国竞争的着力点", "D": "攀登世界科技高峰的必由之路026修齐时政终极押题习题册多项选择题"}, "ans": "AB", "exp": "基础研究是整个科学体系的源头，是所有技术问题的总机关。要以更大力度、更实举措加强基础研究，提升我国原始创新能力，进一步打牢科技强国建设根基。基础研究是科技创新的源头，加强基础研究是科技自立自强的必然要求，是从未知到已知、从不确定性到确定性的必然选择。自主创新是我们攀登世界科技高峰的必由之路。国家战略科技力量是世界科技强国竞争的着力点。"}, {"id": 84, "type": "mc", "q": "我国经济是靠实体经济起家的，也要靠实体经济走向未来。要坚持把发展经济的着力点放在实体经济上，推动资源要素向实体经济集聚、政策措施向实体经济倾斜、工作力量向实体经济加强，扎实推进新型工业化，不断做强做优做大实体经济。实体经济是（）", "opts": {"A": "一国经济的立身之本", "B": "财富创造的根本源泉", "C": "国家强盛的重要支柱", "D": "全体人民的宝贵财富"}, "ans": "ABC", "exp": "实体经济是一国经济的立身之本，是财富创造的根本源泉，是国家强盛的重要支柱。不论经济发展到什么时候，实体经济都是我国经济发展、我们在国际经济竞争中赢得主动的根基。公有制经济是全体人民的宝贵财富。016修齐时政终极押题答案册·多项选择题"}, {"id": 85, "type": "mc", "q": "中国和文莱是亲密邻邦，海上丝绸之路将两国紧紧联系在一起。中文合作不仅给两国人民带来实实在在利益，也树立了大小国家平等相待、合作共赢的典范。今年是中文建交35周年。面对变乱交织的国际形势，双方要以构建中文命运共同体为引领，加强战略沟通，深化务实合作，为地区和平稳定注入更多正能量。双方要做（）", "opts": {"A": "高度互信的战略伙伴", "B": "互利共赢的发展伙伴", "C": "相知相亲的文明伙伴", "D": "全球治理的合作伙伴"}, "ans": "ABCD", "exp": "今年是中国“十五五”开局之年，文莱正朝着“2035宏愿”奋进，双方要以此为契合点，推动中文合作迈上新台阶。一是要做高度互信的战略伙伴，继续坚定相互支持，统筹推进各领域交流合作。二是要做互利共赢的发展伙伴，推进重大旗舰合作项目，拓展人工智能、数字经济等新兴领域合作。三是要做相知相亲的文明伙伴，共同践行全球文明倡议，密切人文交流，打造民心相通新亮点。四是要做全球治理的合作伙伴，同东盟国家一道，推动构建更为紧密的中国—东盟命运共同体，把本地区建设成为百年变局中和平稳定和发展繁荣的示范高地。"}, {"id": 86, "type": "mc", "q": "“中美建设性战略稳定关系”是中国和美国的关系新定位，保持经贸关系稳定、拓展各领域务实合作、妥善解决彼此关切，就国际和地区问题加强沟通和协调，为未来3年乃至更长时间的中美关系提供战略指引。这不是一句口号，而应该是相向而行的行动，“建设性战略稳定”应该是（）", "opts": {"A": "合作为主的积极稳定", "B": "竞争有度的良性稳定", "C": "分歧可控的常态稳定", "D": "和平可期的持久稳定"}, "ans": "ABCD", "exp": "“建设性战略稳定”应该是合作为主的积极稳定，应该是竞争有度的良性稳定，应该是分歧可控的常态稳定，应该是和平可期的持久稳定。“中美建设性战略稳定关系”不是一句口号，而应该是相向而行的行动。"}, {"id": 87, "type": "mc", "q": "55年前，中美开展“乒乓外交”，推开了中美冰封20多年的大门，成为当代国际关系史上的重大事件。此后，中美之间以很多开放合作的故事，不断书写着友谊的佳话。两国合027修齐时政终极押题习题册多项选择题则两利、斗则俱伤，应该成为伙伴而不是对手。纵观中美关系发展历程，双边关系能否稳定发展的关键所在是能不能做到（）", "opts": {"A": "相互尊重", "B": "和平共处", "C": "合作共赢", "D": "重信守义"}, "ans": "ABC", "exp": "我们一致认为，中美关系是当今世界最重要的双边关系，只能搞好不能搞坏。两国合则两利、斗则俱伤，应该成为伙伴而不是对手。我们同意构建中美建设性战略稳定关系，推动中美关系稳定、健康、可持续发展，为世界带来更多和平、繁荣、进步。纵观中美关系发展历程，能不能做到相互尊重、和平共处、合作共赢是双边关系能否稳定发展的关键所在。"}, {"id": 88, "type": "mc", "q": "今年是中俄战略协作伙伴关系建立30周年。30年来，中俄关系栉风沐雨、与时俱进，关系定位不断提升，达到新时代全面战略协作伙伴关系的历史最高水平，树立起新型大国关系的典范。双方要顺应和平、发展、合作、共赢的时代潮流，推动中俄关系实现更高质量发展。为此，习近平主席提出（）", "opts": {"A": "筑牢更高质量政治互信，坚定彼此战略支持", "B": "赋能更高质量互利合作，携手推进各自发展振兴", "C": "推进更高质量民心相通，厚植两国世代友好根基", "D": "开展更高质量国际协作，改革完善全球治理"}, "ans": "ABCD", "exp": "中俄关系已经迈上新起点。双方要顺应和平、发展、合作、共赢的时代潮流，推动中俄关系实现更高质量发展。一是筑牢更高质量政治互信，坚定彼此战略支持。二是赋能更高质量互利合作，携手推进各自发展振兴。三是推进更高质量民心相通，厚植两国世代友好根基。四是开展更高质量国际协作，改革完善全球治理。"}, {"id": 89, "type": "mc", "q": "中国和巴基斯坦是山水相连、命运与共的好朋友和全天候战略合作伙伴。建交75年来，无论国际形势如何变化，中巴友谊始终坚如磐石、牢不可破。两国树立了国与国关系的典范，长期保持（）", "opts": {"A": "高水平政治互信", "B": "高水平务实合作", "C": "高水平安全合作", "D": "高水平国际协作"}, "ans": "ABCD", "exp": "建交75年来，无论国际形势如何变化，中巴友谊始终坚如磐石、牢不可破。两国长期保持高水平政治互信、高水平务实合作、高水平安全合作、高水平国际协作，树立了国与国关系的典范。"}, {"id": 90, "type": "mc", "q": "我国从积贫积弱的农业国发展成为世界第二大经济体并向全面建成社会主义现代化强国目标迈进，这一系列五年规划在其中发挥了重要作用。实践证明，制定和实施五年规划，是我们党治国理政一条重要经验，是中国特色社会主义制度一个重要政治优势。这主要体现在（）", "opts": {"A": "有利于实现党的领导028修齐时政终极押题习题册多项选择题", "B": "有利于集中力量办大事", "C": "有利于前瞻性把握战略问题", "D": "有利于保持事业连续性"}, "ans": "ABCD", "exp": "实践证明，制定和实施五年规划，是我们党治国理政一条重要经验，是中国特色社会主义制度一个重要政治优势。这主要体现在4个方面。一是有利于实现党的领导。二是有利于集中力量办大事。三是有利于前瞻性把握战略问题。四是有利于保持事业连续性。"}, {"id": 91, "type": "mc", "q": "制定和实施五年规划，是一项政治性、政策性很强的工作，我们党在长期实践中创造积累了丰富经验。除了坚持党中央集中统一领导之外，还有（）", "opts": {"A": "坚持从实际出发", "B": "坚持全国一盘棋", "C": "坚持发扬民主、集思广益", "D": "坚持规划法定原则"}, "ans": "ABCD", "exp": "制定和实施五年规划，是一项政治性、政策性很强的工作，我们党在长期实践中创造积累了丰富经验。主要有：坚持党中央集中统一领导，由党中央把方向、谋大局、作决策，制定规划建议和重大政策性文件；坚持从实际出发，统筹国内和国际，兼顾需要和可能、当前和长远，在全017修齐时政终极押题答案册·多项选择题面吃透情况的基础上科学确定目标任务、提出政策措施；坚持全国一盘棋，下位规划服从上位规划，等位规划相互协调，各级各类规划整体联动、形成合力；坚持发扬民主、集思广益，把顶层设计和问计于民统一起来，使规划广泛汇集经验智慧，充分激发各方面积极性；坚持规划法定原则，定了就抓落实，不随意更改、不折腾。"}, {"id": 92, "type": "mc", "q": "2026年5月1日起，中国对53个非洲建交国全面实施零关税举措。这是中国扩大高水平对外开放的新举措，将为中非携手迈向现代化注入新动能。在经济全球化遭遇逆流，单边主义、保护主义愈演愈烈的背景下，中国进一步主动向非洲国家敞开超大规模市场大门，是“减法”更是“加法”，以关税之“减”，撬动发展之“增”，串联市场之“通”，实现价值之“融”，充分彰显中国“计利当计天下利”的大国胸襟与责任担当。关税“减法”（）", "opts": {"A": "赋能科技“加法”，携手应对全球性挑战", "B": "促成贸易“加法”，书写互利共赢的经贸故事", "C": "推动发展“加法”，激活产供链的双向赋能", "D": "实现民生“加法”，发展成果惠及双方民众"}, "ans": "BCD", "exp": "关税“减法”促成贸易“加法”，书写互利共赢的经贸故事。关税“减法”推动发展“加法”，激活产供链的双向赋能。关税“减法”实现民生“加法”，发展成果惠及双方民众。近30亿人口构成的两大市场深度交融互通，必将孕育前所未有的增长机遇，汇聚携手前行的现代化动能，共同勾勒出中非携手共赴现代化的壮阔图景。"}, {"id": 93, "type": "mc", "q": "国际社会普遍期待，在中俄两国元首的掌舵领航下，中俄关系继续沿着正确轨道不断向前发展，为维护全球战略稳定和国际公平正义作出新的积极贡献。回望中俄关系发展历程，元首引领始终是两国关系高水平发展的最大优势和根本保障。中俄关系最本质的特征是（）", "opts": {"A": "永久睦邻友好", "B": "全面战略协作", "C": "互利合作共赢", "D": "始终彼此成就029修齐时政终极押题习题册多项选择题"}, "ans": "ABC", "exp": "永久睦邻友好、全面战略协作、互利合作共赢是中俄关系最本质的特征。今年是中俄战略协作伙伴关系建立30周年、《中俄睦邻友好合作条约》签署25周年，也是“中俄教育年”启动之年。"}, {"id": 94, "type": "mc", "q": "党近年来，党中央高度重视未来产业发展，加强战略谋划，强化政策支持，推动未来产业发展呈现良好势头。新征程上，我们要站在推进强国建设、民族复兴伟业的战略高度，立足客观条件，发挥比较优势，坚持稳中求进、梯度培育，推动我国未来产业发展不断取得新突破。培育发展未来产业的重要意义在于（）", "opts": {"A": "抢占科技和产业制高点、牢牢把握发展主动权", "B": "发展新质生产力、建设现代化产业体系", "C": "提高人民生活品质、促进人的全面发展和社会全面进步", "D": "推动高质量发展、塑造国际合作和竞争新优势"}, "ans": "ABC", "exp": "培育发展未来产业，对于我们抢占科技和产业制高点、牢牢把握发展主动权，对于发展新质生产力、建设现代化产业体系，对于提高人民生活品质、促进人的全面发展和社会全面进步，都具有重要意义。"}, {"id": 95, "type": "mc", "q": "中方始终将老挝视作周边外交重要方向，坚定支持老挝走符合自身国情的社会主义道路，愿同老方弘扬传统友谊，深化互利合作，密切团结协作，推动中老关系实现新的跃升，携手打造新时代全天候中老命运共同体。习近平主席就推进中老关系和两国命运共同体建设不断向高标准、高质量、高水平迈进提出的看法有（）", "opts": {"A": "要坚持社会主义方向", "B": "要筑牢互利合作基石", "C": "要巩固人民传统友好", "D": "要加强对外政策协调"}, "ans": "ABCD", "exp": "习近平就推进中老关系和两国命运共同体建设不断向高标准、高质量、高水平迈进提出四点看法：第一，要坚持社会主义方向。第二，要筑牢互利合作基石。第三，要巩固人民传统友好。第四，要加强对外政策协调。"}, {"id": 96, "type": "mc", "q": "中朝两国同为共产党领导的社会主义国家。中朝传统友谊植根于双方共同的理想信念和奋斗目标，有深厚历史积淀、坚实政治基础、牢固情感纽带。中朝关系的鲜明特征始终是（）", "opts": {"A": "世代友好", "B": "政治互信", "C": "命运与共", "D": "守望相助"}, "ans": "ACD", "exp": "中朝传统友谊植根于双方共同的理想信念和奋斗目标，有深厚历史积淀、坚实政治基础、牢固情感纽带，世代友好、命运与共、守望相助始终是中朝关系的鲜明特征。无论国际形势如何变化，中国党和政府高度重视中朝传统友好的坚定立场不会改变，对金正恩总书记同志领导朝鲜社会主义事业的坚定支持不会改变，维护中朝双方共同利益和良好战略环境的坚定决心不会改变。"}, {"id": 97, "type": "mc", "q": "面对加速演进的世界百年变局，双方要登高望远、继往开来，从两党两国关系发展历程中汲取智慧，在人类历史发展大势中把握机遇，为中朝传统友谊注入新的时代内涵和强030修齐时政终极押题习题册多项选择题劲动力，开辟两国社会主义事业和地区和平与发展更加美好的前景。习近平主席就发展中朝关系提出的意见是（）", "opts": {"A": "坚持以高层交往为引领，夯实政治互信根基", "B": "坚持以为民造福为目标，提升务实合作水平", "C": "坚持以友谊传承为动力，拉紧民心相通纽带", "D": "坚持以公平正义为理念，丰富战略协作内涵"}, "ans": "ABCD", "exp": "习近平就发展中朝关系提出4点意见。第一，坚持以高层交往为引领，夯实政治互信根基。第二，坚持以为民造福为目标，提升务实合作水平。第三，坚持以友谊传承为动力，拉紧民心相通纽带。第四，坚持以公平正义为理念，丰富战略协作内涵。最高领导人战略引领是中朝关系的最大优势。中朝用鲜血凝成的传统友谊是两国人民共同的宝贵财富。018修齐时政终极押题答案册·多项选择题"}, {"id": 98, "type": "mc", "q": "维护好、巩固好、发展好中朝关系始终是中国党和政府坚定不移的方针。当前，中朝关系站在新的历史起点，面临新的发展机遇，肩负新的时代使命。中方愿同朝方一道，从战略高度把握中朝关系，推动中朝关系与时俱进、得到更大发展。为此，必须（）", "opts": {"A": "深化战略沟通，牢牢把握中朝关系发展正确方向", "B": "加强交流互鉴，共同推动两国社会主义事业行稳致远", "C": "拓展务实合作，持续增进两国人民福祉和友谊", "D": "密切多边协作，坚定捍卫国际公平正义"}, "ans": "ABCD", "exp": "中方愿同朝方一道，从战略高度把握中朝关系，推动中朝关系与时俱进、得到更大发展。——深化战略沟通，牢牢把握中朝关系发展正确方向。——加强交流互鉴，共同推动两国社会主义事业行稳致远。——拓展务实合作，持续增进两国人民福祉和友谊。——密切多边协作，坚定捍卫国际公平正义。"}, {"id": 99, "type": "mc", "q": "当前，国际和地区形势发生复杂深刻变化，中柬两国应该携手在变局中显担当、在乱象中守正道，为地区和平发展注入更多稳定性。两国要（）", "opts": {"A": "筑牢战略互信根基", "B": "走稳发展振兴之路", "C": "维护各自国家长治久安", "D": "打造战略协作典范"}, "ans": "ABCD", "exp": "当前，国际和地区形势发生复杂深刻变化，中柬两国应该携手在变局中显担当、在乱象中守正道，为地区和平发展注入更多稳定性。一要筑牢战略互信根基。二要走稳发展振兴之路。三要维护各自国家长治久安。四要打造战略协作典范。"}, {"id": 100, "type": "mc", "q": "2026年6月11日，为期两天的“2026·全球人权治理高端论坛”在北京开幕。本次论坛以“携手发展共享人权：《发展权利宣言》通过40周年与全球人权治理新愿景”为主题，为世界各国探讨人权保障新路径搭建了重要对话平台，向国际社会释放了同舟共济、携手完善全球人权治理的积极信号。对于广大发展中国家而言，首要的基本人权是（）", "opts": {"A": "生存权", "B": "发展权", "C": "监督权031修齐时政终极押题习题册多项选择题", "D": "生命权"}, "ans": "AB", "exp": "发展是实现人民幸福的关键，要以发展为本，不断夯实人权保障的物质根基。对于广大发展中国家而言，生存权、发展权是首要的基本人权。今年恰逢《发展权利宣言》通过40周年，国际社会应以此为契机，深入落实全球发展倡议，将发展权置于多边人权议程的突出位置。今年是联合国人权理事会成立20周年，立足新起点，全球人权治理更需践行真正的多边主义，维护联合国宪章宗旨和原则。世界上没有放之四海而皆准的人权道路模式。"}, {"id": 101, "type": "mc", "q": "在“2026·全球人权治理高端论坛”开幕式上，国家人权行动计划联席会议机制成员单位代表共同发布了《国家人权行动计划（2026—2030年）》。行动计划的目标是（）", "opts": {"A": "尊重人民主体地位", "B": "维护人民根本利益", "C": "促进社会公平正义", "D": "积极参与人权事务"}, "ans": "ABC", "exp": "行动计划的基本原则是：呵护人的生命、价值、尊严，以系统性思维谋划人权建设，依法、平等、务实、协调、合力推进人权事业发展，在物质文明、政治文明、精神文明、社会文明、生态文明协调发展中全方位提升各项人权保障水平，促进人的全面发展、社会全面进步。行动计划的目标是：尊重人民主体地位，维护人民根本利益，促进社会公平正义，让现代化建设成果更多更公平惠及全体人民。"}, {"id": 102, "type": "mc", "q": "当前，我国发展的内外部环境都发生着深刻变化，世界之变、时代之变、历史之变正以前所未有的方式展开，我国基础研究面临新的挑战和机遇。加强基础研究（）", "opts": {"A": "为人类文明贡献中国智慧的战略需要", "B": "实现高水平科技自立自强的迫切需要", "C": "抢抓新一轮科技革命和产业变革历史机遇的迫切需要", "D": "积极应对国际科技竞争的迫切需要"}, "ans": "ABCD", "exp": "加强基础研究，既是有效应对内外风险挑战、实现高水平科技自立自强的迫切要求，也是加快建设科技强国、为人类文明贡献中国智慧的战略需要。加强基础研究是实现高水平科技自立自强的迫切需要。加强基础研究是抢抓新一轮科技革命和产业变革历史机遇的迫切需要。加强基础研究是积极应对国际科技竞争的迫切需要。"}, {"id": 103, "type": "mc", "q": "党的十八大以来，党和国家高度重视基础研究，不断加大基础研究投入，深化科技体制改革，大力弘扬科学家精神，为基础研究发展营造良好环境，我国基础研究不断取得新进展，整体水平显著提升。要充分认识我国基础研究取得的历史性成就，主要表现在（）", "opts": {"A": "基础研究整体实力显著增强", "B": "基础研究人才培养显著加强", "C": "基础研究国际影响力显著提高", "D": "基础研究有力支撑经济社会高质量发展"}, "ans": "ACD", "exp": "充分认识我国基础研究取得的历史性成就，增强创新自信。党的十八大以来，党和国家高度重视基础研究，不断加大基础研究投入，深化科技体制改革，大力弘扬科学家精神，为基础研究发展营造良好环境，我国基础研究不断取得新进展，整体水平显著提升。一是基础研究整体实力显著增强。二是基础研究国际影响力显著提高。三是基础研究有力支撑经济社会高质量发展。019修齐时政终极押题答案册·多项选择题"}, {"id": 104, "type": "mc", "q": "在我们党的组织结构和国家政权结构中，县一级处在承上启下的关键环节，是发展经济、保障民生、维护稳定、促进国家长治久安的重要基础。县委是我们党执政兴国的“一线指挥部”，县委书记就是“一线总指挥”。当好县委书记，必须始终做到（）", "opts": {"A": "心中有党", "B": "心中有民032修齐时政终极押题习题册多项选择题", "C": "心中有责", "D": "心中有戒"}, "ans": "ABCD", "exp": "当好县委书记，必须始终做到心中有党。当好县委书记，必须始终做到心中有民。当好县委书记，必须始终做到心中有责。当好县委书记，必须始终做到心中有戒。"}, {"id": 105, "type": "mc", "q": "当前，世界百年变局加速演进，新一轮科技革命和产业变革加速突破，全球人工智能技术创新进入前所未有的活跃期，既蕴含巨大机遇，也面临治理挑战。各国应当秉持以人为本、向上向善理念，让人工智能成为促进共同繁荣、维护共同安全的一个重要动力源，携手构建公正合理的全球人工智能治理体系。习近平主席就此提出（）", "opts": {"A": "坚持开放共赢，驱动创新发展", "B": "强化风险意识，确保安全可控", "C": "鼓励包容并蓄，促进文明互鉴", "D": "倡导和衷共济，完善全球治理"}, "ans": "ABCD", "exp": "习近平就此提出4点意见：第一，坚持开放共赢，驱动创新发展。第二，强化风险意识，确保安全可控。第三，鼓励包容并蓄，促进文明互鉴。第四，倡导和衷共济，完善全球治理。"}, {"id": 106, "type": "mc", "q": "持之以恒推进全面从严治党要坚持马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观，全面贯彻习近平新时代中国特色社会主义思想，深入学习贯彻习近平党建思想，落实新时代党的建设总要求，以党章为根本，坚持和加强党中央集中统一领导，着眼于（）", "opts": {"A": "健全全面从严治党体系", "B": "提高党的长期执政能力", "C": "保持党的先进性和纯洁性", "D": "保持党同人民群众的血肉联系"}, "ans": "BCD", "exp": "深入学习贯彻习近平党建思想，落实新时代党的建设总要求，以党章为根本，坚持和加强党中央集中统一领导，着眼于提高党的长期执政能力、保持党的先进性和纯洁性、保持党同人民群众的血肉联系，坚持严的基调不动摇，健全全面从严治党体系，以党的政治建设为统领，全面推进党的各方面建设，充分激发全党积极性主动性创造性，不断实现党的自我净化、自我完善、自我革新、自我提高，确保党始终成为走在时代前列、人民衷心拥护、经得起各种风浪考验、朝气蓬勃的马克思主义执政党，始终成为中国特色社会主义事业的坚强领导核心。"}, {"id": 107, "type": "mc", "q": "中国和纳米比亚有着深厚传统友谊和共同发展追求。建交以来，两国始终平等相待、相互支持，友好合作不断深化，有力造福两国人民。两国领导人共同宣布将双边关系定位提升为新时代中纳命运共同体。习近平主席就构建新时代中纳命运共同体提出（）", "opts": {"A": "坚定相互支持，深化理念融通", "B": "保持战略定力，增强战略自信", "C": "挖掘合作潜力，提升合作水平", "D": "坚持团结协作，捍卫多边主义033修齐时政终极押题习题册多项选择题"}, "ans": "ACD", "exp": "两国领导人共同宣布将双边关系定位提升为新时代中纳命运共同体。中国和纳米比亚有着深厚传统友谊和共同发展追求。建交以来，两国始终平等相待、相互支持，友好合作不断深化，有力造福两国人民。习近平就构建新时代中纳命运共同体提出3点意见。一是坚定相互支持，深化理念融通。二是挖掘合作潜力，提升合作水平。三是坚持团结协作，捍卫多边主义。"}, {"id": 108, "type": "mc", "q": "中纳两国同为全球南方重要成员，拥有广泛共同利益和相近价值追求，应该加强团结协作，坚定相互支持，共同维护国际公平正义。帮助非洲开发丰富矿产资源、切实将资源优势转化为发展动能，是加快非洲现代化进程的重要途径。习近平主席指出，中方愿继续同包括纳米比亚在内的非洲国家加强矿业合作，重点把握好（）", "opts": {"A": "互利共赢", "B": "友好协商", "C": "开拓进取", "D": "平等相待"}, "ans": "ABC", "exp": "习近平指出，帮助非洲开发丰富矿产资源、切实将资源优势转化为发展动能，是加快非洲现代化进程的重要途径。中方愿继续同包括纳米比亚在内的非洲国家加强矿业合作，重点把握好3条原则。一是互利共赢。二是友好协商。三是开拓进取。"}, {"id": 109, "type": "mc", "q": "当前，国际形势变和乱的一面更加突出，需要进一步践行真正的多边主义、重振联合国地位和作用。为此，习近平主席强调（）", "opts": {"A": "坚持公道正义", "B": "坚持合作共赢", "C": "坚持守正创新", "D": "坚持担当作为"}, "ans": "ACD", "exp": "习近平强调，当前，国际形势变和乱的一面更加突出，需要进一步践行真正的多边主义、重振联合国地位和作用。一是坚持公道正义。二是坚持守正创新。三是坚持担当作为。"}, {"id": 110, "type": "mc", "q": "斯洛伐克是最早同新中国建交的国家之一，中斯友谊之树根深叶茂。2024年两国关系提升为战略伙伴关系。在双方共同努力下，两国互信持续深化，合作成果不断涌现，传统友好深入人心。中方愿同斯方一道，打造互尊互信、平等互利、稳定坚韧的中斯战略伙伴关系，更好造福两国人民。习近平主席强调，下阶段双方可以重点做好的工作是（）", "opts": {"A": "巩固战略互信，坚定相互支持", "B": "深化互利合作，促进共同发展", "C": "增进民心相通，赓续传统友谊", "D": "捍卫国际公平正义，改革完善全球治理"}, "ans": "ABCD", "exp": "习近平强调，下阶段双方可以重点做好4方面工作。一是巩固战略互信，坚定相互支持。二是深化互利合作，促进共同发展。三是增进民心相通，赓续传统友谊。四是捍卫国际公平正义，改革完善全球治理。"}, {"id": 111, "type": "mc", "q": "105年前，在中国人民和中华民族的伟大觉醒中，在马克思列宁主义同中国工人运动的紧密结合中，中国共产党应运而生。从此，中国人民和中华民族有了最可靠的主心骨，内忧外患、积贫积弱的中国开启了翻天覆地的历史巨变。105年不懈奋斗，从根本上改变了中国人民的前途命运。105年不懈奋斗（）034修齐时政终极押题习题册多项选择题", "opts": {"A": "开辟了实现中华民族伟大复兴的正确道路", "B": "展示了马克思主义的强大生命力", "C": "深刻影响了世界历史进程", "D": "锻造了强大的中国共产党"}, "ans": "ABCD", "exp": "105年来，我们党始终坚守为中国人民谋幸福、为中华民族谋复兴的初心使命，深刻洞察世界发展大势，准确把握各个历史时期社会主要矛盾变化，团结带领全国各族人民不懈奋斗，创造020修齐时政终极押题答案册·多项选择题了新民主主义革命、社会主义革命和建设、改革开放和社会主义现代化建设、新时代中国特色社会主义的伟大成就，书写了中华民族几千年历史上最恢宏的史诗。105年不懈奋斗，从根本上改变了中国人民的前途命运。105年不懈奋斗，开辟了实现中华民族伟大复兴的正确道路。105年不懈奋斗，展示了马克思主义的强大生命力。105年不懈奋斗，深刻影响了世界历史进程。105年不懈奋斗，锻造了强大的中国共产党。"}, {"id": 112, "type": "mc", "q": "我们党坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，不断推进马克思主义中国化时代化，形成毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、新时代中国特色社会主义思想，极大丰富和发展了马克思主义。今天，中国特色社会主义事业的蓬勃生机和旺盛活力，充分（）", "opts": {"A": "检验了马克思主义的科学性和真理性", "B": "体现了马克思主义的革命性和发展性", "C": "展现了马克思主义的人民性和实践性", "D": "彰显了马克思主义的开放性和时代性"}, "ans": "ACD", "exp": "我们党坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，不断推进马克思主义中国化时代化，形成毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、新时代中国特色社会主义思想，极大丰富和发展了马克思主义。今天，中国特色社会主义事业的蓬勃生机和旺盛活力，充分检验了马克思主义的科学性和真理性，充分展现了马克思主义的人民性和实践性，充分彰显了马克思主义的开放性和时代性。"}, {"id": 113, "type": "mc", "q": "实现新时代新征程党的使命任务，要求全体中国共产党人坚定信心、接续奋斗，不断创造无愧于时代和人民的新业绩。坚定信心、接续奋斗，必须坚持党的基本理论、基本路线、基本方略，必须（）", "opts": {"A": "紧紧依靠人民创造历史伟业", "B": "积极应对前进道路上的风险挑战", "C": "持续推动构建人类命运共同体", "D": "持之以恒推进全面从严治党"}, "ans": "ABCD", "exp": "“功崇惟志，业广惟勤。”实现新时代新征程党的使命任务，要求全体中国共产党人坚定信心、接续奋斗，不断创造无愧于时代和人民的新业绩。——坚定信心、接续奋斗，必须坚持党的基本理论、基本路线、基本方略。——坚定信心、接续奋斗，必须紧紧依靠人民创造历史伟业。——坚定信心、接续奋斗，必须积极应对前进道路上的风险挑战。——坚定信心、接续奋斗，必须持续推动构建人类命运共同体。——坚定信心、接续奋斗，必须持之以恒推进全面从严治党。"}, {"id": 114, "type": "mc", "q": "推进碳达峰碳中和，是以习近平同志为核心的党中央经过深思熟虑作出的重大战略决策，是我国对国际社会的庄严承诺，也是推动高质量发展的内在要求。国务院印发《“十五五”碳达峰行动方案》，对碳达峰工作作出系统部署。确保实现碳达峰目标，务实高效落实各项任务举措，需要处理好（）", "opts": {"A": "生态环境保护和经济发展的关系", "B": "供给变革和需求升级的关系", "C": "全面转型和重点突破的关系035修齐时政终极押题习题册多项选择题", "D": "夯实“硬基础”和优化“软环境”的关系"}, "ans": "BCD", "exp": "确保实现碳达峰目标，需要我们处理好三方面关系，务实高效落实各项任务举措。供给变革和需求升级的关系；全面转型和重点突破的关系；夯实“硬基础”和优化“软环境”的关系。"}, {"id": 115, "type": "mc", "q": "习近平总书记强调，“深入整治’内卷式’竞争，营造良好市场生态”。今年的《政府工作报告》提出，“加强反垄断、反不正当竞争，强化公平竞争审查刚性约束，综合运用产能调控、标准引领、价格执法、质量监管等手段，深入整治’内卷式’竞争”。深入整治“内卷式”竞争的意义在于（）", "opts": {"A": "充分激发各类经营主体活力的内在要求", "B": "推动产业提质升级的迫切需要", "C": "筑牢强大国内市场根基的重要举措", "D": "塑造国际竞争和合作新优势的战略选择"}, "ans": "ABCD", "exp": "深入整治“内卷式”竞争，是贯彻落实党中央加快建设全国统一大市场、推动高质量发展重大决策部署的必然要求，对于引导市场竞争从“拼价格”转向“拼质量、拼创新”的良性轨道，打通制约实体经济提质增效、国内循环畅通无阻的关键堵点，具有重要而深远的意义。充分激发各类经营主体活力的内在要求；推动产业提质升级的迫切需要；筑牢强大国内市场根基的重要举措；塑造国际竞争和合作新优势的战略选择。"}, {"id": 116, "type": "mc", "q": "建设三峡水运新通道工程是深入贯彻落实习近平总书记关于推动长江经济带高质量发展重要指示精神的重大举措。建设三峡水运新通道工程有利于长江综合立体交通走廊高质量发展，有利于推动长江经济带发展战略实施，有利于构建国内国际双循环的新发展格局，有利于生态优先、绿色发展理念落地实施。建设三峡水运新通道工程的重大意义在于（）", "opts": {"A": "是进入新发展阶段、支撑国家重大战略实施的标志性工程", "B": "是贯彻新发展理念、推动绿色低碳发展的综合性工程", "C": "是构建新发展格局、促进长江经济带高质量发展的战略性工程", "D": "是推动高质量发展、应对全球贸易变化的前瞻性工程"}, "ans": "ABC", "exp": "铸牢政治忠诚，深刻认识建设三峡水运新通道工程的重大意义。三峡水运新通道工程是进入新发展阶段、支撑国家重大战略实施的标志性工程。三峡水运新通道工程是贯彻新发展理念、推动绿色低碳发展的综合性工程。三峡水运新通道工程是构建新发展格局、促进长江经济带高质量发展的战略性工程。021修齐时政终极押题答案册·多项选择题"}, {"id": 117, "type": "mc", "q": "105年来，中国共产党始终站在历史正确一边、站在人类文明进步一边，以自强不息的奋斗深刻改变了世界发展的趋势和格局，深刻影响了世界历史进程。中国共产党领导的社会主义中国，持续推动构建人类命运共同体，为解决人类重大问题贡献了中国智慧、中国方案、中国力量，被公认为世界和平的建设者、全球发展的贡献者、国际秩序的维护者。中国始终（）", "opts": {"A": "坚持普惠包容，拓展共同发展的空间", "B": "弥合和平赤字，夯实和平安全的根基", "C": "促进文明互鉴，汇聚和合共生的力量", "D": "完善全球治理，筑牢公平正义的基石036修齐时政终极押题习题册多项选择题"}, "ans": "ABCD", "exp": "坚持普惠包容，拓展共同发展的空间——今年5月1日起，中国对53个非洲建交国全面实施零关税举措，成为全球首个对所有非洲建交国实现单方面全覆盖零关税待遇的主要经济体。弥合和平赤字，夯实和平安全的根基——促进文明互鉴，汇聚和合共生的力量——不久前，世界迎来第二个联合国“文明对话国际日”。完善全球治理，筑牢公平正义的基石——中方牵头发起的“全球治理之友小组”在联合国纽约、日内瓦和维也纳总部相继成立，发布《构建更加公正合理的全球治理体系：中国的理念、倡议与行动》白皮书……"}, {"id": 118, "type": "mc", "q": "社会工作是党和国家工作的重要组成部分。当前，我国正处于以中国式现代化全面推进强国建设、民族复兴伟业的关键时期，坚定不移走中国特色社会主义社会治理之路，对于做好社会工作、加强社会治理、维护社会稳定，确保社会在深刻变革中既生机勃勃又井然有序，续写经济快速发展和社会长期稳定两大奇迹新篇章的重大而深远的意义在于（）", "opts": {"A": "巩固党长期执政基础的必然要求", "B": "实现中国式现代化的必然要求", "C": "满足人民对美好生活向往的必然要求", "D": "维护社会和谐稳定的必然要求"}, "ans": "ABCD", "exp": "当前，我国正处于以中国式现代化全面推进强国建设、民族复兴伟业的关键时期，坚定不移走中国特色社会主义社会治理之路，对于做好社会工作、加强社会治理、维护社会稳定，确保社会在深刻变革中既生机勃勃又井然有序，续写经济快速发展和社会长期稳定两大奇迹新篇章具有重大而深远的意义。巩固党长期执政基础的必然要求。实现中国式现代化的必然要求。满足人民对美好生活向往的必然要求。维护社会和谐稳定的必然要求。"}, {"id": 119, "type": "mc", "q": "党的十八大以来，以习近平同志为核心的党中央坚持“两个结合”，在领导人民推进国家治理体系和治理能力现代化伟大实践中，把握时代特征，遵循治理规律，强化实践探索，不断完善中国特色社会主义社会治理体系，奋力开拓中国特色社会主义社会治理之路。要深刻把握其内在要求，更好地推进新时代社会工作，提高社会治理现代化水平。必须坚持（）", "opts": {"A": "系统治理", "B": "依法治理", "C": "综合治理", "D": "源头治理"}, "ans": "ABCD", "exp": "必须坚持和加强党的全面领导。必须坚持以人民为中心。必须坚持弘扬中华优秀传统文化。必须坚持共建共治共享。必须坚持系统治理、依法治理、综合治理、源头治理。必须坚持抓基层、强基础、固根本。"}, {"id": 120, "type": "mc", "q": "经济全球化为世界经济增长提供了强劲动力，促进了商品和资本流动、科技和文明进步、各国人民交往，是不可阻挡的历史大势。中国现代化产业发展对世界不是“中国冲击2.0”而是“中国机遇2.0”，具体体现在（）", "opts": {"A": "推动全球创新合作和科技进步", "B": "加快全球绿色低碳转型", "C": "进一步增进各国民生福祉", "D": "助力发展中国家工业化"}, "ans": "ABCD", "exp": "美国等西方国家谬称中国产业发展威胁西方国家垄断地位，挤压南方国家发展空间，抛出了所谓“中国冲击2.0”论调。这不符合事实，是站不住脚的。过去十多年，中国对全球经济增长贡献率一直保持在30%左右，是世界经济增长的重要引擎。过去，中国主要是以自身大规模市场、低成本要素为世界提供“市场红利”，现在中国在提供更大“市场红利”的同时，通过产业发展，为全球产业合作发挥了稳定锚和重要枢纽作用，创造了“发展红利”。还通过科技进步，为全球提供越来越多的“创新红利”。这些红利交融叠加，给世界带来的是更多的发展机遇、更大的发展空间，也就是国际社会越来越多提到的“中国机遇2.0”。具体体现在四个方面：推动全球创新合作和科技进步。加快全球绿色低碳转型。进一步增进各国民生福祉。助力发展中国家工业化。"}, {"id": 121, "type": "mc", "q": "2026年7月10日12时15分，长征十号乙运载火箭在海南商业航天发射场发射升空，将卫星顺利送入预定轨道，火箭一二级分离约6分钟后，一子级垂直返回，在海上回收平台通过网系捕获方式成功回收，发射及一子级回收任务取得圆满成功。此次任务是（）037修齐时政终极押题习题册多项选择题", "opts": {"A": "我国首次实现运载火箭一子级陆地垂直回收", "B": "我国首次成功实施运载火箭一子级可控回收", "C": "全球首次运载火箭网系回收", "D": "全球首次运载火箭集束回收"}, "ans": "BC", "exp": "2026年7月10日12时15分，长征十号乙运载火箭在海南商业航天发射场发射升空，将卫星顺利送入预定轨道，火箭一二级分离约6分钟后，一子级垂直返回，在海上回收平台通过网系捕获方式成功回收，发射及一子级回收任务取得圆满成功。此次任务是我国首次成功实施运载火箭一子级可控回收，同时也是全球首次运载火箭网系回收，标志着我国在重复使用火箭技术领域取得历史性突破，将为加快提升我国进出空间能力奠定坚实基础。长征十号乙运载火箭成为我国首型成功实施回收的重复使用运载火箭。022修齐时政终极押题答案册·多项选择题"}, {"id": 122, "type": "mc", "q": "到2035年建成健康中国，是中央作出的一项战略决策。“十五五”是实现这一目标的关键时期，必须统筹谋划、加紧推进，力求取得决定性进展。要坚持从我国国情出发推动卫生与健康事业发展。我国是社会主义国家，是人口规模巨大、城乡区域差距仍然较大的发展中国家，这决定我们必须坚持（）", "opts": {"A": "党对卫生与健康工作的领导", "B": "人民至上、生命至上", "C": "健康优先发展战略", "D": "基本医疗卫生事业的公益性"}, "ans": "ABCD", "exp": "我国是社会主义国家，是人口规模巨大、城乡区域差距仍然较大的发展中国家，这决定我们必须坚持党对卫生与健康工作的领导，坚持人民至上、生命至上，坚持健康优先发展战略，坚持基本医疗卫生事业的公益性，走中国特色卫生与健康发展道路。"}, {"id": 123, "type": "mc", "q": "坚持以习近平新时代中国特色社会主义思想为指导，以推动知识产权事业高质量发展为主题，以改革创新为根本动力，锚定建设中国特色、世界水平的知识产权强国目标，全面提升知识产权创造、运用、保护、管理、服务水平，统筹知识产权领域国际合作与竞争，加速知识产权与经济社会发展深度融合，为实现中国式现代化提供有力支撑。《知识产权保护和运用“十五五”规划》部署的重点任务是（）", "opts": {"A": "持续优化支持全面创新的知识产权保护环境", "B": "大力提升促进经济高质量发展的知识产权运用效能", "C": "不断健全推进高效能治理的知识产权综合管理体系", "D": "积极构建服务高水平对外开放的知识产权国际合作新格局"}, "ans": "ABCD", "exp": "国务院日前印发《知识产权保护和运用“十五五”规划》（以下简称《规划》），明确了“十五五”时期开展知识产权工作的目标指标、重点任务和专项工程。《规划》部署了四方面重点任务。一是持续优化支持全面创新的知识产权保护环境，完善知识产权法律制度，健全知识产权保护体系，加强涉外知识产权保护。二是大力提升促进经济高质量发展的知识产权运用效能，强化知识产权转化运用能力，加大促进新质生产力发展的知识产权供给，促进知识产权服务业高质量发展。三是不断健全推进高效能治理的知识产权综合管理体系，全面提高知识产权管理水平，加强知识产权公共服务，强化知识产权社会共治。四是积极构建服务高水平对外开放的知识产权国际合作新格局，深度参与全球知识产权治理，持续深化知识产权国际交流合作。"}, {"id": 124, "type": "mc", "q": "我国国土广袤、地理复杂、气候多样，自然灾害易发多发。党的十八大以来，党中央坚持把防灾减灾救灾工作作为关系人民安危和国家安全的大事来抓，在理念转变、体制改革、体系建设、能力提升等方面作出许多部署，带领广大干部群众战胜一系列重特大自然灾害，最大限度减少人员伤亡和财产损失，成效举世公认。做好防灾减灾救灾工作，必须坚持党的全面领导，坚持人民至上、生命至上，坚持 /* 数二 历年题型结构（严格按照真题）

function math2Secs(year){
  const pre = year <= 2020;
  const chQ = pre?8:10, chPt = pre?32:50, chPer = pre?4:5;
  const blQ = 6,         blPt = pre?24:30, blPer = pre?4:5;
  const svQ = pre?9:6,   svPt = pre?94:70;
  return [
    {k:'ch',s:'选择',n:'选择题',q:chQ,from:1,to:chQ,mode:'obj',pt:chPt,per:chPer},
    {k:'bl',s:'填空',n:'填空题',q:blQ,from:chQ+1,to:chQ+blQ,mode:'obj',pt:blPt,per:blPer},
    {k:'sv',s:'解答',n:'解答题',q:svQ,from:chQ+blQ+1,to:chQ+blQ+svQ,mode:'obj',pt:svPt}
  ];
}

function secAcc(subj, k, v, year){
  const d = secDef(subj,k,year); if(!d||!v) return null;
  if(d.mode==='sub'){ return d.pt>0 ? Math.max(0,Math.min(1, v.score/d.pt)) : null; }
  if(d.mode==='subq'){
    if(Array.isArray(v.scores) && v.scores.length) return d.pt>0 ? Math.max(0,Math.min(1, subqSum(v.scores,d.maxPer)/d.pt)) : null;
    const lt = v.total||d.q;
    if(!(lt>0) || !Array.isArray(v.wrong)) return null;
    return Math.max(0, Math.min(1, (lt - v.wrong.length)/lt));
  }
  const t = v.total||d.q; if(!(t>0)) return null;
  return Math.max(0, Math.min(1, (t - v.wrong.length)/t));
}

function paperScore(p){
  const secs = secsOf(p.subj, p.year); let got=0, full=0, wrong=0, recorded=0;
  secs.forEach(function(d){
    const v = p.secs[d.k]; if(!v) return;
    recorded++; full += d.pt;
    if(d.mode==='sub'){ got += v.score; }
    else if(d.mode==='subq'){
      if(Array.isArray(v.scores) && v.scores.length) got += Math.min(subqSum(v.scores,d.maxPer), d.pt);
      else { const lt=v.total||d.q; if(lt>0 && Array.isArray(v.wrong)) got += d.pt*(lt-v.wrong.length)/lt; }
    }
    else { const t=v.total||d.q; wrong += v.wrong.length; got += d.pt*(t-v.wrong.length)/t; }
  });
  return { got:Math.round(got*10)/10, full:full, wrong:wrong, recorded:recorded,
           total:paperFull(p.subj), rate: full>0 ? got/full : null };
}
function parseNums(str){
  const out=[];
  String(str||'').split(/[^0-9]+/).forEach(function(x){
    if(!x) return; const n=parseInt(x,10);
    if(isFinite(n) && n>0 && out.indexOf(n)<0) out.push(n);
  });
  out.sort(function(a,b){return a-b;});
  return out;
}

      const parts=key.split('#'); const d=secDef(p.subj,parts[0],p.year); if(!d) return;
      const v=p.secs[parts[0]]; if(!v) return;
      const _no = Number(parts[1]);
      if(d.mode==='obj'){

function roundWrongDiff(cur, first){

function normalize(o){
  const b = blank();
  if(!o || typeof o!=='object') return b;
  b.version = SCHEMA;
  b.overviewCollapsed = !!o.overviewCollapsed;

  if(!(Number(b.ui.ttsRate) > 0)) b.ui.ttsRate = 1;
  b.vocab = (o.vocab && typeof o.vocab==='object') ? o.vocab : {};
  b.pol = normalizePol(o.pol);

  if(!o.cats || !Array.isArray(o.cats)){

        from: /^\d{4}-\d{2}-\d{2}$/.test(p.from||'') ? p.from : todayStr(),
        wdays: Array.isArray(p.wdays) ? p.wdays.filter(function(w){ return w>=0&&w<=6; }) : [],

    });

      createdDate: /^\d{4}-\d{2}-\d{2}$/.test(c.createdDate||'') ? c.createdDate : todayStr(),
      seed: !!c.seed,

      checkins: ck,
      plans: plans

  });
  /* 真题试卷（v3 新增；旧备份里没有这个字段，保持空数组即可） */
  const seen = {};
  b.papers = (o.papers||[]).map(function(p,i){
    if(!p || typeof p!=='object') return null;
    const def = PAPERS[p.subj]; if(!def) return null;
    const yr = Math.round(Number(p.year)||0);
    if(!(yr>=1990 && yr<=2100)) return null;
    const src = (p.secs && typeof p.secs==='object') ? p.secs : {};
    const secs = {};
    secsOf(p.subj, yr).forEach(function(d){
      const v = src[d.k]; if(!v || typeof v!=='object') return;
      if(d.mode==='sub'){
        const sc = Number(v.score);
        if(!isFinite(sc) || sc<0) return;
        secs[d.k] = { score: Math.round(Math.min(d.pt, sc)*10)/10 };
      } else if(d.mode==='subq'){
        const arr = (Array.isArray(v.scores)?v.scores:[]).map(function(x){ const n=Number(x); return (isFinite(n)&&n>0)?Math.min(n,d.maxPer):0; });
        const sum = arr.reduce(function(a,b){return a+b;},0);
        if(sum>0){ secs[d.k] = { scores: arr, total: Math.round(Math.min(sum, d.pt)*10)/10 }; return; }
        /* 兼容早期「按题号标错」的解答题记录（只有 total/wrong、没有分数）。
           直接丢弃会让题号和错因备注一起消失，这里迁移成按题给分：
           标错的题记 0 分，其余记满分（分值上限 maxPer），数据和备注都保留。 */
        if(!Array.isArray(v.wrong) && !(Number(v.total) > 0)) return;
        const lw = (Array.isArray(v.wrong)?v.wrong:[]).map(function(x){ return Math.round(Number(x)); })
                     .filter(function(x){ return isFinite(x) && x>0; });
        const lu = []; lw.forEach(function(x){ if(lu.indexOf(x)<0) lu.push(x); });
        lu.sort(function(a,b){ return a-b; });

        const mig = [];
        for(let li=0; li<lq; li++) mig.push(lu.indexOf((d.from||0)+li)>=0 ? 0 : d.maxPer);
        const msum = mig.reduce(function(a,b){return a+b;},0);
        secs[d.k] = { scores: mig, total: Math.round(Math.min(msum, d.pt)*10)/10 };
      } else {
        let t, u = [];
        if(Array.isArray(v.scores)){
          /* 兼容「解答题逐题填分」时期的记录：回到按题号标错，得 0 分的题记为错题 */
          v.scores.forEach(function(x,i){ if(!(Number(x)>0)) u.push((d.from||0)+i); });
          t = Math.max(1, Math.round(Number(d.q)||0) || u.length || 1);
        } else {
          t = Math.max(1, Math.round(Number(v.total)||d.q));
          const w = (Array.isArray(v.wrong)?v.wrong:[]).map(function(x){ return Math.round(Number(x)); })
                     .filter(function(x){ return isFinite(x) && x>0; });
          w.forEach(function(x){ if(u.indexOf(x)<0) u.push(x); });
          u.sort(function(a,b){ return a-b; });
        }
        secs[d.k] = { total:t, wrong:u.slice(0,t) };
      }
    });
    if(!Object.keys(secs).length) return null;
    const ms = (p.marks && typeof p.marks==='object') ? p.marks : {};
    const marks = {};
    Object.keys(ms).forEach(function(key){
      const mk = ms[key]; if(!mk || typeof mk!=='object') return;
      const kp = key.split('#'); if(!secs[kp[0]]) return;
      const r  = REASONS[mk.r] ? mk.r : '';
      const t  = mk.t ? String(mk.t).slice(0,240) : '';
      if(!r && !t && !mk.redo) return;
      marks[key] = { r:r, t:t, redo: mk.redo?1:0 };
    });
    return { id: p.id || ('p'+Date.now()+'_'+i), subj:p.subj, year:yr, round: Math.max(1, Math.round(Number(p.round)||1)),
             secs:secs, marks:marks,
             updated: String(p.updated||'').slice(0,10) || todayStr(), seed: !!p.seed };
  }).filter(function(p){
    if(!p) return false;
    const k = p.subj+'@'+p.year+'@'+p.round;
    if(seen[k]) return false;          /* 同一科同一年同一轮只留一份 */
    seen[k] = 1; return true;
  });
  return b;
}

/* ---------- 查询与计算 ---------- */
function catChecked(c, date){ return !!(c.checkins && c.checkins[date]); }
function todayChecked(c){ return catChecked(c, todayStr()); }

/* 连续天数：每周（周一起）允许 1 个休息日；本周第 1 次漏不断，第 2 次才断 */
function catStreak(c){
  const T = todayStr();
  let cur = catChecked(c,T) ? T : dAdd(T,-1);
  const stop = c.createdDate || dAdd(T,-400);
  const used = {};
  let n = 0, rest = [], guard = 0;
  while(guard++ < 500){
    if(dDiff(stop, cur) < 0) break;
    if(catChecked(c,cur)){ n++; }
    else {
      const wk = mondayOf(cur);
      if(!used[wk]){ used[wk] = cur; rest.push(cur); }
      else break;
    }
    cur = dAdd(cur,-1);
  }
  return { n:n, rest:rest };
}

/* 昨日漏打卡状态：'rest'(休息日吸收) | 'broken'(已滚入今日) | null */
function missedYesterday(c){
  const T = todayStr();
  const y = dAdd(T,-1);
  if(catChecked(c,y)) return null;
  if(dDiff(c.createdDate||y, y) < 0) return null;       // 分类昨天还没建
  const wk = mondayOf(y);
  const from = (dDiff(c.createdDate||wk, wk) < 0) ? (c.createdDate||wk) : wk;
  let missed = 0, d = from;
  let guard = 0;
  while(dDiff(d, y) >= 0 && guard++ < 20){
    if(!catChecked(c,d)) missed++;
    d = dAdd(d,1);
  }
  return missed <= 1 ? 'rest' : 'broken';
}

/* 周打卡率：本周一~周日，已打卡天数 / 7 */
function catWeekRate(c, mon){
  let n = 0;
  for(let i=0;i<7;i++){ if(catChecked(c, dAdd(mon,i))) n++; }
  return { days:n, rate:n/7 };
}
/* 月打卡率 */
function catMonthRate(c, ym){
  const y = +ym.slice(0,4), m = +ym.slice(5,7);
  const days = new Date(y, m, 0).getDate();
  let n = 0;
  for(let i=1;i<=days;i++){ const d = y+'-'+pad(m)+'-'+pad(i); if(catChecked(c,d)) n++; }
  return { days:n, total:days, rate:days? n/days : 0 };
}

/* 星期几在「周一起」的那一周里的偏移：wd 用 JS getDay 约定（0=周日..6=周六） */
function wdOff(wd){ return (wd+6)%7; }

/* 子计划出现日期 */
function planOcc(p){
  const out = [];
  if(p.mode==='today'){
    out.push(p.from || todayStr());
  } else if(p.mode==='tomorrow'){
    out.push(dAdd(p.from || todayStr(), 1));
  } else if(p.mode==='weekly'){
    const mon = mondayOf(p.from);
    for(let w=0; w<p.count; w++){
      p.wdays.forEach(function(wd){
        const d = dAdd(mon, w*7 + wdOff(wd));
        if(dDiff(p.from, d) >= 0) out.push(d);
      });
    }
  } else {
    for(let i=0;i<p.count;i++) out.push(dAdd(p.from, i));
  }
  out.sort();
  return out;
}
function planDoneToday(p){ return !!(p.done && p.done[todayStr()]); }
function planOccursOn(p, date){ return planOcc(p).indexOf(date) >= 0; }

/* 某分类今天的子计划是否全部完成 */
function allPlansDoneToday(c){
  const T = todayStr();
  const todays = (c.plans||[]).filter(function(p){ return planOccursOn(p, T); });
  if(!todays.length) return null; /* 没有子计划，不自动联动 */
  return todays.every(function(p){ return planDoneToday(p); });
}
/* 将某分类今天的所有子计划标记为 done/undone */
function setAllPlansToday(c, done){
  const T = todayStr();
  (c.plans||[]).forEach(function(p){
    if(planOccursOn(p, T)){
      p.done = p.done || {};
      if(done) p.done[T] = true; else delete p.done[T];
    }
  });
}

/* 分类排序：未今日打卡的在前，再按连续天数倒序 */
function sortedCats(){
  const T = todayStr();
  const arr = S.cats.slice();
  arr.sort(function(a,b){
    const ca = catChecked(a,T)?1:0, cb = catChecked(b,T)?1:0;
    if(ca!==cb) return ca-cb;
    return catStreak(b).n - catStreak(a).n;
  });
  return arr;
}

/* 周聚合：每天几个分类打了卡 */
function weekCheckins(mon){
  const days = []; for(let i=0;i<7;i++) days.push(dAdd(mon,i));
  const perDay = days.map(function(d){
    let n = 0; S.cats.forEach(function(c){ if(catChecked(c,d)) n++; }); return n;
  });
  let total = 0; perDay.forEach(function(x){ total += x; });
  return { days:days, perDay:perDay, total:total, cats:S.cats.length };
}
/* 月聚合 */
function monthCheckins(ym){
  const y = +ym.slice(0,4), m = +ym.slice(5,7);
  const days = new Date(y, m, 0).getDate();
  const perDay = []; let total = 0;
  for(let i=1;i<=days;i++){
    const d = y+'-'+pad(m)+'-'+pad(i);
    let n = 0; S.cats.forEach(function(c){ if(catChecked(c,d)) n++; });
    perDay.push(n); total += n;
  }
  return { year:y, month:m, days:days, perDay:perDay, total:total, cats:S.cats.length };
}

function ringSVG(pct, color, size){
  const s = size||88, r = (s/2)-7, cx = s/2, C = 2*Math.PI*r;
  const off = C * (1 - Math.min(1,pct/100));
  const gid = 'rg'+Math.random().toString(36).slice(2,7);
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 '+s+' '+s+'">' +
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0%" stop-color="'+color.m+'"/><stop offset="100%" stop-color="'+color.m+'" stop-opacity=".62"/></linearGradient></defs>' +
    '<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="#eef0f9" stroke-width="8"/>' +
    '<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="url(#'+gid+')" stroke-width="8" stroke-linecap="round" ' +
    'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+cx+' '+cx+')"/>' +
    '</svg>';
}

        '</div>'+
      '</div>';
  });
  h += '</div>';
  body.innerHTML = h;
  /* bind date change */
  var picker = el('vbDatePick');
  if(picker){
    picker.value = dateStr;
    picker.onchange = function(){ renderVbWords(this.value); };
  }
  /* bind left-swipe on word items */
  Array.prototype.forEach.call(body.querySelectorAll('.vb-item'), function(item){
    var sx=0, sy=0, moved=false, swiped=item.classList.contains('swiped');
    var eh = el('vbExitHint');
    item.addEventListener('touchstart', function(e){
      sx=e.touches[0].clientX; sy=e.touches[0].clientY; moved=false;
      if(swiped && !e.target.closest('.vb-actions')){ item.classList.remove('swiped'); swiped=false; if(eh) eh.style.display='none'; }
    }, {passive:true});
    item.addEventListener('touchmove', function(e){
      if(!moved){
        var dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
        if(Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>30){ moved=true; e.preventDefault(); }
      }
    }, {passive:false});
    item.addEventListener('touchend', function(e){
      if(!moved) return;
      var ex = e.changedTouches[0].clientX - sx;
      if(swiped){
        if(ex > 50){ item.classList.remove('swiped'); swiped=false; if(eh) eh.style.display='none'; }   /* 右滑退出 */
      } else if(ex < -60){
        item.classList.add('swiped'); swiped=true; if(eh) eh.style.display='flex';                      /* 左滑展开 */
      }
    });
  });
}

let BSUBJ = null;
function paperMatrix(){
  const have = subjHave();
  const pset = {}; S.papers.forEach(function(p){ pset[p.subj+'@'+p.year]=1; });
  let h = '<div class="sec"><div class="sec-hd">'+ic('grid',16)+'<h2>真题正确率</h2>' +
          (have.length?'<span class="cnt">'+Object.keys(pset).length+' 套</span>':'')+'</div>';
  if(!have.length){
    return h + '<div class="card empty">'+ic('paper',30,1.7)+'<b>还没有真题数据</b>' +
      '<span>去「真题」页记一份，这里会按年份和题型排成一张正确率表。</span></div></div>';
  }
  if(!BSUBJ || have.indexOf(BSUBJ)<0) BSUBJ = have[0];
  if(have.length>1){
    h += '<div class="seg" style="margin-bottom:10px">' + have.map(function(k){
      return '<button class="'+(BSUBJ===k?'on':'')+'" data-act="bsubj" data-k="'+k+'">'+PAPERS[k].n+'</button>';
    }).join('') + '</div>';
  }
  const def = PAPERS[BSUBJ];
  /* 每组（科目@年份）只取最新一轮，避免同卷多刷重复成多行 */
  const byKey = {};
  S.papers.forEach(function(p){
    if(p.subj!==BSUBJ) return;
    const k = p.subj+'@'+p.year, cur = byKey[k];
    if(!cur || (p.round||1) > (cur.round||1)) byKey[k] = p;
  });
  const rows = Object.keys(byKey).map(function(k){ return byKey[k]; })
                       .sort(function(a,b){ return b.year-a.year; });
  const cell = function(a, sub){
    const c = accColor(a);
    if(a===null) return '<div class="cel" style="background:var(--bg2);color:var(--faint)">—</div>';
    return '<div class="cel" style="background:'+c.b+';color:'+c.f+'">'+Math.round(a*100)+'%' +
           (sub?'<small>'+sub+'</small>':'')+'</div>';
  };
  h += '<div class="card" style="padding:11px 12px"><div class="pmat-wrap"><table class="pmat"><thead><tr>' +
       '<th class="yh">年份</th>' +
       def.secs.map(function(d){ return '<th>'+esc(d.s)+'</th>'; }).join('') +
       '<th>全卷</th></tr></thead><tbody>';
  const sums = {}; def.secs.forEach(function(d){ sums[d.k] = []; });
  const wholes = [];
  rows.forEach(function(p){
    h += '<tr><td class="yl">'+p.year+'</td>';
    secsOf(BSUBJ, p.year).forEach(function(d){
      const v = p.secs[d.k];
      if(!v){ h += '<td>'+cell(null)+'</td>'; return; }
      const dy = secDef(BSUBJ, d.k, p.year) || d;
      const a = secAcc(BSUBJ, d.k, v, p.year);
      sums[d.k].push(a);
      const sub = d.mode==='sub' ? (nfm(v.score)+'/'+dy.pt)
                : d.mode==='subq' ? (nfm(subqSum(v.scores,dy.maxPer))+'/'+dy.pt)
                : ((v.total-v.wrong.length)+'/'+v.total);
      h += '<td>'+cell(a, sub)+'</td>';
    });
    const sc = paperScore(p);
    if(sc.rate!==null) wholes.push(sc.rate);
    h += '<td>'+cell(sc.rate, nfm(sc.got)+'/'+sc.full)+'</td></tr>';
  });
  const avg = function(arr){ return arr.length ? arr.reduce(function(a,b){return a+b;},0)/arr.length : null; };
  if(rows.length>1){
    h += '<tr class="avg"><td class="yl">均值</td>' +
      def.secs.map(function(d){ return '<td>'+cell(avg(sums[d.k]), sums[d.k].length?sums[d.k].length+' 年':'')+'</td>'; }).join('') +
      '<td>'+cell(avg(wholes))+'</td></tr>';
  }
  h += '</tbody></table></div>';

  /* 洞察：最弱题型 + 错因分布 */
  let weak = null;
  def.secs.forEach(function(d){
    const a = avg(sums[d.k]); if(a===null) return;
    if(!weak || a < weak.a) weak = { d:d, a:a, n:sums[d.k].length };
  });
  const rc = {}; let mkTotal = 0;
  rows.forEach(function(p){
    Object.keys(p.marks).forEach(function(key){
      const r = p.marks[key].r; if(!r) return;
      rc[r] = (rc[r]||0)+1; mkTotal++;
    });
  });
  const rlist = RS_ORDER.filter(function(r){ return rc[r]; })
    .sort(function(a,b){ return rc[b]-rc[a]; })
    .map(function(r){ return REASONS[r]+' '+rc[r]; });
  h += '<div style="border-top:1px solid var(--line2);margin-top:10px;padding-top:10px;font-size:12px;color:var(--ink2);line-height:1.75">';
  if(weak){
    h += '<div style="display:flex;gap:6px;align-items:flex-start">'+ic('target',13,2.2) +
      '<span>最该补的是 <b style="color:'+accColor(weak.a).f+'">'+esc(weak.d.n)+'</b>，' +
      (rows.length>1 ? weak.n+' 份卷平均 ' : '') + '<b>'+Math.round(weak.a*100)+'%</b>。</span></div>';
  }
  h += '<div style="display:flex;gap:6px;align-items:flex-start;margin-top:3px">'+ic('tag',13,2.2) +
    '<span>'+(mkTotal ? '标过原因的 '+mkTotal+' 道题里：'+rlist.join(' · ')
                      : '还没给错题标原因 —— 标上以后，这里会告诉你到底是不会，还是马虎。')+'</span></div>';
  h += '</div></div></div>';
  return h;
}

/* (近14天打卡趋势板块已移除) */
function niceTick(max){
  const raw = max/4;
  const p = Math.pow(10, Math.floor(Math.log(raw)/Math.LN10));
  const n = raw/p;
  const m = n<=1?1:(n<=2?2:(n<=5?5:10));
  return Math.max(1, m*p);
}

function paperCard(p, first){
  const def = PAPERS[p.subj], sc = paperScore(p);
  const col = accColor(sc.rate);
  const sdefs = secsOf(p.subj, p.year);          /* 年份感知：2020 前/后题型不同 */
  const undone = sdefs.length - sc.recorded;
  let h = '<div class="pcard"><div class="ph">' +
    '<span class="pyr">'+p.year+'</span><span class="psb">'+def.s+'</span>' +
    '<span class="accp '+accCls(sc.rate)+'">'+(sc.rate===null?'—':Math.round(sc.rate*100)+'%')+'</span>' +
    (p.round>1 ? '<span class="rt-badge r'+Math.min(p.round,4)+'">'+roundLabel(p.round)+'</span>' : '') +
    '<span style="flex:1"></span>' +
    '<button class="iconbtn" data-act="edit-paper" data-id="'+p.id+'" aria-label="编辑">'+ic('pen',15)+'</button>' +
    '<button class="iconbtn" data-act="del-paper" data-id="'+p.id+'" aria-label="删除">'+ic('trash',15)+'</button>' +
    '</div><div class="pb">';

  h += '<div style="font-size:12px;color:var(--muted);margin-bottom:7px;line-height:1.6">' +
    '估分 <b style="color:'+col.f+'">'+nfm(sc.got)+'</b> / '+sc.full+' 分' +
    (sc.full<sc.total ? '<span style="color:var(--faint)">（全卷 '+sc.total+' 分，还有 '+undone+' 个题型没记）</span>' : '') +
    ' · 错 '+sc.wrong+' 题</div>';

  sdefs.forEach(function(d0){
    const v = p.secs[d0.k]; if(!v) return;
    const d = secDef(p.subj, d0.k, p.year) || d0;
    const a = secAcc(p.subj, d0.k, v, p.year), c = accColor(a);
    let right;
    if(d.mode==='sub')       right = nfm(v.score)+'/'+d.pt+' 分';
    else if(d.mode==='subq') right = (Array.isArray(v.scores) && v.scores.length)
                                     ? (nfm(subqSum(v.scores, d.maxPer))+'/'+d.pt+' 分')
                                     : ((v.total-(v.wrong||[]).length)+'/'+v.total+' 题');
    else                     right = (v.total-v.wrong.length)+'/'+v.total+' 题';
    h += '<div class="pbar"><span class="pn">'+esc(d.n)+'</span>' +
      '<span class="pt"><i style="width:'+(a*100).toFixed(1)+'%;background:'+c.f+'"></i></span>' +
      '<span class="pv" style="color:'+c.f+'">'+Math.round(a*100)+'% <span style="color:var(--faint);font-weight:600">'+right+'</span></span></div>';
  });

  const chips = [];
  sdefs.forEach(function(d0){
    const v = p.secs[d0.k]; if(!v) return;
    const d = secDef(p.subj, d0.k, p.year) || d0;
    if(d.mode==='sub'){
      const key = d.k+'#0', m = p.marks[key];
      const has = m && (m.r||m.t);
      chips.push('<button class="wchip '+(m&&m.redo?'done':(m&&m.r?'r-'+m.r:''))+'" data-act="mark" data-id="'+p.id+'" data-key="'+key+'">' +
        esc(d.s)+(has ? (m.r?' <em>'+REASONS[m.r]+'</em>':' <em>已备注</em>') : ' <em>加备注</em>')+'</button>');
      return;
    }
    /* 解答题（subq）：列出「没拿到分」的题号；旧格式回落到 wrong 列表 */
    let nos;
    if(d.mode==='subq'){
      nos = [];
      if(Array.isArray(v.scores) && v.scores.length){
        v.scores.forEach(function(x,i){ if(!(Number(x)>0)) nos.push((d.from||0)+i); });
      } else if(Array.isArray(v.wrong)){ nos = v.wrong.slice(); }
    } else {
      nos = Array.isArray(v.wrong) ? v.wrong : [];
    }
    nos.forEach(function(no){
      const key = d.k+'#'+no, m = p.marks[key] || {r:'',t:'',redo:0};
      chips.push('<button class="wchip '+(m.redo?'done':(m.r?'r-'+m.r:''))+'" data-act="mark" data-id="'+p.id+'" data-key="'+key+'">' +
        esc(d.s)+' '+no+(m.r?' <em>'+REASONS[m.r]+'</em>':'')+'</button>');
    });
  });
  if(chips.length){
    const marked = chips.filter(function(x){ return x.indexOf('<em>')>0 && x.indexOf('加备注')<0; }).length;
    h += '<div style="font-size:11.5px;color:var(--faint);margin-top:10px;display:flex;align-items:center;gap:5px">' +
      ic('tag',12,2.2)+'点一下错题，写清为什么错（已标 '+marked+'/'+chips.length+'）</div>';
    h += '<div class="wchips">'+chips.join('')+'</div>';
  }
  if(first && p.round>1 && first.id!==p.id){
    const d = roundWrongDiff(p, first);
    h += (d.conquered||d.newly)
      ? '<div class="rt-cmp">'+ic('history',12,2.2)+'对比一刷：<b class="ok">攻克 '+d.conquered+' 题</b>' +
        (d.newly ? ' · <b class="no">新错 '+d.newly+' 题</b>' : ' · <b class="ok">无新错</b>') + '</div>'
      : '<div class="rt-cmp">'+ic('history',12,2.2)+'对比一刷：<b class="ok">本轮错题与一刷完全一致</b></div>';
  }
  h += '<div style="font-size:11px;color:var(--faint);margin-top:9px">更新于 '+md(p.updated)+'</div>';
  return h + '</div></div>';
}

function paperGroupHeader(g){
  const p0 = g[0], def = PAPERS[p0.subj];
  const scArr = g.map(function(p){ return { p:p, sc:paperScore(p) }; });
  const strip = scArr.map(function(o, i){
    const prev = i>0 ? scArr[i-1].sc.rate : null;
    let arrow = '';
    if(i>0 && o.sc.rate!==null && prev!==null){
      arrow = o.sc.rate > prev ? ' ▲' : (o.sc.rate < prev ? ' ▼' : '');
    }
    return '<span class="rt-pill '+accCls(o.sc.rate)+'">'+roundLabel(o.p.round)+' '+Math.round((o.sc.rate||0)*100)+'%'+arrow+'</span>';
  }).join('<span class="rt-arrow">→</span>');
  const first = scArr[0].sc.rate, last = scArr[scArr.length-1].sc.rate;
  let delta = '';
  if(scArr.length>1 && first!==null && last!==null){
    const dv = Math.round((last-first)*100);
    delta = '<span class="rt-delta '+(dv>=0?'up':'down')+'">'+(dv>=0?'+':'')+dv+'% vs 一刷</span>';
  }
  return '<div class="pgroup-hd"><div class="pgh-main">' +
    '<span class="pyr">'+p0.year+'</span><span class="psb">'+def.s+'</span>' +
    '<span class="rt-strip">'+strip+'</span>'+delta+'</div>' +
    '<button class="btn btn-ghost btn-xs" data-act="add-round" data-id="'+g[g.length-1].id+'">'+ic('plus',13)+'加一轮</button></div>';
}
