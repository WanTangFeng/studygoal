<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c4956a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="目标台">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-512.png">
<title>学习目标管理台</title>
<style>
/* ============ 基础 ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f7fc; --bg2:#eef1fa; --card:#ffffff;
  --ink:#191b2e; --ink2:#3b3f5c; --muted:#71769a; --faint:#9ba0bf;
  --line:#e6e9f5; --line2:#eef0f9;
  --purple:#7355f7; --purple2:#a855f7; --purple-soft:#f2efff; --purple-line:#ded5ff;
  --green:#0f9d58; --green-soft:#e7f7ee; --green-line:#bfe8d1;
  --red:#e04350; --red-soft:#fdecee; --red-line:#f7ccd1;
  --amber:#d9880a; --amber-soft:#fff5e2; --amber-line:#f6e0b3;
  --grad:linear-gradient(135deg,#6d5efc 0%,#a855f7 100%);
  --grad-soft:linear-gradient(135deg,#f4f1ff 0%,#fbf3ff 100%);
  --r:16px; --r-sm:11px; --r-lg:20px;
  --sh:0 1px 2px rgba(25,27,46,.04), 0 10px 26px rgba(25,27,46,.055);
  --sh-sm:0 1px 2px rgba(25,27,46,.05), 0 4px 12px rgba(25,27,46,.05);
}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  background-image:radial-gradient(1100px 520px at 12% -8%, #efeaff 0%, rgba(239,234,255,0) 62%),
                   radial-gradient(900px 460px at 96% 2%, #e7f0ff 0%, rgba(231,240,255,0) 58%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
svg{display:block}
.hide{display:none !important}
.nowrap{white-space:nowrap}

/* ============ 布局骨架 ============ */
.app{min-height:100vh}
.sidebar{display:none}
.app-body{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(245,247,252,.86);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding:9px 15px;display:flex;align-items:center;gap:10px;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{width:31px;height:31px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 4px 12px rgba(115,85,247,.32)}
.brand-txt{font-weight:750;font-size:15.5px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11.5px;color:var(--muted);font-weight:500}
.topnav{display:none}
main{flex:1;padding:14px 15px calc(88px + env(safe-area-inset-bottom)) 15px;max-width:1180px;width:100%;margin:0 auto}

.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(255,255,255,.95);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}
.bottomnav button{
  min-height:56px;padding:7px 1px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--faint);font-size:10.5px;font-weight:600;position:relative;
}
.bottomnav button.on{color:var(--purple)}
.bottomnav button.on .nv-ic{background:var(--purple-soft)}
.nv-ic{width:34px;height:24px;border-radius:9px;display:grid;place-items:center;transition:background .18s}
.nv-dot{position:absolute;top:6px;right:calc(50% - 16px);min-width:16px;height:16px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1}

/* ============ 通用组件 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm)}
.sec{margin-bottom:16px}
.sec-hd{display:flex;align-items:center;gap:8px;margin:0 2px 9px}
.sec-hd h2{font-size:14px;font-weight:750;letter-spacing:.3px}
.sec-hd .cnt{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--bg2);border-radius:20px;padding:1px 8px}
.sec-hd .sp{flex:1}
.sec-hd .lnk{font-size:12.5px;color:var(--purple);font-weight:650}
.sec-body{overflow:hidden}
.sec.collapsed > .sec-body{display:none}
.coll-btn{border:none;background:transparent;color:var(--muted);padding:3px;margin:-3px -2px -3px 0;cursor:pointer;display:flex;align-items:center;border-radius:8px;transition:transform .2s,color .2s,background .15s}
.coll-btn:active{background:var(--bg2)}
.sec.collapsed .coll-btn{transform:rotate(-90deg);color:var(--purple)}
.vb-exit-hint{display:none;align-items:center;justify-content:center;gap:5px;margin:10px 8px 2px;padding:9px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--bg2);border-radius:10px}
.vb-exit-hint svg{color:var(--purple)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:650;font-size:14.5px;background:var(--card);border:1px solid var(--line);color:var(--ink2);transition:transform .12s, box-shadow .18s, background .18s}
.btn:active{transform:scale(.975)}
.btn-pri{background:var(--grad);color:#fff;border:none;box-shadow:0 6px 18px rgba(115,85,247,.3)}
.btn-ghost{background:var(--bg2);border-color:transparent}
.btn-danger{background:var(--red-soft);color:var(--red);border-color:var(--red-line)}
.btn-sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:10px}
.btn-xs{min-height:30px;padding:0 9px;font-size:12.5px;border-radius:9px;gap:4px}
.btn-block{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:var(--bg2)}
.iconbtn:active{transform:scale(.94)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:20px;background:var(--bg2);color:var(--muted)}
.chip-mk{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line)}

.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.empty svg{margin:0 auto 10px;color:var(--faint)}
.empty b{display:block;color:var(--ink2);font-size:14px;margin-bottom:3px}
.empty span{font-size:12.5px}

/* ============ 备份横幅 ============ */
.banner{
  display:flex;align-items:center;gap:11px;padding:12px 13px;margin-bottom:14px;border-radius:var(--r);
  background:linear-gradient(135deg,#f4f0ff,#fdf2ff);border:1px solid var(--purple-line);
}
.banner .bi{width:34px;height:34px;border-radius:11px;background:#fff;display:grid;place-items:center;color:var(--purple);flex:none;box-shadow:var(--sh-sm)}
.banner .bt{flex:1;min-width:0}
.banner .bt b{display:block;font-size:13.5px;font-weight:700}
.banner .bt span{font-size:12px;color:var(--muted)}

/* ============ 今天要处理 ============ */
.alert{border-radius:var(--r);padding:13px 13px 12px;margin-bottom:10px;border:1px solid;position:relative;overflow:hidden}
.alert-red{background:var(--red-soft);border-color:var(--red-line)}
.alert-amber{background:var(--amber-soft);border-color:var(--amber-line)}
.alert-green{background:var(--green-soft);border-color:var(--green-line)}
.alert-hd{display:flex;align-items:flex-start;gap:9px}
.alert-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:#fff}
.alert-red .alert-ic{color:var(--red)} .alert-amber .alert-ic{color:var(--amber)} .alert-green .alert-ic{color:var(--green)}
.alert-tt{font-size:14px;font-weight:750;line-height:1.35}
.alert-red .alert-tt{color:#b4232f} .alert-amber .alert-tt{color:#9a6208} .alert-green .alert-tt{color:#0b7c45}
.alert-ds{font-size:12.5px;color:var(--ink2);margin-top:2px;line-height:1.5}
.alert-act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.alert-act .btn{flex:1;min-width:110px}
.days-badge{display:inline-flex;align-items:center;gap:3px;background:var(--red);color:#fff;font-size:11.5px;font-weight:750;border-radius:7px;padding:1px 7px;margin-left:5px;vertical-align:1px}

/* ============ 目标卡 ============ */
.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);overflow:hidden;margin-bottom:12px}
.gcard.pin{box-shadow:0 0 0 2px var(--purple-line), var(--sh)}
.gtop{height:4px;width:100%}
.gpad{padding:13px 14px 14px}
.ghd{display:flex;align-items:flex-start;gap:9px}
.ghd .gnm{flex:1;min-width:0}
.gnm h3{font-size:16px;font-weight:750;line-height:1.3;word-break:break-word}
.gmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.gtag{font-size:11px;font-weight:650;padding:1.5px 7px;border-radius:6px}
.gact{display:flex;gap:5px;flex:none}

.pbar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden;margin:11px 0 7px}
.pbar i{display:block;height:100%;border-radius:6px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.pline{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--muted)}
.pline b{font-size:17px;font-weight:780;color:var(--ink);letter-spacing:-.2px}
.pline .pc{margin-left:auto;font-weight:750;font-size:13px}

.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line2);border-radius:12px;overflow:hidden;margin-top:11px}
.stat3 div{background:#fbfcff;padding:9px 6px;text-align:center}
.stat3 .sl{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:1px}
.stat3 .sv{font-size:14.5px;font-weight:750;letter-spacing:-.2px;line-height:1.3}
.sv.ok{color:var(--green)} .sv.bad{color:var(--red)} .sv.warn{color:var(--amber)} .sv.na{color:var(--faint);font-size:12.5px;font-weight:650}

.plan{margin-top:11px;border-radius:12px;background:var(--purple-soft);border:1px solid var(--purple-line);padding:9px 11px}
.plan .pk{font-size:10.5px;font-weight:750;color:var(--purple);letter-spacing:1px;margin-bottom:3px;display:flex;align-items:center;gap:4px}
.plan .pr{font-size:12.5px;line-height:1.55;color:var(--ink2)}
.plan .pr b{color:var(--ink);font-weight:700}
.plan.none{background:var(--bg2);border-color:transparent}
.plan.none .pk{color:var(--muted)}
.plan.none .pr{color:var(--faint)}

/* 快捷打卡条 */
.qk{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px}
.qk-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.stp{display:flex;align-items:center;background:var(--bg2);border-radius:12px;overflow:hidden;flex:none;border:1px solid transparent}
.stp:focus-within{border-color:var(--purple-line);background:#fff}
.stp button{width:36px;height:44px;display:grid;place-items:center;color:var(--muted);font-size:19px;font-weight:600}
.stp input{width:56px;height:44px;border:none;background:transparent;text-align:center;font-weight:750;font-size:16px;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.minin{display:flex;align-items:center;gap:5px;background:var(--bg2);border-radius:12px;padding:0 10px;height:44px;flex:1;min-width:112px;border:1px solid transparent}
.minin:focus-within{border-color:var(--purple-line);background:#fff}
.minin input{width:100%;border:none;background:transparent;height:42px;font-size:16px;font-weight:650}
.minin input::-webkit-outer-spin-button,.minin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.minin span{font-size:12.5px;color:var(--muted);flex:none;font-weight:600}
.qk-hint{font-size:11.5px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.qk-hint .dn{color:var(--green);font-weight:700}

/* ============ 看板 ============ */
.ringwrap{display:flex;gap:13px;align-items:center}
.ring{flex:none;position:relative;width:88px;height:88px}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rt b{font-size:18px;font-weight:790;letter-spacing:-.5px;line-height:1}
.ring .rt span{font-size:10px;color:var(--muted);font-weight:600}
.recs{margin-top:12px;border-top:1px solid var(--line2);padding-top:9px}
.rec{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line2);font-size:13px}
.rec:last-child{border-bottom:none}
.rec .rd{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;width:52px}
.rec .ra{font-weight:700;flex:none}
.rec .rm{font-size:11.5px;color:var(--muted);flex:1;min-width:0}
.rec .rx{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--faint);flex:none}
.rec .rx:active{background:var(--red-soft);color:var(--red)}
.chartbox{padding:14px}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:0}
.legend span{font-size:11.5px;color:var(--muted);font-weight:600}

/* ============ 周报 ============ */
.wkhd{display:flex;align-items:center;gap:8px;padding:11px 12px;margin-bottom:13px}
.wkhd .wt{flex:1;text-align:center}
.wkhd .wt b{display:block;font-size:14.5px;font-weight:750}
.wkhd .wt span{font-size:11.5px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.kpi{padding:12px 13px}
.kpi .kl{font-size:11.5px;color:var(--muted);font-weight:650}
.kpi .kv{font-size:24px;font-weight:790;letter-spacing:-.8px;margin-top:1px;line-height:1.15}
.kpi .kv small{font-size:12px;font-weight:650;color:var(--muted);letter-spacing:0;margin-left:2px}
.delta{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 6px;margin-top:5px}
.delta.up{background:var(--green-soft);color:var(--green)}
.delta.down{background:var(--red-soft);color:var(--red)}
.delta.flat{background:var(--bg2);color:var(--muted)}
.wrow{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px dashed var(--line2)}
.wrow:last-child{border-bottom:none}
.wrow .wd{width:8px;height:8px;border-radius:3px;flex:none}
.wrow .wn{flex:1;min-width:0;font-size:13.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .wv{font-size:13.5px;font-weight:750;flex:none}
.four label{display:block;font-size:12px;font-weight:750;color:var(--ink2);margin:0 0 5px 2px;display:flex;align-items:center;gap:5px}
.four .fitem{margin-bottom:11px}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 11px;resize:vertical;min-height:70px;background:#fbfcff;line-height:1.55;font-size:15px}
textarea:focus{outline:none;border-color:var(--purple-line);background:#fff;box-shadow:0 0 0 3px rgba(115,85,247,.09)}
.savedtip{font-size:11px;color:var(--green);font-weight:700;opacity:0;transition:opacity .2s}
.savedtip.on{opacity:1}
.report{white-space:pre-wrap;font-size:13px;line-height:1.7;background:#fbfcff;border:1px solid var(--line);border-radius:12px;padding:12px;font-variant-numeric:tabular-nums;max-height:340px;overflow:auto}

/* ============ 我的 ============ */
.mrow{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.mrow:last-child{border-bottom:none}
.mrow .mi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--purple-soft);color:var(--purple)}
.mrow .mt{flex:1;min-width:0}
.mrow .mt b{display:block;font-size:14px;font-weight:700}
.mrow .mt span{font-size:12px;color:var(--muted);line-height:1.45;display:block}
.mrow.danger .mi{background:var(--red-soft);color:var(--red)}
.mrow.danger .mt b{color:var(--red)}
.steps{counter-reset:s}
.step{display:flex;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line2)}
.step:last-child{border-bottom:none}
.step .sn{width:24px;height:24px;border-radius:8px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:750;flex:none}
.step .sd{font-size:13px;line-height:1.6;color:var(--ink2)}
.step .sd b{color:var(--ink)}
.dangerzone{border:1px solid var(--red-line);background:var(--red-soft);border-radius:var(--r);padding:13px}
.dangerzone input{width:100%;height:44px;border:1px solid var(--red-line);border-radius:11px;padding:0 12px;background:#fff;margin:9px 0}
.dangerzone input:focus{outline:none;box-shadow:0 0 0 3px rgba(224,67,80,.12)}

/* ============ 弹窗 ============ */
.mask{position:fixed;inset:0;z-index:100;background:rgba(20,22,40,.42);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;padding:0;opacity:0;pointer-events:none;transition:opacity .2s}
.mask.on{opacity:1;pointer-events:auto}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(22px);transition:transform .24s cubic-bezier(.22,1,.36,1)}
.mask.on .modal{transform:none}
.mhd{padding:15px 16px 11px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:9px;flex:none}
.mhd h3{font-size:16px;font-weight:750;flex:1}
.mbd{padding:15px 16px;overflow:auto;flex:1}
.mft{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line2);display:flex;gap:9px;flex:none}
.mft .btn{flex:1}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.fld label em{font-style:normal;color:var(--faint);font-weight:600}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld select{
  width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fbfcff;
}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--purple-line);background:#fff;box-shadow:0 0 0 3px rgba(115,85,247,.09)}
.fld .hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:13px;border:3px solid transparent;position:relative;display:grid;place-items:center}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 3px #fff inset}
.sw i{width:100%;height:100%;border-radius:9px;display:block}
.units{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.unit-p{font-size:12.5px;font-weight:650;padding:5px 11px;border-radius:9px;background:var(--bg2);color:var(--ink2)}
.unit-p.on{background:var(--purple);color:#fff}
.dsel{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch}
.dsel button{flex:none;min-width:60px;padding:7px 8px;border-radius:11px;background:var(--bg2);text-align:center}
.dsel button.on{background:var(--purple);color:#fff}
.dsel button b{display:block;font-size:13px;font-weight:750}
.dsel button span{display:block;font-size:10.5px;opacity:.72}

/* ============ 子计划清单（今日） ============ */
.subplan{margin-top:11px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);padding:10px 11px}
.subplan .sp-hd{font-size:11px;font-weight:750;color:var(--muted);letter-spacing:.5px;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.spitem{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line2)}
.spitem:last-child{border-bottom:none}
.spitem input{width:18px;height:18px;flex:none;accent-color:var(--purple)}
.spitem .spt{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--ink2)}
.spitem .sps{font-size:11px;color:var(--faint);white-space:nowrap;font-weight:600}
.spitem.done .spt{text-decoration:line-through;color:var(--faint)}

/* ============ 看板·近7天点 ============ */
.wkdots{display:flex;gap:6px}
.wkdot{flex:1;min-height:30px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;position:relative}
.wkdot span{opacity:.85}
.wkdot:not(.on){color:var(--muted)}

/* ============ 星期多选（子计划） ============ */
.wdtoggle{display:flex;gap:6px;flex-wrap:wrap}
.wdb{flex:1;min-width:38px;min-height:42px;border-radius:11px;background:var(--bg2);color:var(--ink2);font-size:14px;font-weight:700;border:1px solid transparent}
.wdb.on{background:var(--grad);color:#fff;border-color:transparent}

/* ============ toast / 彩带 ============ */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,14px);z-index:200;background:rgba(25,27,46,.94);color:#fff;padding:10px 16px;border-radius:13px;font-size:13.5px;font-weight:650;opacity:0;transition:all .24s;pointer-events:none;max-width:88vw;text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.24)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;z-index:190;pointer-events:none;display:none}

/* ---------- 今日顶部双卡：考研倒计时 + 每日一句 ---------- */
.hero2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.hero{position:relative;aspect-ratio:1/1;border-radius:var(--r);padding:13px 13px 12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh-sm)}
.hero>*{position:relative;z-index:1}
.hero-tag{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:750;letter-spacing:.2px;white-space:nowrap}
.hero-mid{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:hidden}
.hero-ft{font-size:10.5px;font-weight:640;line-height:1.4;letter-spacing:.1px}

.hero-qt .qt-mark{position:absolute;right:10px;top:9px;color:var(--purple-line);z-index:0}
.hero-qt .qt-txt{font-weight:760;line-height:1.52;color:var(--ink);letter-spacing:-.2px}
.hero-qt .qt-rule{width:22px;height:3px;border-radius:2px;background:var(--grad);margin:0 0 8px}
.hero-qt .hero-ft{color:var(--faint)}
@media (max-width:359px){ .hero-cd .cd-num{font-size:42px} }
/* ============ 真题错题 ============ */
.seg{display:flex;gap:5px;background:var(--bg2);padding:4px;border-radius:13px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.seg button{flex:none;min-height:36px;padding:0 13px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--purple);box-shadow:var(--sh-sm)}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);overflow:hidden;margin-bottom:12px}
.pcard .ph{display:flex;align-items:center;gap:9px;padding:12px 13px 10px}
.pcard .ph .pyr{font-size:15.5px;font-weight:800;letter-spacing:-.2px}
.pcard .ph .psb{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--purple-soft);color:var(--purple)}
.pcard .pb{padding:0 13px 12px}
.accp{font-size:12px;font-weight:750;padding:2px 9px;border-radius:20px;white-space:nowrap}
.a-hi{background:var(--green-soft);color:var(--green)}
.a-md{background:var(--purple-soft);color:var(--purple)}
.a-lo{background:var(--amber-soft);color:var(--amber)}
.a-bad{background:var(--red-soft);color:var(--red)}
.a-na{background:var(--bg2);color:var(--faint)}
.pbar{display:flex;align-items:center;gap:8px;padding:5px 0}
.pbar .pn{font-size:12.5px;color:var(--ink2);font-weight:650;width:92px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar .pt{flex:1;height:8px;border-radius:5px;background:var(--bg2);overflow:hidden;min-width:40px}
.pbar .pt i{display:block;height:100%;border-radius:5px}
.pbar .pv{font-size:11.5px;font-weight:700;color:var(--muted);width:66px;flex:none;text-align:right}
.wchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wchip{display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:0 9px;border-radius:9px;font-size:12px;font-weight:680;
  background:var(--bg2);color:var(--ink2);border:1px solid transparent}
.wchip.r-unknown{background:var(--red-soft);color:var(--red);border-color:var(--red-line)}
.wchip.r-careless,.wchip.r-misread,.wchip.r-calc{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.wchip.r-time{background:var(--bg2);color:var(--muted)}
.wchip.done{background:var(--green-soft);color:var(--green);border-color:var(--green-line);text-decoration:line-through;opacity:.75}
.wchip em{font-style:normal;opacity:.72;font-weight:600}
.redo{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.redo:last-child{border-bottom:none}
.redo .rq{flex:none;min-width:38px;height:38px;padding:0 6px;border-radius:11px;display:grid;place-items:center;font-size:14px;font-weight:800;
  background:var(--red-soft);color:var(--red)}
.redo .rc{flex:1;min-width:0}
.redo .rc b{display:block;font-size:13px;font-weight:700;line-height:1.4}
.redo .rc span{display:block;font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:1px}
.prow{display:grid;grid-template-columns:1fr auto;gap:8px 9px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.prow:last-child{border-bottom:none}
.prow .pl{min-width:0}
.prow .pl b{display:block;font-size:13.5px;font-weight:700}
.prow .pl span{display:block;font-size:11px;color:var(--faint);margin-top:1px}
.prow .pr{display:flex;align-items:center;gap:6px}
.prow input[type=text],.prow input[type=number]{height:42px;border:1px solid var(--line);border-radius:11px;padding:0 10px;background:#fbfcff;font-size:16px}
.prow input:focus{outline:none;border-color:var(--purple-line);background:#fff;box-shadow:0 0 0 3px rgba(115,85,247,.09)}
.prow .in-w{width:100%;grid-column:1/-1}
.prow .in-s{width:64px;text-align:center}
.prow .po{grid-column:1/-1;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
.prow .pr .ptag{font-size:11.5px;color:var(--muted);font-weight:600}
.prow .qgrid{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1;margin-top:3px}
.qchip{min-width:40px;height:40px;padding:0 9px;border-radius:10px;border:1px solid var(--line);
  background:#fbfcff;color:var(--ink2);font-size:13.5px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;transition:.12s;-webkit-tap-highlight-color:transparent}
.qchip:hover{border-color:var(--muted)}
.qchip.on{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.pmat-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.pmat{border-collapse:separate;border-spacing:3px;font-size:12px;min-width:100%}
.pmat th{font-size:10.5px;font-weight:700;color:var(--muted);padding:2px 4px;text-align:center;white-space:nowrap;line-height:1.3}
.pmat th.yh{text-align:left;padding-left:2px}
.pmat td{text-align:center;padding:0}
.pmat .yl{font-size:12px;font-weight:750;color:var(--ink);text-align:left;padding-right:6px;white-space:nowrap}
.pmat .cel{min-width:52px;height:34px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:12px;font-weight:750;line-height:1.1}
.pmat .cel small{font-size:9.5px;font-weight:600;opacity:.75}
.pmat tr.avg .cel{border:1px dashed var(--line)}
.pmat tr.avg .yl{color:var(--muted);font-weight:700}
.reasons{display:flex;flex-wrap:wrap;gap:7px}
.rs{min-height:38px;padding:0 12px;border-radius:11px;background:var(--bg2);font-size:13px;font-weight:650;color:var(--ink2)}
.rs.on{background:var(--purple);color:#fff}

/* 真题多轮：分组头 / 趋势条 / 轮次角标 */
.pgroup{margin-bottom:14px}
.pgroup-hd{display:flex;align-items:center;gap:10px;padding:2px 4px 9px;flex-wrap:wrap}
.pgh-main{display:flex;align-items:center;gap:8px;flex:1;min-width:0;flex-wrap:wrap}
.pgh-main .pyr{font-size:16px;font-weight:800;letter-spacing:-.2px}
.pgh-main .psb{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--purple-soft);color:var(--purple)}
.rt-strip{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.rt-pill{font-size:11px;font-weight:750;padding:2px 8px;border-radius:20px;white-space:nowrap}
.rt-arrow{color:var(--faint);font-size:12px;font-weight:700}
.rt-delta{font-size:11px;font-weight:750;padding:2px 8px;border-radius:20px;white-space:nowrap}
.rt-delta.up{background:var(--green-soft);color:var(--green)}
.rt-delta.down{background:var(--red-soft);color:var(--red)}
.rt-badge{font-size:10.5px;font-weight:750;padding:2px 7px;border-radius:7px;white-space:nowrap;margin-left:2px}
.rt-badge.r1{background:var(--bg2);color:var(--muted)}
.rt-badge.r2{background:var(--amber-soft);color:var(--amber)}
.rt-badge.r3{background:var(--purple-soft);color:var(--purple)}
.rt-badge.r4{background:var(--green-soft);color:var(--green)}
.rt-cmp{font-size:11.5px;color:var(--ink2);margin:2px 0 9px;line-height:1.6;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.rt-cmp b{font-weight:750}
.rt-cmp .ok{color:var(--green);font-weight:750}
.rt-cmp .no{color:var(--red);font-weight:750}

/* ============ 平板 ≥768 ============ */
@media (min-width:768px){
  .hero2{gap:12px;margin-bottom:16px}
  .hero{aspect-ratio:auto;height:178px;padding:15px}
  .hero-cd .cd-num{font-size:56px}
  .hero-tag{font-size:12px}
  .hero-ft{font-size:11px}
  .bottomnav{display:none}
  main{padding:20px 26px 46px}
  .topbar{padding:11px 26px}
  .topnav{display:flex;gap:5px;margin-left:auto;background:var(--bg2);padding:4px;border-radius:14px}
  .topnav button{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:11px;font-size:13.5px;font-weight:700;color:var(--muted)}
  .topnav button.on{background:#fff;color:var(--purple);box-shadow:var(--sh-sm)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .grid2 .gcard{margin-bottom:0}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .four{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .alerts2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .alerts2 .alert{margin-bottom:0}
}
/* ============ 桌面 ≥1024 ============ */
@media (min-width:1024px){
  .sidebar{
    display:flex;position:fixed;left:0;top:0;bottom:0;width:240px;flex-direction:column;
    background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:20px 14px 16px;z-index:70;
  }
  .sidebar .brand{padding:0 8px 20px}
  .sidebar .brand-txt{font-size:16px}
  .sdnav{display:flex;flex-direction:column;gap:3px}
  .sdnav button{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;font-size:14px;font-weight:680;color:var(--ink2);position:relative;text-align:left}
  .sdnav button:hover{background:var(--bg2)}
  .sdnav button.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(115,85,247,.28)}
  .sdnav .nv-dot{position:static;margin-left:auto}
  .sdnav button.on .nv-dot{background:rgba(255,255,255,.28)}
  .sdfoot{margin-top:auto;padding:11px;border-radius:13px;background:var(--grad-soft);border:1px solid var(--purple-line)}
  .sdfoot b{display:block;font-size:12.5px;font-weight:750}
  .sdfoot span{font-size:11.5px;color:var(--muted);line-height:1.45;display:block;margin-top:2px}
  .app-body{margin-left:240px}
  .topbar{padding:13px 34px;background:transparent;border-bottom:none;position:static}
  .topbar .brand{display:none}
  .topnav{display:none}
  .pagehd{display:flex;align-items:baseline;gap:10px}
  .pagehd h1{font-size:24px;font-weight:790;letter-spacing:-.5px}
  .pagehd span{font-size:13px;color:var(--muted);font-weight:600}
  main{padding:0 34px 52px;max-width:1280px}
  .grid2{grid-template-columns:1fr 1fr;gap:14px}
  .hero2{gap:14px}

.vb-sec{padding:0 !important}.vb-sec .sec-hd{display:none}

.vb-count{padding:14px 18px 8px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.vb-list{padding:0 8px}

.vb-word-inner{padding:13px 14px 13px 18px;cursor:pointer;display:flex;align-items:center;gap:0;transition:background .15s}

.vb-btn{border:none;background:transparent;color:var(--danger,#e54d4d);font-size:13px;font-weight:600;padding:10px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px;transition:background .15s}

function paperFull(subj){
  let s=0; PAPERS[subj].secs.forEach(function(x){ s+=x.pt; }); return s;
}
function secDef(subj, k){
  const a = PAPERS[subj].secs.filter(function(x){return x.k===k;}); return a[0]||null;
}
function secAcc(subj, k, v){
  const d = secDef(subj,k); if(!d||!v) return null;
  if(d.mode==='sub'){ return d.pt>0 ? Math.max(0,Math.min(1, v.score/d.pt)) : null; }
  const t = v.total||d.q; if(!(t>0)) return null;
  return Math.max(0, Math.min(1, (t - v.wrong.length)/t));
}
function accCls(a){
  if(a===null||a===undefined) return 'a-na';
  if(a>=.85) return 'a-hi'; if(a>=.70) return 'a-md'; if(a>=.50) return 'a-lo'; return 'a-bad';
}
function accColor(a){
  if(a===null||a===undefined) return {b:'var(--bg2)', f:'var(--faint)'};
  if(a>=.85) return {b:'var(--green-soft)', f:'var(--green)'};
  if(a>=.70) return {b:'var(--purple-soft)', f:'var(--purple)'};
  if(a>=.50) return {b:'var(--amber-soft)', f:'var(--amber)'};
  return {b:'var(--red-soft)', f:'var(--red)'};
}
function paperScore(p){
  const def = PAPERS[p.subj]; let got=0, full=0, wrong=0, recorded=0;
  def.secs.forEach(function(d){
    const v = p.secs[d.k]; if(!v) return;
    recorded++; full += d.pt;
    if(d.mode==='sub'){ got += v.score; }
    else { const t=v.total||d.q; wrong += v.wrong.length; got += d.pt*(t-v.wrong.length)/t; }
  });
  return { got:Math.round(got*10)/10, full:full, wrong:wrong, recorded:recorded,
           total:paperFull(p.subj), rate: full>0 ? got/full : null };
}
function parseNums(str){
  const out=[];
  String(str||'').split(/[^0-9]+/).forEach(function(x){
    if(!x) return; const n=parseInt(x,10);
    if(isFinite(n) && n>0 && out.indexOf(n)<0) out.push(n);
  });
  out.sort(function(a,b){return a-b;});
  return out;
}
function sortedPapers(){

  });
}

      if(!m.r && !m.t) return;             /* 没标注过的不进清单 */
      const parts=key.split('#'); const d=secDef(p.subj,parts[0]); if(!d) return;
      const v=p.secs[parts[0]]; if(!v || d.mode==='sub') return;
      if(v.wrong.indexOf(Number(parts[1]))<0) return;   /* 已改对就不再算 */
      out.push({ pid:p.id, key:key, subj:p.subj, year:p.year, sec:d, no:Number(parts[1]), m:m });
    });
  });
  return out;
}

function roundWrongDiff(cur, first){
  let conquered = 0, newly = 0;
  Object.keys(cur.secs||{}).forEach(function(k){
    const d = secDef(cur.subj, k); if(!d || d.mode==='sub') return;
    const dc = cur.secs[k], df = first.secs[k]; if(!df) return;
    const wc = dc.wrong||[], wf = df.wrong||[];
    wc.forEach(function(n){ if(wf.indexOf(n)<0) newly++; });
    wf.forEach(function(n){ if(wc.indexOf(n)<0) conquered++; });
  });
  return { conquered:conquered, newly:newly };
}

function normalize(o){
  const b = blank();
  if(!o || typeof o!=='object') return b;
  b.version = SCHEMA;
  b.overviewCollapsed = !!o.overviewCollapsed;
  b.vocabCollapsed = !!o.vocabCollapsed;
  b.createdAt = o.createdAt || b.createdAt;
  b.weekly = (o.weekly && typeof o.weekly==='object') ? o.weekly : {};
  b.ui = Object.assign({bannerAck:0}, o.ui||{});
  b.vocab = (o.vocab && typeof o.vocab==='object') ? o.vocab : {};
  b.lastYear = Math.round(Number(o.lastYear)||0);

  /* 升级路径：旧 v3（goals/records）或无 cats 的备份 —— 清空重来，仅保留 papers/weekly */
  if(!o.cats || !Array.isArray(o.cats)){
    b.papers = normalizePapers(o.papers);
    return b;
  }

  b.cats = o.cats.map(function(c,i){
    const ck = {};
    if(c.checkins && typeof c.checkins==='object'){
      Object.keys(c.checkins).forEach(function(d){
        if(/^\d{4}-\d{2}-\d{2}$/.test(d)) ck[d] = { at:(c.checkins[d]&&c.checkins[d].at)||new Date().toISOString() };
      });
    }
    const plans = (c.plans&&Array.isArray(c.plans)?c.plans:[]).map(function(p){
      return {
        id: p.id || uid('pl'),
        title: String(p.title||'未命名任务'),
        mode: (p.mode==='weekly' || p.mode==='today' || p.mode==='tomorrow') ? p.mode : 'daily',
        count: Math.max(1, Math.round(Number(p.count)||1)),
        from: /^\d{4}-\d{2}-\d{2}$/.test(p.from||'') ? p.from : todayStr(),
        wdays: Array.isArray(p.wdays) ? p.wdays.filter(function(w){ return w>=0&&w<=6; }) : [],
        done: (p.done&&typeof p.done==='object') ? p.done : {}
      };
    });
    return {
      id: c.id || ('c'+Date.now()+'_'+i),
      name: String(c.name||'未命名分类'),
      color: PALETTE[c.color] ? c.color : PKEYS[i % PKEYS.length],
      createdDate: /^\d{4}-\d{2}-\d{2}$/.test(c.createdDate||'') ? c.createdDate : todayStr(),
      seed: !!c.seed,
      note: c.note ? String(c.note).slice(0,160) : '',
      checkins: ck,
      plans: plans
    };
  });
  /* 真题试卷（v3 新增；旧备份里没有这个字段，保持空数组即可） */
  const seen = {};
  b.papers = (o.papers||[]).map(function(p,i){
    if(!p || typeof p!=='object') return null;
    const def = PAPERS[p.subj]; if(!def) return null;
    const yr = Math.round(Number(p.year)||0);
    if(!(yr>=1990 && yr<=2100)) return null;
    const src = (p.secs && typeof p.secs==='object') ? p.secs : {};
    const secs = {};
    def.secs.forEach(function(d){
      const v = src[d.k]; if(!v || typeof v!=='object') return;
      if(d.mode==='sub'){
        const sc = Number(v.score);
        if(!isFinite(sc) || sc<0) return;
        secs[d.k] = { score: Math.round(Math.min(d.pt, sc)*10)/10 };
      } else {
        const t = Math.max(1, Math.round(Number(v.total)||d.q));
        const w = (Array.isArray(v.wrong)?v.wrong:[]).map(function(x){ return Math.round(Number(x)); })
                   .filter(function(x){ return isFinite(x) && x>0; });
        const u = []; w.forEach(function(x){ if(u.indexOf(x)<0) u.push(x); });
        u.sort(function(a,b){ return a-b; });
        secs[d.k] = { total:t, wrong:u.slice(0,t) };
      }
    });
    if(!Object.keys(secs).length) return null;
    const ms = (p.marks && typeof p.marks==='object') ? p.marks : {};
    const marks = {};
    Object.keys(ms).forEach(function(key){
      const mk = ms[key]; if(!mk || typeof mk!=='object') return;
      const kp = key.split('#'); if(!secs[kp[0]]) return;
      const r  = REASONS[mk.r] ? mk.r : '';
      const t  = mk.t ? String(mk.t).slice(0,240) : '';
      if(!r && !t && !mk.redo) return;
      marks[key] = { r:r, t:t, redo: mk.redo?1:0 };
    });
    return { id: p.id || ('p'+Date.now()+'_'+i), subj:p.subj, year:yr, round: Math.max(1, Math.round(Number(p.round)||1)),
             secs:secs, marks:marks,
             updated: String(p.updated||'').slice(0,10) || todayStr(), seed: !!p.seed };
  }).filter(function(p){
    if(!p) return false;
    const k = p.subj+'@'+p.year+'@'+p.round;
    if(seen[k]) return false;          /* 同一科同一年同一轮只留一份 */
    seen[k] = 1; return true;
  });

        const u = []; w.forEach(function(x){ if(u.indexOf(x)<0) u.push(x); });

      if(!r && !t && !mk.redo) return;

    });
    return { id: p.id || ('p'+Date.now()+'_'+i), subj:p.subj, year:yr, round:(p.round||1), secs:secs, marks:marks,
             updated: String(p.updated||'').slice(0,10) || todayStr(), seed: !!p.seed };
  }).filter(function(p){ return !!p; });
  /* 合并同一「科目+年份+轮次」的重复记录：先到者保留，后到者仅补充空缺题型与错因，避免拆成多条、并修复二刷三刷被误吞 */
  const _m = {};
  list.forEach(function(p){
    const k = p.subj+'@'+p.year+'@'+p.round;
    if(!_m[k]){ _m[k] = p; return; }

    Object.keys(p.marks).forEach(function(mk){ if(!ex.marks[mk]) ex.marks[mk] = p.marks[mk]; });
  });
  return Object.keys(_m).map(function(k){ return _m[k]; });
}

/* ---------- 查询与计算 ---------- */
function catChecked(c, date){ return !!(c.checkins && c.checkins[date]); }
function todayChecked(c){ return catChecked(c, todayStr()); }

/* 连续天数：每周（周一起）允许 1 个休息日；本周第 1 次漏不断，第 2 次才断 */
function catStreak(c){
  const T = todayStr();
  let cur = catChecked(c,T) ? T : dAdd(T,-1);
  const stop = c.createdDate || dAdd(T,-400);
  const used = {};
  let n = 0, rest = [], guard = 0;
  while(guard++ < 500){
    if(dDiff(stop, cur) < 0) break;
    if(catChecked(c,cur)){ n++; }
    else {
      const wk = mondayOf(cur);
      if(!used[wk]){ used[wk] = cur; rest.push(cur); }
      else break;
    }
    cur = dAdd(cur,-1);
  }
  return { n:n, rest:rest };
}

/* 昨日漏打卡状态：'rest'(休息日吸收) | 'broken'(已滚入今日) | null */
function missedYesterday(c){
  const T = todayStr();
  const y = dAdd(T,-1);
  if(catChecked(c,y)) return null;
  if(dDiff(c.createdDate||y, y) < 0) return null;       // 分类昨天还没建
  const wk = mondayOf(y);
  const from = (dDiff(c.createdDate||wk, wk) < 0) ? (c.createdDate||wk) : wk;
  let missed = 0, d = from;
  let guard = 0;
  while(dDiff(d, y) >= 0 && guard++ < 20){
    if(!catChecked(c,d)) missed++;
    d = dAdd(d,1);
  }
  return missed <= 1 ? 'rest' : 'broken';
}

/* 周打卡率：本周一~周日，已打卡天数 / 7 */
function catWeekRate(c, mon){
  let n = 0;
  for(let i=0;i<7;i++){ if(catChecked(c, dAdd(mon,i))) n++; }
  return { days:n, rate:n/7 };
}
/* 月打卡率 */
function catMonthRate(c, ym){
  const y = +ym.slice(0,4), m = +ym.slice(5,7);
  const days = new Date(y, m, 0).getDate();
  let n = 0;
  for(let i=1;i<=days;i++){ const d = y+'-'+pad(m)+'-'+pad(i); if(catChecked(c,d)) n++; }
  return { days:n, total:days, rate:days? n/days : 0 };
}

/* 星期几在「周一起」的那一周里的偏移：wd 用 JS getDay 约定（0=周日..6=周六） */
function wdOff(wd){ return (wd+6)%7; }

/* 子计划出现日期 */
function planOcc(p){
  const out = [];
  if(p.mode==='today'){
    out.push(p.from || todayStr());
  } else if(p.mode==='tomorrow'){
    out.push(dAdd(p.from || todayStr(), 1));
  } else if(p.mode==='weekly'){
    const mon = mondayOf(p.from);
    for(let w=0; w<p.count; w++){
      p.wdays.forEach(function(wd){
        const d = dAdd(mon, w*7 + wdOff(wd));
        if(dDiff(p.from, d) >= 0) out.push(d);
      });
    }
  } else {
    for(let i=0;i<p.count;i++) out.push(dAdd(p.from, i));
  }
  out.sort();
  return out;
}
function planDoneToday(p){ return !!(p.done && p.done[todayStr()]); }
function planOccursOn(p, date){ return planOcc(p).indexOf(date) >= 0; }

/* 某分类今天的子计划是否全部完成 */
function allPlansDoneToday(c){
  const T = todayStr();
  const todays = (c.plans||[]).filter(function(p){ return planOccursOn(p, T); });
  if(!todays.length) return null; /* 没有子计划，不自动联动 */
  return todays.every(function(p){ return planDoneToday(p); });
}
/* 将某分类今天的所有子计划标记为 done/undone */
function setAllPlansToday(c, done){
  const T = todayStr();
  (c.plans||[]).forEach(function(p){
    if(planOccursOn(p, T)){
      p.done = p.done || {};
      if(done) p.done[T] = true; else delete p.done[T];
    }
  });
}

/* 分类排序：未今日打卡的在前，再按连续天数倒序 */
function sortedCats(){
  const T = todayStr();
  const arr = S.cats.slice();
  arr.sort(function(a,b){
    const ca = catChecked(a,T)?1:0, cb = catChecked(b,T)?1:0;
    if(ca!==cb) return ca-cb;
    return catStreak(b).n - catStreak(a).n;
  });
  return arr;
}

/* 周聚合：每天几个分类打了卡 */
function weekCheckins(mon){
  const days = []; for(let i=0;i<7;i++) days.push(dAdd(mon,i));
  const perDay = days.map(function(d){
    let n = 0; S.cats.forEach(function(c){ if(catChecked(c,d)) n++; }); return n;
  });
  let total = 0; perDay.forEach(function(x){ total += x; });
  return { days:days, perDay:perDay, total:total, cats:S.cats.length };
}
/* 月聚合 */
function monthCheckins(ym){
  const y = +ym.slice(0,4), m = +ym.slice(5,7);
  const days = new Date(y, m, 0).getDate();
  const perDay = []; let total = 0;
  for(let i=1;i<=days;i++){
    const d = y+'-'+pad(m)+'-'+pad(i);
    let n = 0; S.cats.forEach(function(c){ if(catChecked(c,d)) n++; });
    perDay.push(n); total += n;
  }
  return { year:y, month:m, days:days, perDay:perDay, total:total, cats:S.cats.length };
}

function ringSVG(pct, color, size){
  const s = size||88, r = (s/2)-7, cx = s/2, C = 2*Math.PI*r;
  const off = C * (1 - Math.min(1,pct/100));
  const gid = 'rg'+Math.random().toString(36).slice(2,7);
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 '+s+' '+s+'">' +
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0%" stop-color="'+color.m+'"/><stop offset="100%" stop-color="'+color.m+'" stop-opacity=".62"/></linearGradient></defs>' +
    '<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="#eef0f9" stroke-width="8"/>' +
    '<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="url(#'+gid+')" stroke-width="8" stroke-linecap="round" ' +
    'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+cx+' '+cx+')"/>' +
    '</svg>';
}

function renderVbWords(dateStr){
  var body = el('vbBody'); if(!body) return;
  var eh = el('vbExitHint'); if(eh) eh.style.display='none';
  var rec = S.vocab[dateStr];
  var words = (rec && rec.words) ? rec.words : [];
  if(!words.length){
    body.innerHTML = '<div class="vb-empty">'+ic('book',36,1.6)+'<p>该日没有生词</p></div>';
    return;
  }
  var h = '<div class="vb-count">│ '+words.length+' 词</div><div class="vb-list">';
  words.forEach(function(w, i){
    h += '<div class="vb-item" data-date="'+dateStr+'" data-idx="'+i+'" data-act="vb-toggle">'+
        '<div class="vb-word-inner">'+
          '<span class="vb-w">'+esc(w.w)+'</span>'+
          '<div class="vb-mean" style="display:none"><span class="vb-m">'+esc(w.m)+'</span></div>'+
        '</div>'+
        '<div class="vb-actions" style="display:none">'+
          '<button class="vb-btn vb-edit-btn" data-act="vb-edit" data-date="'+dateStr+'" data-idx="'+i+'">'+ic('edit',15)+'编辑</button>'+
          '<button class="vb-btn vb-del-btn" data-act="vb-del-word" data-date="'+dateStr+'" data-idx="'+i+'">'+ic('trash',15)+'删除</button>'+
        '</div>'+
      '</div>';
  });
  h += '</div>';
  body.innerHTML = h;
  /* bind date change */
  var picker = el('vbDatePick');
  if(picker){
    picker.value = dateStr;
    picker.onchange = function(){ renderVbWords(this.value); };
  }
  /* bind left-swipe on word items */
  Array.prototype.forEach.call(body.querySelectorAll('.vb-item'), function(item){
    var sx=0, sy=0, moved=false, swiped=item.classList.contains('swiped');
    var eh = el('vbExitHint');
    item.addEventListener('touchstart', function(e){
      sx=e.touches[0].clientX; sy=e.touches[0].clientY; moved=false;
      if(swiped && !e.target.closest('.vb-actions')){ item.classList.remove('swiped'); swiped=false; if(eh) eh.style.display='none'; }
    }, {passive:true});
    item.addEventListener('touchmove', function(e){
      if(!moved){
        var dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
        if(Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>30){ moved=true; e.preventDefault(); }
      }
    }, {passive:false});
    item.addEventListener('touchend', function(e){
      if(!moved) return;
      var ex = e.changedTouches[0].clientX - sx;
      if(swiped){
        if(ex > 50){ item.classList.remove('swiped'); swiped=false; if(eh) eh.style.display='none'; }   /* 右滑退出 */
      } else if(ex < -60){
        item.classList.add('swiped'); swiped=true; if(eh) eh.style.display='flex';                      /* 左滑展开 */
      }
    });
  });
}

/* ---------- 看板 · 真题正确率矩阵 ---------- */
let BSUBJ = null;
function paperMatrix(){
  const have = subjHave();
  const pset = {}; S.papers.forEach(function(p){ pset[p.subj+'@'+p.year]=1; });
  let h = '<div class="sec"><div class="sec-hd">'+ic('grid',16)+'<h2>真题正确率</h2>' +
          (have.length?'<span class="cnt">'+Object.keys(pset).length+' 套</span>':'')+'</div>';
  if(!have.length){
    return h + '<div class="card empty">'+ic('paper',30,1.7)+'<b>还没有真题数据</b>' +
      '<span>去「真题」页记一份，这里会按年份和题型排成一张正确率表。</span></div></div>';
  }
  if(!BSUBJ || have.indexOf(BSUBJ)<0) BSUBJ = have[0];
  if(have.length>1){
    h += '<div class="seg" style="margin-bottom:10px">' + have.map(function(k){
      return '<button class="'+(BSUBJ===k?'on':'')+'" data-act="bsubj" data-k="'+k+'">'+PAPERS[k].n+'</button>';
    }).join('') + '</div>';
  }
  const def = PAPERS[BSUBJ];
  /* 每组（科目@年份）只取最新一轮，避免同卷多刷重复成多行 */
  const byKey = {};
  S.papers.forEach(function(p){
    if(p.subj!==BSUBJ) return;
    const k = p.subj+'@'+p.year, cur = byKey[k];
    if(!cur || (p.round||1) > (cur.round||1)) byKey[k] = p;
  });
  const rows = Object.keys(byKey).map(function(k){ return byKey[k]; })
                       .sort(function(a,b){ return b.year-a.year; });
  const cell = function(a, sub){
    const c = accColor(a);
    if(a===null) return '<div class="cel" style="background:var(--bg2);color:var(--faint)">—</div>';
    return '<div class="cel" style="background:'+c.b+';color:'+c.f+'">'+Math.round(a*100)+'%' +
           (sub?'<small>'+sub+'</small>':'')+'</div>';
  };
  h += '<div class="card" style="padding:11px 12px"><div class="pmat-wrap"><table class="pmat"><thead><tr>' +
       '<th class="yh">年份</th>' +
       def.secs.map(function(d){ return '<th>'+esc(d.s)+'</th>'; }).join('') +
       '<th>全卷</th></tr></thead><tbody>';
  const sums = {}; def.secs.forEach(function(d){ sums[d.k] = []; });
  const wholes = [];
  rows.forEach(function(p){
    h += '<tr><td class="yl">'+p.year+'</td>';
    def.secs.forEach(function(d){
      const v = p.secs[d.k];
      if(!v){ h += '<td>'+cell(null)+'</td>'; return; }
      const a = secAcc(BSUBJ, d.k, v);
      sums[d.k].push(a);
      const sub = d.mode==='sub' ? (nfm(v.score)+'/'+d.pt) : ((v.total-v.wrong.length)+'/'+v.total);
      h += '<td>'+cell(a, sub)+'</td>';
    });
    const sc = paperScore(p);
    if(sc.rate!==null) wholes.push(sc.rate);
    h += '<td>'+cell(sc.rate, nfm(sc.got)+'/'+sc.full)+'</td></tr>';
  });
  const avg = function(arr){ return arr.length ? arr.reduce(function(a,b){return a+b;},0)/arr.length : null; };
  if(rows.length>1){
    h += '<tr class="avg"><td class="yl">均值</td>' +
      def.secs.map(function(d){ return '<td>'+cell(avg(sums[d.k]), sums[d.k].length?sums[d.k].length+' 年':'')+'</td>'; }).join('') +
      '<td>'+cell(avg(wholes))+'</td></tr>';
  }
  h += '</tbody></table></div>';

  /* 洞察：最弱题型 + 错因分布 */
  let weak = null;
  def.secs.forEach(function(d){
    const a = avg(sums[d.k]); if(a===null) return;
    if(!weak || a < weak.a) weak = { d:d, a:a, n:sums[d.k].length };
  });
  const rc = {}; let mkTotal = 0;
  rows.forEach(function(p){
    Object.keys(p.marks).forEach(function(key){
      const r = p.marks[key].r; if(!r) return;
      rc[r] = (rc[r]||0)+1; mkTotal++;
    });
  });
  const rlist = RS_ORDER.filter(function(r){ return rc[r]; })
    .sort(function(a,b){ return rc[b]-rc[a]; })
    .map(function(r){ return REASONS[r]+' '+rc[r]; });
  h += '<div style="border-top:1px solid var(--line2);margin-top:10px;padding-top:10px;font-size:12px;color:var(--ink2);line-height:1.75">';
  if(weak){
    h += '<div style="display:flex;gap:6px;align-items:flex-start">'+ic('target',13,2.2) +
      '<span>最该补的是 <b style="color:'+accColor(weak.a).f+'">'+esc(weak.d.n)+'</b>，' +
      (rows.length>1 ? weak.n+' 份卷平均 ' : '') + '<b>'+Math.round(weak.a*100)+'%</b>。</span></div>';
  }
  h += '<div style="display:flex;gap:6px;align-items:flex-start;margin-top:3px">'+ic('tag',13,2.2) +
    '<span>'+(mkTotal ? '标过原因的 '+mkTotal+' 道题里：'+rlist.join(' · ')
                      : '还没给错题标原因 —— 标上以后，这里会告诉你到底是不会，还是马虎。')+'</span></div>';
  h += '</div></div></div>';
  return h;
}

/* (近14天打卡趋势板块已移除) */
function niceTick(max){
  const raw = max/4;
  const p = Math.pow(10, Math.floor(Math.log(raw)/Math.LN10));
  const n = raw/p;
  const m = n<=1?1:(n<=2?2:(n<=5?5:10));
  return Math.max(1, m*p);
}

  def.secs.forEach(function(d){
    const v = p.secs[d.k]; if(!v) return;
    const a = secAcc(p.subj, d.k, v), c = accColor(a);

    h += '<div class="pbar"><span class="pn">'+esc(d.n)+'</span>' +
      '<span class="pt"><i style="width:'+(a*100).toFixed(1)+'%;background:'+c.f+'"></i></span>' +
      '<span class="pv" style="color:'+c.f+'">'+Math.round(a*100)+'% <span style="color:var(--faint);font-weight:600">'+right+'</span></span></div>';
  });

  const chips = [];
  def.secs.forEach(function(d){
    const v = p.secs[d.k]; if(!v) return;
    if(d.mode==='sub'){
      const key = d.k+'#0', m = p.marks[key];
      const has = m && (m.r||m.t);
      chips.push('<button class="wchip '+(m&&m.redo?'done':(m&&m.r?'r-'+m.r:''))+'" data-act="mark" data-id="'+p.id+'" data-key="'+key+'">' +
        esc(d.s)+(has ? (m.r?' <em>'+REASONS[m.r]+'</em>':' <em>已备注</em>') : ' <em>加备注</em>')+'</button>');
      return;
    }
    v.wrong.forEach(function(no){
      const key = d.k+'#'+no, m = p.marks[key] || {r:'',t:'',redo:0};
      chips.push('<button class="wchip '+(m.redo?'done':(m.r?'r-'+m.r:''))+'" data-act="mark" data-id="'+p.id+'" data-key="'+key+'">' +
        esc(d.s)+' '+no+(m.r?' <em>'+REASONS[m.r]+'</em>':'')+'</button>');
    });
  });
  if(chips.length){
    const marked = chips.filter(function(x){ return x.indexOf('<em>')>0 && x.indexOf('加备注')<0; }).length;
    h += '<div style="font-size:11.5px;color:var(--faint);margin-top:10px;display:flex;align-items:center;gap:5px">' +
      ic('tag',12,2.2)+'点一下错题，写清为什么错（已标 '+marked+'/'+chips.length+'）</div>';
    h += '<div class="wchips">'+chips.join('')+'</div>';
  }
  if(first && p.round>1 && first.id!==p.id){
    const d = roundWrongDiff(p, first);
    h += (d.conquered||d.newly)
      ? '<div class="rt-cmp">'+ic('history',12,2.2)+'对比一刷：<b class="ok">攻克 '+d.conquered+' 题</b>' +
        (d.newly ? ' · <b class="no">新错 '+d.newly+' 题</b>' : ' · <b class="ok">无新错</b>') + '</div>'
      : '<div class="rt-cmp">'+ic('history',12,2.2)+'对比一刷：<b class="ok">本轮错题与一刷完全一致</b></div>';
  }
  h += '<div style="font-size:11px;color:var(--faint);margin-top:9px">更新于 '+md(p.updated)+'</div>';
  return h + '</div></div>';
}

function paperGroupHeader(g){
  const p0 = g[0], def = PAPERS[p0.subj];
  const scArr = g.map(function(p){ return { p:p, sc:paperScore(p) }; });
  const strip = scArr.map(function(o, i){
    const prev = i>0 ? scArr[i-1].sc.rate : null;
    let arrow = '';
    if(i>0 && o.sc.rate!==null && prev!==null){
      arrow = o.sc.rate > prev ? ' ▲' : (o.sc.rate < prev ? ' ▼' : '');
    }
    return '<span class="rt-pill '+accCls(o.sc.rate)+'">'+roundLabel(o.p.round)+' '+Math.round((o.sc.rate||0)*100)+'%'+arrow+'</span>';
  }).join('<span class="rt-arrow">→</span>');
  const first = scArr[0].sc.rate, last = scArr[scArr.length-1].sc.rate;
  let delta = '';
  if(scArr.length>1 && first!==null && last!==null){
    const dv = Math.round((last-first)*100);
    delta = '<span class="rt-delta '+(dv>=0?'up':'down')+'">'+(dv>=0?'+':'')+dv+'% vs 一刷</span>';
  }
  return '<div class="pgroup-hd"><div class="pgh-main">' +
    '<span class="pyr">'+p0.year+'</span><span class="psb">'+def.s+'</span>' +
    '<span class="rt-strip">'+strip+'</span>'+delta+'</div>' +
    '<button class="btn btn-ghost btn-xs" data-act="add-round" data-id="'+g[g.length-1].id+'">'+ic('plus',13)+'加一轮</button></div>';
}

function fourOf(mon){
  const w = S.weekly[mon] || {};
  return { keep:w.keep||'', problem:w.problem||'', tryNext:w.tryNext||'', plan:w.plan||'' };
}
function deltaHTML(cur, prev, unit){
  if(prev===0 && cur===0) return '<div class="delta flat">'+ic('minus',11,2.4)+'与上周持平</div>';
  if(prev===0) return '<div class="delta up">'+ic('arrowup',11,2.4)+'上周为 0</div>';
  const d = cur - prev;
  if(d===0) return '<div class="delta flat">'+ic('minus',11,2.4)+'与上周持平</div>';
  const pct = Math.round(Math.abs(d)/prev*100);
  return '<div class="delta '+(d>0?'up':'down')+'">'+ic(d>0?'arrowup':'arrowdown',11,2.4)+
         (d>0?'+':'-')+nfm(Math.abs(d))+(unit||'')+' · '+pct+'%</div>';
}

function buildReport(){

  const f = fourOf(mon);
  const sun = dAdd(mon,6);
  let pOcc=0, pDone=0, pTotal=0;
  S.cats.forEach(function(c){ (c.plans||[]).forEach(function(p){ pTotal++; planOcc(p).forEach(function(d){ if(dDiff(d,mon)<=0 && dDiff(d,sun)>=0){ pOcc++; if(p.done&&p.done[d]) pDone++; } }); }); });

  t += '子计划完成：本周出现 '+pOcc+' 次，已完成 '+pDone+' 次（共 '+pTotal+' 个子计划）\n';

function savePlan(cid, pid){
  const cat = S.cats.filter(function(x){ return x.id===cid; })[0]; if(!cat) return;
  const title = (el('sp_title').value||'').trim();
  if(!title){ toast('给任务起个名字'); if(el('sp_title')) el('sp_title').focus(); return; }
  const modal = el('modal');
  const activeModeBtn = modal.querySelector('[data-mode].btn-pri');
  const mode = activeModeBtn ? activeModeBtn.dataset.mode : 'daily';
  let from, count = 1, wdays = [];
  if(mode==='today'){ from = todayStr(); }
  else if(mode==='tomorrow'){ from = dAdd(todayStr(),1); }
  else { from = (el('sp_from').value || todayStr()); }
  if(mode==='weekly'){
    count = Math.max(1, Math.round(Number(el('sp_wcount').value)||1));
    wdays = Array.prototype.slice.call(el('sp_wd').querySelectorAll('.wdb.on')).map(function(b){ return Number(b.dataset.wd); });

  } else if(mode==='daily'){
    count = Math.max(1, Math.round(Number(el('sp_count').value)||1));
  }
  const patch = { title:title, mode:mode, count:count, from:from, wdays:wdays };
  if(pid){
    const p = (cat.plans||[]).filter(function(x){ return x.id===pid; })[0];
    if(p){ Object.assign(p, patch); }
    toast('已保存');
  } else {
    patch.id = uid('p'); patch.done = {};
    cat.plans = cat.plans || [];
    cat.plans.push(patch);
    toast('子计划已添加');

}
function delPlan(cid, pid){

function pfLoad(srcObj){
  const def = PAPERS[PF.subj];
  let src = srcObj || null;
  if(!src && PF.editId) src = S.papers.filter(function(x){ return x.id===PF.editId; })[0];
  if(!src && PF.roundSrc) src = S.papers.filter(function(x){ return x.id===PF.roundSrc; })[0];
  PF.rows = {};
  def.secs.forEach(function(d){
    const v = src && src.secs[d.k];
    if(d.mode==='sub') PF.rows[d.k] = { on: !!v, score: v ? v.score : '' };
    else PF.rows[d.k] = { on: !!v, allright: !!(v && !v.wrong.length), total: v ? v.total : d.q, wrong: v ? v.wrong.slice() : [] };
  });

function existingPaper(subj,year,round){
  return S.papers.filter(function(x){ return x.subj===subj && x.year===year && (x.round||1)===round; })[0] || null;
}
function pfYears(){

}
function qgridHTML(k){

function pfRowsHTML(){
  const def = PAPERS[PF.subj];
  let h = '<div class="card" style="padding:4px 13px;margin-bottom:10px">';
  def.secs.forEach(function(d){

      '</span></div>';

      h += '<div class="pr"><span class="ptag">第 '+d.from+'-'+d.to+' 题 · '+d.pt+' 分</span>' +

  });
  h += '</div><div id="pfSum" class="card" style="padding:11px 13px;background:var(--grad-soft);border-color:var(--purple-line)">'+pfSum()+'</div>';
  return h;
}
function pfStat(k){
  const d = secDef(PF.subj, k), r = PF.rows[k];
  if(!r.on) return '<span style="color:var(--faint)">未记录 —— 没做或不想记就留着空</span>';
  if(d.mode==='sub'){
    const sc = Number(r.score);
    if(!isFinite(sc) || r.score==='') return '<span style="color:var(--faint)">未记录</span>';
    const a = Math.max(0, Math.min(1, sc/d.pt));
    return ic('check',11,2.4)+' '+nfm(Math.min(sc,d.pt))+' / '+d.pt+' 分 · <b style="color:'+accColor(a).f+'">'+Math.round(a*100)+'%</b>';
  }
  const t = Math.max(1, r.total||d.q), w = r.wrong.length;
  if(w > t) return '<span style="color:var(--red)">错题数（'+w+'）比总题量（'+t+'）还多，检查一下</span>';
  const a = (t-w)/t;
  const out = r.wrong.filter(function(n){ return n<d.from || n>d.to; });
  return ic('check',11,2.4)+' 对 '+(t-w)+' / '+t+' 题 · <b style="color:'+accColor(a).f+'">'+Math.round(a*100)+'%</b>' +
    (w===0 ? ' <span style="color:var(--green)">全对</span>' : '') +
    (out.length ? ' <span style="color:var(--amber)">（'+out.join('、')+' 不在本题型题号范围内，仍照记）</span>' : '');
}
function pfSum(){
  const def = PAPERS[PF.subj]; let got=0, full=0, n=0, wrong=0;
  def.secs.forEach(function(d){
    const r = PF.rows[d.k]; if(!r.on) return;
    if(d.mode==='sub'){
      const sc = Number(r.score); if(!isFinite(sc)||r.score==='') return;
      n++; full += d.pt; got += Math.min(sc, d.pt);
    } else {
      const t = Math.max(1, r.total||d.q), w = Math.min(r.wrong.length, t);
      n++; full += d.pt; wrong += w; got += d.pt*(t-w)/t;
    }
  });
  if(!n) return '<span style="font-size:12.5px;color:var(--muted)">还没填任何题型 —— 至少填一个才能保存。</span>';
  const a = full>0 ? got/full : 0;
  return '<div style="font-size:12.5px;color:var(--ink2);line-height:1.6">已记 <b>'+n+'</b> 个题型 · 错 <b>'+wrong+'</b> 题 · ' +
    '估分 <b style="color:'+accColor(a).f+'">'+nfm(Math.round(got*10)/10)+'</b> / '+full+' 分' +
    '（全卷 '+paperFull(PF.subj)+' 分）· 正确率 <b style="color:'+accColor(a).f+'">'+Math.round(a*100)+'%</b></div>';
}

function savePaper(){
  const def = PAPERS[PF.subj], secs = {};
  def.secs.forEach(function(d){
    const r = PF.rows[d.k]; if(!r.on) return;
    if(d.mode==='sub'){
      const sc = Number(r.score);
      if(!isFinite(sc) || r.score==='' || sc<0) return;
      secs[d.k] = { score: Math.round(Math.min(sc, d.pt)*10)/10 };
    } else {
      const t = Math.max(1, Math.round(r.total)||d.q);
      secs[d.k] = { total:t, wrong: r.wrong.slice(0,t) };
    }
  });
  if(!Object.keys(secs).length){ toast('至少填一个题型才能保存'); return; }
  let p = PF.editId ? S.papers.filter(function(x){ return x.id===PF.editId; })[0] : null;
  let mergedEx = false;
  if(!p){ const ex = existingPaper(PF.subj, PF.year, PF.round); if(ex){ p = ex; mergedEx = true; } }
  let dropped = 0;
  if(p){
    if(mergedEx){
      /* 兜底：未走编辑态却撞到已有记录时，以旧题型为底、本次填写覆盖，避免丢失之前记录 */
      const m = {};
      Object.keys(p.secs).forEach(function(k){ m[k] = p.secs[k]; });
      Object.keys(secs).forEach(function(k){ m[k] = secs[k]; });
      p.secs = m; p.year = PF.year; p.updated = todayStr();
    } else {
      p.secs = secs; p.year = PF.year; p.updated = todayStr();
      Object.keys(p.marks).forEach(function(key){
        const kp = key.split('#'), v = secs[kp[0]], d = secDef(p.subj, kp[0]);
        if(!v || !d){ delete p.marks[key]; dropped++; return; }
        if(d.mode!=='sub' && v.wrong.indexOf(Number(kp[1]))<0){ delete p.marks[key]; dropped++; }
      });
    }
  } else {
    p = { id:uid('p'), subj:PF.subj, year:PF.year, round:PF.round, secs:secs, marks:{}, updated:todayStr(), seed:false };
    S.papers.push(p);
  }
  /* 生词与年份记忆（英语二录入时记生词） */
  if(PF.subj==='eng2'){
    const done = VSECS.filter(function(k){ return PF.rows[k] && PF.rows[k].on; });
    const allright = done.length>0 && done.every(function(k){ return PF.rows[k].wrong.length===0; });
    const words = (PF.vocab||[]).filter(function(x){ return x.w && x.m; });
    const rec = S.vocab[todayStr()] || { words:[], eng2done:false, eng2allright:false, review:{} };
    if(words.length) rec.words = words;          /* 仅当本轮真填了生词才覆盖，避免清空当天列表 */
    rec.eng2done = done.length>0; rec.eng2allright = allright;
    S.vocab[todayStr()] = rec;
  }
  S.lastYear = PF.year;
  const sc = paperScore(p);
  save(); closeModal(); PSUBJ = 'all'; go('papers');
  toast('已记下 '+PAPERS[p.subj].s+' '+p.year+(p.round>1?(' · '+roundLabel(p.round)):'')+' · 估分 '+nfm(sc.got)+'/'+sc.full +
        (dropped ? '（'+dropped+' 条旧备注随改对的题一起清掉了）' : ''));
}
function askDelPaper(pid){
  const p = S.papers.filter(function(x){ return x.id===pid; })[0]; if(!p) return;
  const sc = paperScore(p), mk = Object.keys(p.marks).length;
  openModal('删除这份真题记录？',

    '<button class="btn btn-ghost" data-act="closem">取消</button>' +

/* =========================================================
   彩带动效（手写 canvas，无外部库）
   ========================================================= */
function confetti(color){
  const cv = el('confetti');
  const ctx = cv.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cv.style.display = 'block';
  const cols = [color.m, '#7355f7', '#a855f7', '#0f9d58', '#f59e0b', '#38bdf8', '#f43f5e'];
  const N = 120, ps = [];
  for(let i=0;i<N;i++){
    ps.push({
      x: W*0.5 + (Math.random()-0.5)*W*0.5,
      y: -20 - Math.random()*H*0.35,
      vx: (Math.random()-0.5)*3.4,
      vy: 2.2 + Math.random()*3.6,
      w: 5 + Math.random()*7,
      h: 8 + Math.random()*8,
      r: Math.random()*Math.PI,
      vr: (Math.random()-0.5)*0.26,
      c: cols[(Math.random()*cols.length)|0],
      sh: Math.random()<0.28
    });
  }
  const t0 = Date.now();
  function frame(){
    const el2 = Date.now()-t0;
    ctx.clearRect(0,0,W,H);
    let alive = 0;
    for(let i=0;i<N;i++){
      const p = ps[i];
      p.vy += 0.045; p.vx *= 0.995;
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if(p.y < H+40) alive++;
      const fade = el2>2200 ? Math.max(0, 1-(el2-2200)/900) : 1;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      if(p.sh){ ctx.beginPath(); ctx.arc(0,0,p.w*0.46,0,Math.PI*2); ctx.fill(); }
      else { ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); }
      ctx.restore();
    }
    if(alive>0 && el2<3200){ requestAnimationFrame(frame); }
    else { ctx.clearRect(0,0,W,H); cv.style.display='none'; }
  }
  requestAnimationFrame(frame);
}

document.addEventListener('click', function(ev){
  const nav = ev.target.closest('[data-tab]');
  if(nav){ go(nav.dataset.tab); return; }

  const sw = ev.target.closest('.sw');
  if(sw && el('f_sw')){
    Array.prototype.forEach.call(el('f_sw').querySelectorAll('.sw'), function(x){ x.classList.remove('on'); });
    sw.classList.add('on'); return;
  }

  const b = ev.target.closest('[data-act]');
  if(!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if(b.tagName==='A') ev.preventDefault();

  switch(a){
    case 'new-cat':    catForm(null); break;
    case 'edit-cat':   catForm(S.cats.filter(function(x){return x.id===id;})[0]); break;
    case 'savecat':    saveCat(id); break;
    case 'del-cat':    askDelCat(id); break;
    case 'dodel-cat':  doDelCat(id); break;
    case 'add-plan':   { const c=S.cats.filter(function(x){return x.id===id;})[0]; if(c) subPlanForm(c,null); break; }
    case 'save-plan':  savePlan(b.dataset.cid, b.dataset.pid); break;
    case 'edit-plan':  { const c=S.cats.filter(function(x){return x.id===b.dataset.cid;})[0]; if(c){ const p=(c.plans||[]).filter(function(x){return x.id===b.dataset.pid;})[0]; if(p) subPlanForm(c,p); } break; }
    case 'del-plan':   delPlan(b.dataset.cid, b.dataset.pid); break;
    case 'checkin-toggle': {
      const cid=b.dataset.id, d=todayStr();
      const c = S.cats.filter(function(x){return x.id===cid;})[0]; if(!c) break;
      if(catChecked(c,d)){
        delete c.checkins[d];
        setAllPlansToday(c, false);
      } else {
        c.checkins[d] = { at:new Date().toISOString() };
        setAllPlansToday(c, true);
      }
      save();
      if(TAB==='today') renderToday(); else if(TAB==='board') renderBoard();
      renderNav(); renderBanner();
      break;
    }
    case 'toggle-sec': {
      var secId = b.dataset.sec;
      var sec = el('sec-'+secId);
      if(sec){
        var collapsed = sec.classList.toggle('collapsed');
        if(secId === 'overview'){ S.overviewCollapsed = collapsed; save(); }
        if(secId === 'yvocab'){ S.vocabCollapsed = collapsed; save(); }
      }
      break;
    }
    case 'tick-plan': {
      const cid=b.dataset.cid, pid=b.dataset.pid, d=todayStr();
      const c = S.cats.filter(function(x){return x.id===cid;})[0]; if(!c) break;
      const p = (c.plans||[]).filter(function(x){return x.id===pid;})[0]; if(!p) break;
      p.done = p.done || {};
      if(p.done[d]) delete p.done[d]; else p.done[d] = true;
      /* 联动：全部子计划完成 → 自动打卡标签；有未完成的 → 若标签当前已打卡则取消 */
      const allDone = allPlansDoneToday(c);
      if(allDone === true && !catChecked(c,d)){
        c.checkins[d] = { at:new Date().toISOString() };
      } else if(allDone === false && catChecked(c,d)){
        /* 只有当"所有子计划都完成"这个条件不再满足时才取消标签打卡
           但如果用户手动打过卡（比如根本没有子计划），不应该被取消 */
        delete c.checkins[d];
      }
      save(); renderToday();
      renderNav(); renderBanner();
      break;
    }
    case 'closem':     closeModal(); break;
    case 'wk': {
      const nx = dAdd(WEEK_CURSOR, Number(b.dataset.d)*7);
      if(dDiff(mondayOf(todayStr()), nx) > 0) break;
      WEEK_CURSOR = nx; renderWeekly(); break;
    }
    case 'genreport': {
      const txt = buildReport();
      el('reportBox').innerHTML =
        '<div class="card" style="padding:13px">' +
        '<div class="sec-hd" style="margin:0 0 8px">'+ic('doc',15)+'<h2>周报文本</h2><span class="sp"></span>' +
        '<button class="btn btn-xs btn-ghost" data-act="copyreport">'+ic('copy',13)+'复制</button></div>' +
        '<div class="report" id="reportTxt">'+esc(txt)+'</div></div>';
      el('reportBox').scrollIntoView({behavior:'smooth', block:'nearest'});
      break;
    }
    case 'copyreport': {
      const txt = el('reportTxt').textContent;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){ toast('已复制到剪贴板'); },
          function(){ fallbackCopy(txt); });
      } else fallbackCopy(txt);
      break;
    }
    /* ---- 真题错题 ---- */
    case 'new-paper':  paperForm(null); break;
    case 'edit-paper': paperForm(id); break;
    case 'del-paper':  askDelPaper(id); break;
    case 'add-round':  paperForm(null, { roundFor: id }); break;
    case 'dodelpaper': doDelPaper(id); break;
    case 'savepaper':  savePaper(); break;
    case 'pfilter':    PSUBJ = b.dataset.subj; renderPapers(); break;
    case 'bsubj':      BSUBJ = b.dataset.k; renderBoard(); break;
    case 'mark':       markModal(id, b.dataset.key); break;
    case 'savemark':   saveMark(); break;
    case 'clearmark':  clearMark(); break;

        x.classList.toggle('on', x.dataset.k===PF.subj);
      });
      el('pfBody').innerHTML = pfRowsHTML(); el('pfTip').innerHTML = pfTip();
      break;

    case 'vocab-save': {

        const w = r.querySelector('.vword').value.trim();

      });
      PF.vocab = list;

      Array.prototype.forEach.call(rows.querySelectorAll('.vocrow-ed'), function(r){
        const w = r.querySelector('.vword').value.trim();
        const m = r.querySelector('.vmean').value.trim();

      });
      rows.insertAdjacentHTML('beforeend', vocabRowHTML('',''));

      const box = el('vocabBox'), collapsed = el('vocabCollapsed');

      if(collapsed){

          ? '<button type="button" class="btn btn-ghost btn-xs" data-act="vocab-toggle">'+ic('down',13)+'已记 '+list.length+' 个生词（收起）</button>'

      toast(list.length ? ('已保存 '+list.length+' 个 · 可继续添加') : '没有可保存的生词');
      break;
    }
    case 'vocab-toggle': {
      const box = el('vocabBox'), collapsed = el('vocabCollapsed'), rows = el('vocabRows');
      const ft = box ? box.querySelector('.vocab-ft') : null;
      if(box && collapsed && rows){

    /* ---- 生词本看板 ---- */
    case 'vb-toggle': {
      var item = b.closest('.vb-item');
      if(!item) break;
      var mean = item.querySelector('.vb-mean');
      if(mean){
        var hidden = mean.style.display==='none';
        mean.style.display = hidden ? '' : 'none';
        item.classList.toggle('vb-expanded', hidden);
      }
      break;
    }
    case 'vb-edit': {
      var dt = b.dataset.date, idx = Number(b.dataset.idx);
      var rec = S.vocab[dt]; if(!rec || !rec.words[idx]) break;
      var w = rec.words[idx];
      var ov = document.createElement('div'); ov.className='vb-edit-overlay';
      ov.innerHTML = '<div class="vb-edit-card">'+
        '<div class="vb-edit-handle"></div>'+
        '<h3>'+ic('edit',18)+' 编辑生词</h3>'+
        '<div class="vb-edit-row"><input id="vbEW" type="text" inputmode="text" value="'+esc(w.w)+'" placeholder="单词" maxlength="24"></div>'+
        '<div class="vb-edit-row"><input id="vbEM" type="text" inputmode="text" value="'+esc(w.m)+'" placeholder="词义" maxlength="60"></div>'+
        '<div class="vb-edit-ft">'+
          '<button type="button" style="background:var(--bg2);color:var(--ink)" data-act="vb-edit-cancel">取消</button>'+
          '<button type="button" style="background:var(--purple);color:#fff" data-act="vb-edit-save" data-date="'+dt+'" data-idx="'+idx+'">保存</button>'+
        '</div></div>';
      ov.addEventListener('click', function(e){ if(e.target===ov) ov.remove(); });
      document.body.appendChild(ov);
      var ew = el('vbEW'); if(ew){ ew.focus(); ew.select(); }
      break;
    }
    case 'vb-edit-cancel': {
      var ov = document.querySelector('.vb-edit-overlay');
      if(ov) ov.remove();
      break;
    }
    case 'vb-edit-save': {
      var edt = b.dataset.date, eix = Number(b.dataset.idx);
      var nW = el('vbEW'), nM = el('vbEM');
      if(!nW || !nM) break;
      var nw = nW.value.trim(), nm = nM.value.trim();
      if(!nw || !nm){ toast('单词和词义都要填哦'); if(!nw){ nW.focus(); } else { nM.focus(); } break; }
      if(S.vocab[edt] && S.vocab[edt].words[eix]){
        S.vocab[edt].words[eix].w = nw;
        S.vocab[edt].words[eix].m = nm;
        save();
        renderVbWords(edt);
      }
      var ov2 = document.querySelector('.vb-edit-overlay');
      if(ov2) ov2.remove();
      toast('已更新');
      break;
    }
    case 'vb-del-word': {
      var ddt = b.dataset.date, dix = Number(b.dataset.idx);
      var rec = S.vocab[ddt]; if(!rec || !rec.words[dix]) break;
      var w = rec.words[dix];
      openModal('删除这个生词？',
        '<div style="display:flex;gap:11px;align-items:flex-start;padding:2px 0 4px">' +
        '<div style="color:var(--red);flex:none">'+ic('alert',22)+'</div>' +
        '<div><b style="font-size:15px">'+esc(w.w)+'</b>' +
        '<div style="font-size:13px;color:var(--ink2);line-height:1.6;margin-top:6px">' +
        '删除后这个词会从「'+dt+'」的生词中移除，<b style="color:var(--red)">无法恢复</b>。<br>' +
        '「今日」界面的「昨日生词」也会同步更新。</div></div></div>',
        '<button class="btn btn-ghost" data-act="closem">再想想</button>' +
        '<button class="btn btn-danger" data-act="dodel-word" data-date="'+ddt+'" data-idx="'+dix+'">'+ic('trash',16)+'确认删除</button>');
      break;
    }
    case 'dodel-word': {
      var ddt = b.dataset.date, dix = Number(b.dataset.idx);
      if(S.vocab[ddt] && S.vocab[ddt].words){
        S.vocab[ddt].words.splice(dix, 1);
        save();
        closeModal();
        renderVbWords(ddt);
        toast('已删除');
      }
      break;
    }
case 'qpick': {
      if(!PF) break;
      const k = b.dataset.k, q = Number(b.dataset.q), r = PF.rows[k]; if(!r) break;
      const i = r.wrong.indexOf(q);
      if(i>=0) r.wrong.splice(i,1); else r.wrong.push(q);
      r.wrong.sort(function(a,b){ return a-b; });
      if(r.wrong.length){ r.on = true; r.allright = false; }
      else { r.on = !!r.allright; }
      b.classList.toggle('on');
      const fb = document.querySelector('[data-act="pfull"][data-k="'+k+'"]');
      if(fb) fb.className = 'btn btn-xs ' + (r.on && !r.wrong.length ? 'btn-pri' : 'btn-ghost');
      if(PF.subj==='eng2' && VSECS.indexOf(k)>=0 && el('vocabBox')) el('vocabBox').style.display = 'block';
      pfRefresh(k); break;
    }
    case 'mkreason': {
      if(!MK) break;
      const rr = b.dataset.r; MK.r = (MK.r===rr ? '' : rr);
      Array.prototype.forEach.call(el('mkR').querySelectorAll('button'), function(x){
        x.classList.toggle('on', x.dataset.r===MK.r);
      });
      break;
    }
    case 'mkredo': {
      if(!MK) break;
      MK.redo = Number(b.dataset.v);
      Array.prototype.forEach.call(el('mkD').querySelectorAll('button'), function(x){
        x.classList.toggle('on', Number(x.dataset.v)===MK.redo);
      });
      break;
    }
    case 'export': case 'banner-export': exportJSON(); break;
    case 'banner-close': S.ui.bannerAck = totalCheckins(); save(); renderBanner(); break;
    case 'import':   importJSON(); break;
    case 'migrate':  doMigrate(); break;
    case 'clearseed':clearSeed(); break;
  }
});
function fallbackCopy(txt){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制到剪贴板'); }
  catch(e){ toast('复制失败，请手动长按选中'); }
  document.body.removeChild(ta);
}

/* 周报四栏：输入即存 */
let saveT = null;
document.addEventListener('input', function(ev){
  const t = ev.target.closest('[data-four]');
  if(t){
    const mon = WEEK_CURSOR;
    if(!S.weekly[mon]) S.weekly[mon] = { keep:'', problem:'', tryNext:'', plan:'' };
    S.weekly[mon][t.dataset.four] = t.value;
    clearTimeout(saveT);
    saveT = setTimeout(function(){
      save();
      const tip = el('savedTip');
      if(tip){ tip.classList.add('on'); setTimeout(function(){ tip.classList.remove('on'); }, 1200); }
    }, 350);
    return;
  }
  /* 真题录入表单：边填边算 */
  const pr = ev.target.closest('[data-prow]');
  if(pr && PF){
    const k = pr.dataset.prow, r = PF.rows[k];
    if(!r) return;
    const raw = pr.value.trim();
    r.score = raw==='' ? '' : Number(raw);
    r.on = raw!=='' && isFinite(r.score) && r.score>=0;
    pfRefresh(k);
  }
});

/* 遮罩 / ESC 关闭 */
el('mask').addEventListener('click', function(ev){ if(ev.target===el('mask')) closeModal(); });
document.addEventListener('keydown', function(ev){
  if(ev.key==='Escape' && el('mask').classList.contains('on')) closeModal();
});

/* 跨天自动刷新（放着不关也能滚到新的一天） */
let curDay = todayStr();
setInterval(function(){
  const t = todayStr();
  if(t !== curDay){ curDay = t; WEEK_CURSOR = mondayOf(t); go(TAB); toast('新的一天，页面已更新'); }
}, 60000);
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && todayStr()!==curDay){ curDay = todayStr(); WEEK_CURSOR = mondayOf(curDay); go(TAB); }
});

/* =========================================================
   启动
   ========================================================= */
(function init(){
  const how = load();
  WEEK_CURSOR = mondayOf(todayStr());
  go('today');
  if(how==='migrated') setTimeout(function(){ toast('已自动迁移旧版本数据'); }, 500);
  
})();


</script>

<script>
/* PWA 安装提示（beforeinstallprompt） */
(function(){
  var bar=document.getElementById('pwaInstallBar');
  var btn=document.getElementById('pwaInstallBtn');
  var dis=document.getElementById('pwaDismissBtn');
  if(!bar) return;
  var deferredPrompt=null;
  // 浏览器发出"可安装"信号时显示提示条
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();
    deferredPrompt=e;
    bar.classList.add('show');
  });
  // 用户点"安装"
  if(btn) btn.addEventListener('click',function(){
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(choice){
      deferredPrompt=null;
      if(choice.outcome==='accepted'){
        bar.classList.remove('show');
      }
    }).catch(function(){});
  });
  // 用户点关闭
  if(dis) dis.addEventListener('click',function(){
    bar.classList.remove('show');
    deferredPrompt=null; // 本次会话不再弹出
  });
  // 已安装则隐藏
  window.addEventListener('appinstalled',function(){
    bar.classList.remove('show');
    deferredPrompt=null;
  });
})();
</script>
